<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI ज्ञान परीक्षा</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&family=Rozha+One&display=swap">
<style>
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #142440; --muted: #556275; --line: #D6DDE6;
  --accent: #B3123A; --navy: #1C3A66;
  --f-body: 'Mukta', 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', system-ui, sans-serif;
  --f-display: 'Rozha One', 'Mukta', 'Noto Serif Devanagari', Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --navy: #93B4E6;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --navy: #93B4E6;
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; }
a { color: var(--navy) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--accent); white-space: nowrap }
.brand span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px }
.wrap h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 12px }
.wrap p { margin: 0 0 14px }
@media (max-width: 640px) { .brand span { display: none } .wrap h1 { font-size: 28px } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../index.html"><b>AI तालिम</b><span>सन्धिखर्क नगरपालिका · २०८३ असोज २४ र २५</span></a>
</header>
<main class="wrap">
  <h1>AI ज्ञान परीक्षा</h1>
  <p>परीक्षा चाँडै उपलब्ध हुनेछ।</p>
</main>
</body>
</html>
