<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI ज्ञान परीक्षा</title>
<style>
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--ink:#1B2320;--muted:#5D6A65;--line:#DAD6CB;
  --accent:#1F5C4A;--accent-ink:#FFFFFF;--soft:#E7EFEA;--gold:#B7862B;--ok:#2E7D4F;--bad:#B3392F;--warn:#9A6B12;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513;--surface:#18201D;--ink:#EEF2EF;--muted:#A3B0AA;--line:#2C3833;
    --accent:#6FBF9D;--accent-ink:#0F1A15;--soft:#1E2B26;--gold:#D9A94E;--ok:#6FBF8E;--bad:#E8786C;--warn:#E7B45C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513;--surface:#18201D;--ink:#EEF2EF;--muted:#A3B0AA;--line:#2C3833;
  --accent:#6FBF9D;--accent-ink:#0F1A15;--soft:#1E2B26;--gold:#D9A94E;--ok:#6FBF8E;--bad:#E8786C;--warn:#E7B45C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:.2px}
h2{font-size:22px;font-weight:700;margin-bottom:12px}
h3{font-size:18px;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.on{background:var(--soft);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=password],input[type=text],select{width:100%;font:inherit;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:44px}
label{display:block;font-weight:700;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.progress>i{display:block;height:100%;background:var(--accent)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;margin-top:10px;padding:14px 16px}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.on .L{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:14px}
.qnav button{min-height:40px;padding:4px;font-size:14px}
.qnav button.done{border-color:var(--accent)}
.qnav button.cur{outline:2px solid var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid currentColor}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}
.tbl-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:15px}
th{background:var(--soft);font-size:13px}
.mx{width:34px;text-align:center;font-weight:700}
.mx.ok{color:var(--ok)}.mx.bad{color:var(--bad)}
.rev{border-left:4px solid var(--line);padding:12px 14px;margin-top:12px;border-radius:0 10px 10px 0;background:var(--surface)}
.rev.ok{border-left-color:var(--ok)}.rev.bad{border-left-color:var(--bad)}
.rev .ans{margin:6px 0 0}
.note{font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hide{display:none!important}
.msg{margin-top:8px;font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.field{margin-top:14px}
/* correlation / regression infographics (stats-viz.js) */
:root{--sv-pos:#2a78d6;--sv-neg:#e34948}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sv-pos:#3987e5;--sv-neg:#e66767}}
:root[data-theme="dark"]{--sv-pos:#3987e5;--sv-neg:#e66767}
svg.sv{width:100%;height:auto;display:block;font-family:inherit;overflow:visible}
.sv-grid{stroke:var(--line);stroke-width:1}.sv-zero{stroke:var(--muted);stroke-width:1.5}
.sv-tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.sv-lab{fill:var(--ink);font-size:13.5px;font-weight:600}.sv-val{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sv-axis{fill:var(--muted);font-size:12px}
rect.sv-pos,circle.sv-pos{fill:var(--sv-pos)}rect.sv-neg,circle.sv-neg{fill:var(--sv-neg)}rect.sv-faint{opacity:.45}
line.sv-pos{stroke:var(--sv-pos)}line.sv-neg{stroke:var(--sv-neg)}line.sv-ns{stroke:var(--muted)}circle.sv-ns{fill:var(--muted)}
.sv-ci{stroke-width:2.5;stroke-linecap:round}.sv-dot{stroke:var(--surface);stroke-width:2}
.sv-pt{fill:var(--accent);fill-opacity:.7;stroke:var(--surface);stroke-width:1.5}
.sv-fit{stroke:var(--ink);stroke-width:2;stroke-linecap:round}.sv-ref{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.sv-mean{fill:var(--ink)}
.sv-hit:hover .sv-lab{text-decoration:underline}
.sv-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:6px 0 2px}
.sv-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sv-insights{margin:10px 0 0;padding-left:20px}.sv-insights li{margin:6px 0;line-height:1.55}
.sv-sc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sv-sc-grid.sv-sc-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.sv-sc-grid,.sv-sc-grid.sv-sc-2{grid-template-columns:minmax(0,1fr)}}
.sv-sc-grid h3{font-size:15px;margin:0 0 4px}
@media (max-width:600px){.sv-lab{font-size:15px}.sv-val{font-size:13.5px}.sv-tick{font-size:12.5px}}
details.sv-table summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:12px}
</style>

  <header class="top">
    <div>
      <p style="margin:0 0 4px"><a data-home href="/workshop/index.html" style="font-weight:600;text-decoration:none">⌂ गृहपृष्ठ</a></p>

<script id="sv-src">
/* Charts and statistics, built into the page (a separate file named stats-… is blocked by some ad blockers).
   Source: public/workshop/assessment/stats-viz.js; tests/workshop/stats-viz.test.mjs checks the two are the same. */
/* Statistics and charts for the trainer's results dashboard: correlation of test scores with the
 * participants' demographics, a multiple linear regression, and the infographics that show them.
 * Plain functions (window.SV); charts are inline SVG that take the page's colours from CSS. */
(function (root) {
  "use strict";

  /* ---------- distributions ---------- */
  function logGamma(x) {
    var c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
    var y = x, t = x + 5.5, s = 1.000000000190015;
    t -= (x + 0.5) * Math.log(t);
    for (var j = 0; j < 6; j++) s += c[j] / ++y;
    return -t + Math.log(2.5066282746310005 * s / x);
  }
  function betacf(a, b, x) {
    var qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
    if (Math.abs(d) < 1e-30) d = 1e-30;
    d = 1 / d; var h = d;
    for (var m = 1; m <= 200; m++) {
      var m2 = 2 * m, aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30;
      c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
      d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30;
      c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30;
      d = 1 / d; var del = d * c; h *= del;
      if (Math.abs(del - 1) < 3e-12) break;
    }
    return h;
  }
  /* Regularised incomplete beta I_x(a, b). */
  function ibeta(x, a, b) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    var bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
  }
  /* Two-sided p for Student's t with df degrees of freedom. */
  function tP(t, df) { if (!isFinite(t)) return 0; return ibeta(df / (df + t * t), df / 2, 0.5); }
  /* Upper-tail p for F(d1, d2). */
  function fP(F, d1, d2) { if (!(F > 0)) return 1; return ibeta(d2 / (d2 + d1 * F), d2 / 2, d1 / 2); }
  /* Critical t for a two-sided interval (e.g. 0.95). */
  function tCrit(df, level) {
    var alpha = 1 - (level || 0.95), lo = 0, hi = 200;
    for (var i = 0; i < 80; i++) { var mid = (lo + hi) / 2; if (tP(mid, df) > alpha) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  }

  /* ---------- correlation ---------- */
  function mean(a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : null; }
  function ranks(a) {
    var idx = a.map(function (v, i) { return [v, i]; }).sort(function (p, q) { return p[0] - q[0]; });
    var r = new Array(a.length), i = 0;
    while (i < idx.length) {
      var j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
      var avg = (i + j) / 2 + 1; for (var k = i; k <= j; k++) r[idx[k][1]] = avg; i = j + 1;
    }
    return r;
  }
  function pearson(x, y) {
    var n = x.length; if (n < 3) return null;
    var mx = mean(x), my = mean(y), num = 0, dx = 0, dy = 0;
    for (var i = 0; i < n; i++) { num += (x[i] - mx) * (y[i] - my); dx += (x[i] - mx) * (x[i] - mx); dy += (y[i] - my) * (y[i] - my); }
    return dx === 0 || dy === 0 ? null : num / Math.sqrt(dx * dy);
  }
  /* r with its two-sided p (t test with n − 2 df) for Pearson or Spearman. */
  function corr(x, y, method) {
    var ok = []; for (var i = 0; i < x.length; i++) if (x[i] != null && y[i] != null && isFinite(x[i]) && isFinite(y[i])) ok.push(i);
    var xs = ok.map(function (i) { return x[i]; }), ys = ok.map(function (i) { return y[i]; }), n = ok.length;
    var r = method === "spearman" ? pearson(ranks(xs), ranks(ys)) : pearson(xs, ys);
    if (r === null) return { r: null, p: null, n: n };
    var p = Math.abs(r) >= 1 ? 0 : (n > 2 ? tP(r * Math.sqrt((n - 2) / (1 - r * r)), n - 2) : null);
    return { r: r, p: p, n: n };
  }
  /* Simple least-squares line y = a + b x. */
  function line(x, y) {
    var mx = mean(x), my = mean(y), sxy = 0, sxx = 0;
    for (var i = 0; i < x.length; i++) { sxy += (x[i] - mx) * (y[i] - my); sxx += (x[i] - mx) * (x[i] - mx); }
    if (!sxx) return null;
    var b = sxy / sxx; return { a: my - b * mx, b: b };
  }

  /* ---------- multiple linear regression (OLS) ---------- */
  function invert(M) {
    var n = M.length, A = M.map(function (row, i) { return row.concat(row.map(function (_, j) { return i === j ? 1 : 0; })); });
    for (var c = 0; c < n; c++) {
      var p = c; for (var r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      if (Math.abs(A[p][c]) < 1e-10) return null;
      var tmp = A[c]; A[c] = A[p]; A[p] = tmp;
      var piv = A[c][c]; for (var k = 0; k < 2 * n; k++) A[c][k] /= piv;
      for (var r2 = 0; r2 < n; r2++) if (r2 !== c) { var f = A[r2][c]; if (f) for (var k2 = 0; k2 < 2 * n; k2++) A[r2][k2] -= f * A[c][k2]; }
    }
    return A.map(function (row) { return row.slice(n); });
  }
  /* rows: records; y(r) → number|null; preds: [{key, label, get(r) → number|null}].
     Records with a missing value are left out; predictors that do not vary are dropped. */
  function regress(rows, y, preds) {
    var use = rows.filter(function (r) { var v = y(r); return v != null && isFinite(v) && preds.every(function (p) { var x = p.get(r); return x != null && isFinite(x); }); });
    var keep = preds.filter(function (p) { var vals = use.map(p.get); return vals.some(function (v) { return v !== vals[0]; }); });
    var dropped = preds.filter(function (p) { return keep.indexOf(p) < 0; });
    var n = use.length, k = keep.length;
    var base = { n: n, k: k, dropped: dropped, preds: keep };
    if (!k || n < k + 3) return Object.assign(base, { ok: false, reason: "few" });
    var X = use.map(function (r) { return [1].concat(keep.map(function (p) { return p.get(r); })); });
    var Y = use.map(y);
    if (!Y.some(function (v) { return v !== Y[0]; })) return Object.assign(base, { ok: false, reason: "novar" });
    var XtX = [], XtY = [];
    for (var i = 0; i <= k; i++) {
      XtX.push([]); var sy = 0;
      for (var j = 0; j <= k; j++) { var s = 0; for (var m = 0; m < n; m++) s += X[m][i] * X[m][j]; XtX[i].push(s); }
      for (var m2 = 0; m2 < n; m2++) sy += X[m2][i] * Y[m2];
      XtY.push(sy);
    }
    var inv = invert(XtX);
    if (!inv) return Object.assign(base, { ok: false, reason: "collinear" });
    var beta = inv.map(function (row) { return row.reduce(function (s, v, j) { return s + v * XtY[j]; }, 0); });
    var my = mean(Y), sse = 0, sst = 0;
    for (var q = 0; q < n; q++) { var fit = X[q].reduce(function (s, v, j) { return s + v * beta[j]; }, 0); sse += (Y[q] - fit) * (Y[q] - fit); sst += (Y[q] - my) * (Y[q] - my); }
    var df = n - k - 1, s2 = sse / df, tc = tCrit(df, 0.95);
    var r2 = sst ? 1 - sse / sst : 0, adj = 1 - (1 - r2) * (n - 1) / df;
    var F = r2 < 1 && k ? (r2 / k) / ((1 - r2) / df) : Infinity;
    var coefs = keep.map(function (p, i) {
      var b = beta[i + 1], se = Math.sqrt(Math.max(inv[i + 1][i + 1] * s2, 0)), t = se ? b / se : null;
      return { key: p.key, label: p.label, unit: p.unit || "", b: b, se: se, t: t, p: se ? tP(t, df) : null, lo: b - tc * se, hi: b + tc * se };
    });
    return Object.assign(base, { ok: true, intercept: beta[0], coefs: coefs, r2: r2, adjR2: adj, F: F, pF: fP(F, k, df), df: df, rmse: Math.sqrt(sse / n) });
  }

  /* ---------- formatting ---------- */
  var DEV = "०१२३४५६७८९";
  function np(s) { return String(s).replace(/[0-9]/g, function (d) { return DEV[+d]; }); }
  function f2(v, d) { if (v == null || !isFinite(v)) return "—"; var s = v.toFixed(d == null ? 2 : d); return s.replace(/^-/, "−"); }
  function signed(v, d) { return v == null ? "—" : (v > 0 ? "+" : "") + f2(v, d); }
  function pTxt(p) { if (p == null) return "—"; if (p < 0.001) return "p < 0.001"; return "p = " + p.toFixed(p < 0.1 ? 3 : 2); }
  function strength(r) { var a = Math.abs(r); return a < 0.1 ? "नगण्य" : a < 0.3 ? "कमजोर" : a < 0.5 ? "मध्यम" : "बलियो"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- charts (inline SVG; colours from the page's --sv-* custom properties) ---------- */
  var W = 440;
  function niceMax(v) { var steps = [0.25, 0.5, 1, 2, 2.5, 5, 10, 15, 20, 25, 30, 40, 50, 75, 100]; for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i]; return Math.ceil(v / 50) * 50; }

  /* Diverging bars, −1 … +1: one row per variable, its name above the bar. */
  function corrChart(rows) {
    var x0 = 8, x1 = W - 8, rowH = 52, top = 22, h = top + rows.length * rowH + 4;
    var X = function (v) { return x0 + (v + 1) / 2 * (x1 - x0); };
    var s = '<svg class="sv" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="सहसम्बन्ध चार्ट">';
    [-1, -0.5, 0, 0.5, 1].forEach(function (t) {
      s += '<line class="sv-grid' + (t === 0 ? ' sv-zero' : '') + '" x1="' + X(t) + '" x2="' + X(t) + '" y1="' + (top - 4) + '" y2="' + (h - 4) + '"/>' +
        '<text class="sv-tick" x="' + X(t) + '" y="12" text-anchor="middle">' + f2(t, t % 1 ? 1 : 0) + '</text>';
    });
    rows.forEach(function (r, i) {
      var y = top + i * rowH, by = y + 24;

      s += '<rect class="' + cls + '" x="' + a + '" y="' + by + '" width="' + w + '" height="16" rx="4"/>';
      var txt = "r = " + f2(r.r) + " · " + pTxt(r.p) + (r.p != null && r.p < 0.05 ? " ★" : "");
      var right = r.r >= 0, tx = right ? b + 6 : a - 6;
      if (right && tx > x1 - 150) { right = false; tx = a - 6; }

    });

  /* Coefficient (forest) plot: estimate with its 95% interval; a zero line; significant ones in colour. */
  function coefChart(coefs) {

        '<rect x="0" y="' + y + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>' +
        '<text class="sv-lab" x="' + x0 + '" y="' + (y + 14) + '">' + esc(c.label) + '</text>' +
        '<text class="sv-val" x="' + x1 + '" y="' + (y + 14) + '" text-anchor="end">' + esc(signed(c.b, 1) + " " + c.unit + " · " + pTxt(c.p) + (sig ? " ★" : "")) + '</text>' +
        '<line class="sv-ci ' + cls + '" x1="' + X(Math.max(c.lo, -m)) + '" x2="' + X(Math.min(c.hi, m)) + '" y1="' + cy + '" y2="' + cy + '"/>' +
        '<circle class="sv-dot ' + cls + '" cx="' + X(c.b) + '" cy="' + cy + '" r="6"/></g>';
    });
    return s + '</svg>';
  }

  /* Scatter of score against one variable, with the least-squares line. For an ordinal variable the
     points are spread sideways a little (the same way every time) and each group's mean is marked. */
  function scatter(pts, o) {
    var w = 300, h = 230, L = 40, R = 10, T = 12, B = 44;
    var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
    var xmin, xmax, xt = [];
    if (o.ticks) { xmin = -0.5; xmax = o.ticks.length - 0.5; }
    else if (o.xmin != null) { xmin = o.xmin; xmax = o.xmax; xt = o.xticks; }
    else {   // round ticks around the data: a step of 1, 2, 2.5 or 5 × 10^k, about four steps
      var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs), raw = (hi - lo) / 4 || 1, mag = Math.pow(10, Math.floor(Math.log10(raw)));
      var step = [1, 2, 2.5, 5, 10].map(function (k) { return k * mag; }).filter(function (v) { return v >= raw; })[0];
      xmin = Math.floor(lo / step) * step; xmax = Math.ceil(hi / step) * step; if (xmax === xmin) xmax = xmin + step;
      for (var q = xmin; q <= xmax + 1e-9; q += step) xt.push(+q.toFixed(6));
    }
    var ymin = o.ymin != null ? o.ymin : 0, ymax = o.ymax != null ? o.ymax : 100;
    var X = function (v) { return L + (v - xmin) / (xmax - xmin) * (w - L - R); };
    var Y = function (v) { return T + (1 - (v - ymin) / (ymax - ymin)) * (h - T - B); };
    var s = '<svg class="sv sv-sc" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(o.title || "") + '">';
    var yt = o.yticks || [0, 25, 50, 75, 100];
    yt.forEach(function (t) { s += '<line class="sv-grid' + (t === 0 ? ' sv-zero' : '') + '" x1="' + L + '" x2="' + (w - R) + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/><text class="sv-tick" x="' + (L - 6) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + esc((o.yfmt || String)(t)) + '</text>'; });
    if (o.ticks) o.ticks.forEach(function (t, i) { s += '<text class="sv-tick" x="' + X(i) + '" y="' + (h - B + 16) + '" text-anchor="middle">' + esc(t) + '</text>'; });
    else xt.forEach(function (v) { s += '<text class="sv-tick" x="' + X(v) + '" y="' + (h - B + 16) + '" text-anchor="middle">' + esc((o.xfmt || String)(v)) + '</text>'; });
    s += '<text class="sv-axis" x="' + ((L + w - R) / 2) + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(o.xLabel || "") + '</text>';
    if (o.diag) s += '<line class="sv-ref" x1="' + X(Math.max(xmin, ymin)) + '" y1="' + Y(Math.max(xmin, ymin)) + '" x2="' + X(Math.min(xmax, ymax)) + '" y2="' + Y(Math.min(xmax, ymax)) + '"/>';
    pts.forEach(function (p, i) {
      var jx = o.ticks ? (((i * 37) % 11) / 10 - 0.5) * 0.5 : 0;
      s += '<circle class="sv-pt" cx="' + X(p.x + jx).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4.5"><title>' + esc(p.tip || "") + '</title></circle>';
    });
    if (o.ticks) o.ticks.forEach(function (t, i) {
      var g = ys.filter(function (_, j) { return xs[j] === i; }); if (!g.length) return;
      var mY = mean(g); s += '<rect class="sv-mean" x="' + (X(i) - 14) + '" y="' + (Y(mY) - 2) + '" width="28" height="4" rx="2"><title>' + esc(t + ": औसत " + Math.round(mY) + " (n = " + g.length + ")") + '</title></rect>';
    });
    var ln = line(xs, ys);
    if (ln) {
      var a = o.ticks ? 0 : Math.min.apply(null, xs), b = o.ticks ? o.ticks.length - 1 : Math.max.apply(null, xs);
      var ya = Math.max(ymin, Math.min(ymax, ln.a + ln.b * a)), yb = Math.max(ymin, Math.min(ymax, ln.a + ln.b * b));

    }

function publicBegin(){
  if(!PUB||isAnonDone()) { renderApp(); return; }
  var open = PUB_TEST==="post" ? PUB.post_ok : PUB.pre_ok;
  if(!open){ renderApp(); return; }
  var err=$("profErr");

/* ---------- statistics ---------- */
function ranks(arr){
  var idx=arr.map(function(v,i){return [v,i];}).sort(function(a,b){return a[0]-b[0];});
  var r=new Array(arr.length);
  var i=0;
  while(i<idx.length){
    var j=i;
    while(j+1<idx.length && idx[j+1][0]===idx[i][0]) j++;
    var avg=(i+j)/2+1;
    for(var k=i;k<=j;k++) r[idx[k][1]]=avg;
    i=j+1;
  }
  return r;
}
function pearson(x,y){
  var n=x.length;
  if(n<3) return null;
  var mx=0,my=0;
  for(var i=0;i<n;i++){mx+=x[i];my+=y[i];}
  mx/=n;my/=n;
  var num=0,dx=0,dy=0;
  for(var j=0;j<n;j++){
    num+=(x[j]-mx)*(y[j]-my);
    dx+=(x[j]-mx)*(x[j]-mx);
    dy+=(y[j]-my)*(y[j]-my);
  }
  if(dx===0||dy===0) return null;
  return num/Math.sqrt(dx*dy);
}
function spearman(x,y){return pearson(ranks(x),ranks(y));}
/* eta-squared: share of score variation explained by group membership (0 to 1) */
function etaSquared(groups){
  var all=[];groups.forEach(function(g){g.forEach(function(v){all.push(v);});});
  var n=all.length;
  if(n<3) return null;
  var gm=all.reduce(function(a,b){return a+b;},0)/n;
  var sst=0;all.forEach(function(v){sst+=(v-gm)*(v-gm);});
  if(sst===0) return null;
  var ssb=0;
  groups.forEach(function(g){
    if(!g.length) return;
    var m=g.reduce(function(a,b){return a+b;},0)/g.length;
    ssb+=g.length*(m-gm)*(m-gm);
  });
  return ssb/sst;
}
function strengthWord(v){
  if(v===null) return "पर्याप्त डाटा छैन";
  var a=Math.abs(v);
  if(a<0.1) return "नगण्य";
  if(a<0.3) return "कमजोर";
  if(a<0.5) return "मध्यम";
  return "बलियो";
}
function etaWord(v){
  if(v===null) return "पर्याप्त डाटा छैन";
  if(v<0.01) return "नगण्य";
  if(v<0.06) return "कमजोर";
  if(v<0.14) return "मध्यम";
  return "बलियो";
}
function dirWord(v){
  if(v===null||Math.abs(v)<0.1) return "—";
  return v>0?"सकारात्मक (माथि जाँदा अङ्क बढ्ने)":"नकारात्मक (माथि जाँदा अङ्क घट्ने)";
}
function fmt(v,d){return v===null?"—":v.toFixed(d);}

/* ---------- dashboard (live) ---------- */
var trainerUnlocked=false;
var records=[];
var loaded=false;
var liveErr="";
var subscribed=false;
var dashFilter="all";

function unlock(){
  if(!(window.WS&&WS.isTrainer())){ $("gateMsg").classList.remove("hide"); return; }
  trainerUnlocked=true;
  $("gate").classList.add("hide");
  $("dashBody").classList.remove("hide");
  startLive();
}

async function loadSessions(){
  var res=await fetch(SB_URL+"/rest/v1/events?select=code,name,address,event_dates&order=created_at.desc",{headers:sbHeaders()});
  if(res.ok){ sessionList=(await res.json()).map(function(e){ return {code:e.code, client:e.name, location:e.address, session_date:EVI.info(e).dateRange||(e.event_dates||[])[0]||""}; }); }
}

function applySessionFilter(){
  records = sessionFilter==="all" ? allRecords : allRecords.filter(function(r){return r.session===sessionFilter;});
}

async function loadRows(){
  var res=await fetch(SB_URL+"/rest/v1/"+RESULTS+"?select=*&order=submitted_at.asc",{headers:sbHeaders()});
  if(!res.ok){ throw {code:"HTTP "+res.status}; }
  var rows=await res.json();
  allRecords=rows.map(fromRow).filter(validRecord).map(function(r){
    var B=itemsFor(r.qids);
    var sc=scoreOf(r.answers,B);
    return {session:r.session||"",test:r.test,code:r.code,gender:r.gender,ageGroup:r.ageGroup,education:r.education,submittedAt:r.submittedAt||"",seconds:r.seconds||0,answers:r.answers,qids:r.qids,score:sc,pct:pctOf(sc,B.length)};
  }).sort(function(a,b){return b.pct-a.pct || String(a.submittedAt).localeCompare(String(b.submittedAt));});
  try{ await loadSessions(); }catch(e){}
  applySessionFilter();
  loaded=true;
  liveErr="";
  renderDash();
}

function setSessionFilter(v){
  sessionFilter=v;
  applySessionFilter();
  renderDash();
}

async function startLive(){
  if(subscribed) return;
  subscribed=true;
  $("dashBody").innerHTML='<section class="card"><p class="muted">परिणामहरू लोड हुँदैछ…</p></section>';
  try{ await loadRows(); }catch(e){ liveErr=(e&&e.code)?e.code:"unknown"; renderDash(); }
  setInterval(function(){ loadRows().catch(function(e){ liveErr=(e&&e.code)?e.code:"unknown"; renderDash(); }); }, 20000);
}

function barRow(label,val,max,tone,showVal){
  var w=max>0?Math.round(val/max*100):0;
  return '<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><span>'+esc(label)+'</span><strong style="font-variant-numeric:tabular-nums">'+esc(showVal)+'</strong></div><div class="bar"><i style="display:block;height:100%;width:'+w+'%;background:'+tone+';border-radius:99px"></i></div></div>';
}

/* Per-factor summary: groups of pct scores */
function groupScores(recs,field,valsList){
  return valsList.map(function(v){
    var items=recs.filter(function(r){return r[field]===v;});
    var pcts=items.map(function(r){return r.pct;});
    var avg=pcts.length?pcts.reduce(function(a,b){return a+b;},0)/pcts.length:null;
    var pass=items.filter(function(r){return r.pct>=50;}).length;
    return {v:v,n:items.length,avg:avg,pass:pass,pcts:pcts};
  });
}

/* Per-record helpers: each record carries its own question ids, so events with different sets combine by question id. */
function recPos(r,id){ return (r.qids||[]).indexOf(id); }
function themeIds(r,theme){ return (r.qids||[]).filter(function(id){return POOL_BY_ID[id].s===theme;}); }
function shareRec(r,theme){
  var ids=themeIds(r,theme); if(!ids.length) return null;
  var c=0; ids.forEach(function(id){ if(r.answers[recPos(r,id)]===POOL_BY_ID[id].a) c++; });
  return c/ids.length*100;
}
function uniqueIds(recs){
  var seen={}; recs.forEach(function(r){ (r.qids||[]).forEach(function(id){ seen[id]=true; }); });
  return Object.keys(seen).map(Number).sort(function(a,b){return a-b;});
}

/* ---------- learning achievement (pre vs post, paired by participant code) ---------- */
function pairedRows(){
  var sorted=records.slice().sort(function(a,b){return String(a.submittedAt).localeCompare(String(b.submittedAt));});
  var pre={},post={};
  sorted.forEach(function(r){
    var k=(r.session||"")+"|"+r.code;
    if(r.test==="pre"){ if(!pre[k]) pre[k]=r; }
    else if(!post[k]) post[k]=r;
  });
  return Object.keys(pre).filter(function(k){return !!post[k];}).map(function(k){return {code:pre[k].code,pre:pre[k],post:post[k]};});
}

function learningSection(){
  var head='<section class="card"><h2>सिकाइ उपलब्धि (पूर्व बनाम पश्च)</h2>';
  var P=pairedRows(), k=P.length;
  if(k===0){
    return head+'<p class="muted">सिकाइ उपलब्धि मापन गर्न एउटै सहभागी कोडले पूर्व र पश्च दुवै परीक्षा दिएका सहभागी चाहिन्छन्। अहिलेसम्म त्यस्ता जोडी भेटिएका छैनन्।</p></section>';
  }
  var pre=P.map(function(p){return p.pre.pct;});
  var post=P.map(function(p){return p.post.pct;});
  var gains=P.map(function(p,i){return post[i]-pre[i];});
  var ngs=[];
  P.forEach(function(p,i){ if(pre[i]<100) ngs.push((post[i]-pre[i])/(100-pre[i])); });
  var preM=meanOf(pre), postM=meanOf(post), gM=meanOf(gains), ngM=meanOf(ngs);
  var sd=k>1?Math.sqrt(gains.reduce(function(a,g){return a+(g-gM)*(g-gM);},0)/(k-1)):0;
  var tStat=sd>0?gM/(sd/Math.sqrt(k)):null;
  var up=gains.filter(function(g){return g>0;}).length;
  var same=gains.filter(function(g){return g===0;}).length;
  var down=gains.filter(function(g){return g<0;}).length;
  var high=ngs.filter(function(x){return x>=0.7;}).length;
  var mid=ngs.filter(function(x){return x>=0.3&&x<0.7;}).length;
  var low=ngs.filter(function(x){return x<0.3;}).length;
  var nN=ngs.length;

  var sigTxt = tStat===null ? "पर्याप्त भिन्नता छैन।"
    : (Math.abs(tStat)>=2 ? "सुधार सांख्यिकीय रूपमा सार्थक देखिन्छ (t ≈ "+tStat.toFixed(2)+")।"
                          : "सुधार सानो वा अनिश्चित देखिन्छ (t ≈ "+tStat.toFixed(2)+")।");

  var out=head
    +'<p class="note">जोडी भनेको पूर्व र पश्च दुवैमा एउटै सहभागी कोड भएका सहभागी हुन्। सुधार = पश्च % − पूर्व %। सामान्यीकृत सिकाइ (g) = (पश्च − पूर्व) ÷ (१०० − पूर्व), जसले सम्भावित सुधारको कति भाग हासिल भयो भनी देखाउँछ।</p>'
    +'<div class="kpis">'
    +'<div class="kpi"><span class="muted small">जोडी सहभागी</span><b>'+k+'</b></div>'
    +'<div class="kpi"><span class="muted small">पूर्व औसत</span><b>'+Math.round(preM)+'%</b></div>'
    +'<div class="kpi"><span class="muted small">पश्च औसत</span><b>'+Math.round(postM)+'%</b></div>'
    +'<div class="kpi"><span class="muted small">औसत सुधार</span><b>'+(gM>=0?'+':'')+gM.toFixed(1)+' pp</b></div>'
    +'<div class="kpi"><span class="muted small">सामान्यीकृत सिकाइ (g)</span><b>'+(ngM===null?'—':ngM.toFixed(2))+'</b></div>'
    +'</div>'
    +'<p class="small muted" style="margin-top:12px">'+esc(sigTxt)+' उत्तर सुधार्नेको सङ्ख्या: '+up+', स्थिर: '+same+', घटेको: '+down+'।</p>'
    +'<h3 style="margin-top:18px">सिकाइ स्तर (सामान्यीकृत सिकाइ g)</h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>स्तर</th><th>दायरा</th><th>सहभागी</th><th>%</th></tr></thead><tbody>'
    +'<tr><td><span class="chip c-ok">उच्च</span></td><td>g ≥ 0.70</td><td>'+high+'</td><td>'+(nN?Math.round(high/nN*100):0)+'%</td></tr>'
    +'<tr><td><span class="chip c-warn">मध्यम</span></td><td>0.30 – 0.69</td><td>'+mid+'</td><td>'+(nN?Math.round(mid/nN*100):0)+'%</td></tr>'
    +'<tr><td><span class="chip c-bad">न्यून</span></td><td>g < 0.30</td><td>'+low+'</td><td>'+(nN?Math.round(low/nN*100):0)+'%</td></tr>'
    +'</tbody></table></div>'
    +'<p class="note" style="margin-top:6px">पूर्व परीक्षामा १००% अङ्क ल्याउनेको g गणना गरिँदैन।</p>';

  /* session-wise achievement (paired) */
  var srows=SESSIONS.map(function(s){
    var pv=P.map(function(p){return shareRec(p.pre,s.id);}).filter(function(x){return x!==null;});
    var qv=P.map(function(p){return shareRec(p.post,s.id);}).filter(function(x){return x!==null;});
    var pm=meanOf(pv), qm=meanOf(qv);
    var d=(pm===null||qm===null)?null:qm-pm;
    var tone=d===null?'var(--muted)':(d>=0?'var(--ok)':'var(--bad)');
    return '<tr><td>'+esc(s.label)+'</td><td>'+(pm===null?'—':Math.round(pm)+'%')+'</td><td>'+(qm===null?'—':Math.round(qm)+'%')+'</td><td style="color:'+tone+';font-weight:700">'+(d===null?'—':(d>=0?'+':'')+d.toFixed(1)+' pp')+'</td></tr>';
  }).join("");
  out+='<h3 style="margin-top:18px">सत्रगत सिकाइ उपलब्धि</h3>'
    +'<p class="note">प्रत्येक विषयमा पूर्व र पश्च परीक्षाका सही उत्तरको औसत प्रतिशत। सकारात्मक सुधार भएको विषयमा सिकाइ भएको देखिन्छ।</p>'
    +'<div class="tbl-wrap"><table><thead><tr><th>सत्र / विषय</th><th>पूर्व</th><th>पश्च</th><th>सुधार</th></tr></thead><tbody>'+srows+'</tbody></table></div>';

  /* group-wise gain */
  function gainRows(field,list,vals){
    return vals.map(function(v){
      var g=P.filter(function(p){return p.pre[field]===v;});
      var n=g.length;
      if(!n) return '<tr><td>'+esc(labelOf(list,v))+'</td><td>0</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>';
      var pa=meanOf(g.map(function(p){return p.pre.pct;}));
      var qa=meanOf(g.map(function(p){return p.post.pct;}));
      var ga=meanOf(g.filter(function(p){return p.pre.pct<100;}).map(function(p){return (p.post.pct-p.pre.pct)/(100-p.pre.pct);}));
      var gn=qa-pa;
      return '<tr><td>'+esc(labelOf(list,v))+'</td><td>'+n+'</td><td>'+Math.round(pa)+'%</td><td>'+Math.round(qa)+'%</td><td>'+(gn>=0?'+':'')+gn.toFixed(1)+' pp</td><td>'+(ga===null?'—':ga.toFixed(2))+'</td></tr>';
    }).join("");
  }
  var gtable=function(title,field,list,vals){
    return '<div><h3 style="margin-top:18px">'+esc(title)+'</h3><div class="tbl-wrap"><table><thead><tr><th>समूह</th><th>n</th><th>पूर्व</th><th>पश्च</th><th>सुधार</th><th>g</th></tr></thead><tbody>'+gainRows(field,list,vals)+'</tbody></table></div></div>';
  };
  out+='<h3 style="margin-top:22px">जनसांख्यिकी अनुसार सिकाइ</h3>'
    +'<div class="grid3">'
    +gtable("लिङ्ग","gender",GENDERS,GENDER_VALS)
    +gtable("उमेर समूह","ageGroup",AGES,AGE_VALS)
    +gtable("शैक्षिक तह","education",EDUS,EDU_VALS)
    +'</div>';

  /* correlation of gain with age, schooling, gender, and pre score */
  var ageIdx=P.map(function(p){return idxOf(AGES,p.pre.ageGroup);});
  var eduIdx=P.map(function(p){return idxOf(EDUS,p.pre.education);});
  var rAge=spearman(ageIdx,gains), rEdu=spearman(eduIdx,gains), rPre=spearman(pre,gains);
  var etaG=etaSquared(GENDER_VALS.map(function(v){return P.filter(function(p){return p.pre.gender===v;}).map(function(p){return p.post.pct-p.pre.pct;});}));
  out+='<h3 style="margin-top:22px">सिकाइ सुधार र जनसांख्यिकीबीचको सम्बन्ध</h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>चर</th><th>नाप</th><th>मान</th><th>बल</th><th>दिशा</th></tr></thead><tbody>'
    +'<tr><td>उमेर समूह</td><td>Spearman r</td><td>'+fmt(rAge,2)+'</td><td>'+strengthWord(rAge)+'</td><td>'+dirWord(rAge)+'</td></tr>'
    +'<tr><td>शैक्षिक तह</td><td>Spearman r</td><td>'+fmt(rEdu,2)+'</td><td>'+strengthWord(rEdu)+'</td><td>'+dirWord(rEdu)+'</td></tr>'
    +'<tr><td>लिङ्ग</td><td>η²</td><td>'+fmt(etaG,3)+'</td><td>'+etaWord(etaG)+'</td><td>समूह औसतमा आधारित</td></tr>'
    +'<tr><td>पूर्व परीक्षाको अङ्क</td><td>Spearman r</td><td>'+fmt(rPre,2)+'</td><td>'+strengthWord(rPre)+'</td><td>'+dirWord(rPre)+'</td></tr>'
    +'</tbody></table></div>'
    +'<p class="note" style="margin-top:6px">पूर्व अङ्क र सुधारबीचको नकारात्मक सम्बन्धले सामान्यतः कम अङ्क ल्याउनेले बढी सुधार देखाउने सङ्केत गर्छ। यसलाई कारण होइन, सम्बन्धका रूपमा मात्र लिनुहोस्।</p>';

  out+=gainInfographic(P);

  /* participant-level achievement */
  out+='<h3 style="margin-top:22px">सहभागीगत सिकाइ</h3>'
    +'<div class="tbl-wrap"><table><thead><tr><th>सहभागी कोड</th><th>लिङ्ग</th><th>उमेर</th><th>शैक्षिक तह</th><th>पूर्व %</th><th>पश्च %</th><th>सुधार</th><th>g</th><th>स्थिति</th></tr></thead><tbody>';
  P.slice().sort(function(a,b){return (b.post.pct-b.pre.pct)-(a.post.pct-a.pre.pct);}).forEach(function(p){
    var gg=p.pre.pct<100?(p.post.pct-p.pre.pct)/(100-p.pre.pct):null;
    var d=p.post.pct-p.pre.pct;
    var st2=d>0?'<span class="chip c-ok">सुधार</span>':(d===0?'<span class="chip c-warn">स्थिर</span>':'<span class="chip c-bad">घट्यो</span>');
    out+='<tr><td><strong>'+esc(p.code)+'</strong></td><td>'+esc(labelOf(GENDERS,p.pre.gender))+'</td><td>'+esc(labelOf(AGES,p.pre.ageGroup))+'</td><td>'+esc(labelOf(EDUS,p.pre.education))+'</td><td>'+p.pre.pct+'%</td><td>'+p.post.pct+'%</td><td>'+(d>=0?'+':'')+d+' pp</td><td>'+(gg===null?'—':gg.toFixed(2))+'</td><td>'+st2+'</td></tr>';
  });
  out+='</tbody></table></div>';

  if(k<30) out+='<p class="msg c-warn">जोडी सहभागी ३० भन्दा कम भएकाले यी नतिजालाई प्रारम्भिक सङ्केतका रूपमा मात्र लिनुहोस्।</p>';
  return out+'</section>';
}

function corrSentence(label,c,upWord){
  if(c.r===null) return '<li><strong>'+esc(label)+'</strong>: सम्बन्ध नाप्न पर्याप्त भिन्नता वा डाटा छैन।</li>';
  var sig=c.p!==null&&c.p<0.05;
  var dir=Math.abs(c.r)<0.1?"":(c.r>0?" सकारात्मक":" नकारात्मक");
  var what=Math.abs(c.r)<0.1?"":(c.r>0?" ("+upWord+" अङ्क बढी)":" ("+upWord+" अङ्क कम)");
  return '<li><strong>'+esc(label)+'</strong>: '+SV.strength(c.r)+dir+' सम्बन्ध'+esc(what)+', r = '+SV.f2(c.r)+', '+SV.pTxt(c.p)+' — '+(sig?'<strong>सांख्यिकीय रूपमा सार्थक</strong>':'सांख्यिकीय रूपमा सार्थक होइन')+'।</li>';
}
function modelSentences(M,yWhat){
  if(!M.ok&&M.reason==="novar") return '<li>सबैको '+esc(yWhat)+' एउटै भएकाले प्रतिगमन गर्न मिल्दैन।</li>';
  if(!M.ok) return '<li>प्रतिगमन मोडेल बनाउन पर्याप्त डाटा छैन'+(M.reason==="collinear"?' (चरहरू एकअर्कासँग पूर्ण रूपमा मिल्छन्)':' (कम्तीमा '+(M.k+3)+' जना चाहिन्छ, अहिले '+M.n+')')+'।</li>';
  var out='<li>जनसांख्यिकीय चरहरूले '+esc(yWhat)+'को भिन्नताको <strong>'+Math.round(M.r2*100)+'%</strong> व्याख्या गर्छन् (R² = '+SV.f2(M.r2)+', समायोजित R² = '+SV.f2(M.adjR2)+')। समग्र मोडेल '+(M.pF<0.05?'<strong>सार्थक</strong>':'सार्थक होइन')+' (F = '+SV.f2(M.F)+', '+SV.pTxt(M.pF)+')।</li>';
  var sig=M.coefs.filter(function(c){return c.p!==null&&c.p<0.05;});

/* Groups with fewer than 5 people make a comparison fragile: say so next to the findings. */
function smallGroups(recs){
  var notes=[];
  [[GENDERS,"gender"],[AGES,"ageGroup"],[EDUS,"education"]].forEach(function(d){
    var present=d[0].map(function(x){return {l:x.l.replace(/ \(.*\)$/,""),n:recs.filter(function(r){return r[d[1]]===x.v;}).length};}).filter(function(x){return x.n>0;});
    if(present.length<2) return;
    present.filter(function(x){return x.n<5;}).forEach(function(x){notes.push(x.l+": "+SV.np(x.n)+" जना");});
  });
  return notes.length?'<li><strong>सावधानी:</strong> केही समूहमा ५ जनाभन्दा कम सहभागी छन् ('+esc(notes.join(", "))+')। यी समूहसँग सम्बन्धित नतिजा थोरै व्यक्तिमा आधारित छन्, त्यसैले एक-दुई जनाको अङ्कले नै धेरै फरक पार्छ।</li>':'';
}

/* Learning gain (post − pre, paired by participant code) against the pre score and demographics. */
function gainInfographic(P){
  if(!window.SV||P.length<3) return "";
  var rows=P.map(function(p){return {p:p,pre:p.pre.pct,post:p.post.pct,gain:p.post.pct-p.pre.pct};});
  var preds=[{key:"pre",label:"पूर्व परीक्षाको अङ्क (प्रति १०%)",unit:"प्रतिशत-अङ्क",get:function(r){return r.pre/10;}}].concat(demoPredictors(function(r){return r.p.pre;}));
  var M=SV.regress(rows,function(r){return r.gain;},preds);
  var cPre=SV.corr(rows.map(function(r){return r.pre;}),rows.map(function(r){return r.post;}));
  var pts=rows.map(function(r){return {x:r.pre,y:r.post,tip:r.p.code+" · पूर्व "+r.pre+"% → पश्च "+r.post+"%"};});
  var gainPts=rows.map(function(r){return {x:r.pre,y:r.gain,tip:r.p.code+" · सुधार "+(r.gain>=0?"+":"")+r.gain};});
  var lo=Math.min(-10,Math.min.apply(null,rows.map(function(r){return r.gain;}))), hi=Math.max(10,Math.max.apply(null,rows.map(function(r){return r.gain;})));
  lo=Math.floor(lo/10)*10; hi=Math.ceil(hi/10)*10;
  var yt=[];for(var t=lo;t<=hi;t+=(hi-lo>60?20:10)) yt.push(t);
  return '<h3 style="margin-top:22px">सिकाइ सुधारको प्रतिगमन</h3>'
    +'<p class="note">कुन कुराले सुधार (पश्च % − पूर्व %) बढी वा कम भयो, अरू चर उस्तै राख्दा।</p>'
    +'<div class="grid2">'
    +'<div>'+(M.ok?SV.coefChart(M.coefs)+LEGEND:'<p class="muted">प्रतिगमनका लागि पर्याप्त जोडी छैनन् (n = '+M.n+')।</p>')+'</div>'
    +'<div class="sv-sc-grid sv-sc-2">'
    +'<div><h3>पूर्व बनाम पश्च</h3>'+SV.scatter(pts,{xLabel:"पूर्व %",title:"पूर्व बनाम पश्च",diag:true,xmin:0,xmax:100,xticks:[0,25,50,75,100],xfmt:function(t){return t+"%";},yfmt:function(t){return t+"%";}})+'<p class="small muted">धर्को रेखाभन्दा माथि = सुधार। r = '+SV.f2(cPre.r)+'</p></div>'
    +'<div><h3>पूर्व अङ्क बनाम सुधार</h3>'+SV.scatter(gainPts,{xLabel:"पूर्व %",title:"पूर्व अङ्क बनाम सुधार",xmin:0,xmax:100,xticks:[0,25,50,75,100],xfmt:function(t){return t+"%";},ymin:lo,ymax:hi,yticks:yt,yfmt:function(t){return (t>0?"+":"")+t;}})+'</div>'
    +'</div></div>'
    +'<ul class="sv-insights">'+modelSentences(M,"सुधार")+'</ul>'
    +(M.ok?detailsBox("svg-gain-"+(sessionFilter||"all"),"सुधार प्रतिगमन तालिका",coefTable(M)):'');
}

function renderDash(){

  body+='<section class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><h2>सारांश</h2><div class="row"><select onchange="setSessionFilter(this.value)" aria-label="सत्र छान्नुहोस्">'+sopts+'</select>'+fbtns+'</div></div>'
    +'<div class="kpis">'

    +'<div class="kpi"><span class="muted small">पूर्व-तालिम</span><b>'+records.filter(function(r){return r.test==="pre";}).length+'</b></div>'
    +'<div class="kpi"><span class="muted small">पश्च-तालिम</span><b>'+records.filter(function(r){return r.test==="post";}).length+'</b></div>'
    +'</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>परीक्षा</th><th>सहभागी</th><th>औसत अङ्क</th><th>उत्तीर्ण</th></tr></thead><tbody>'+ovRows+'</tbody></table></div>'
    +'</section>';

  /* learning achievement (always shown when pairs exist) */
  body+=learningSection();

  if(dashFilter==="all"){
    TEST_VALS.forEach(function(t){ var rs=records.filter(function(r){return r.test===t;}); if(rs.length) body+=demoInfographic(rs,t); });
    body+='<section class="card"><p class="muted">प्रश्नगत र सहभागी विश्लेषण हेर्न माथिको बटनबाट पूर्व-तालिम वा पश्च-तालिम छान्नुहोस्। प्रश्नहरू परीक्षाअनुसार फरक छन्, त्यसैले दुवै परीक्षा एकसाथ विश्लेषण गरिँदैन।</p></section>';
    box.innerHTML=body;
    return;
  }

  var recs=records.filter(function(r){return r.test===dashFilter;});
  var IDS=uniqueIds(recs), N=IDS.length;
  var m=recs.length;
  if(m===0){
    box.innerHTML=body+'<section class="card"><p>यो परीक्षामा अहिलेसम्म कुनै परिणाम छैन।</p></section>';
    return;
  }

  var avg=Math.round(recs.reduce(function(a,r){return a+r.pct;},0)/m);
  var pass=recs.filter(function(r){return r.pct>=50;}).length;
  var hiP=recs[0].pct, loP=recs[m-1].pct;

  /* question stats, by pool question id (events with different sets combine) */
  var qstats=[];
  IDS.forEach(function(id,i){
    var it=POOL_BY_ID[id], corr=0, n=0, opt=[0,0,0,0];
    recs.forEach(function(r){
      var rk=recPos(r,id); if(rk<0) return;
      n++; var a=r.answers[rk];
      if(a===it.a) corr++;
      if(a>=0) opt[a]++;
    });
    var wrongTop=-1,wrongN=-1;
    for(var j=0;j<4;j++){ if(j!==it.a && opt[j]>wrongN){ wrongN=opt[j]; wrongTop=j; } }
    qstats.push({id:id,i:i,theme:it.s,ans:it.a,pct:n?Math.round(corr/n*100):0,n:n,wrong:wrongTop,wrongN:wrongN<0?0:wrongN});
  });
  var sessAvg=SESSIONS.map(function(s){
    var tot=0,cnt=0;
    recs.forEach(function(r){
      themeIds(r,s.id).forEach(function(id){ cnt++; if(r.answers[recPos(r,id)]===POOL_BY_ID[id].a) tot++; });
    });
    return {label:s.label,pct:cnt?Math.round(tot/cnt*100):0};
  });
  var gl=["A+","A","B+","B","C","D"];
  var gcount={};gl.forEach(function(g){gcount[g]=0;});
  recs.forEach(function(r){gcount[gradeOf(r.pct)]++;});

  /* correlation with demographics */
  var ageIdx=recs.map(function(r){return idxOf(AGES,r.ageGroup);});
  var eduIdx=recs.map(function(r){return idxOf(EDUS,r.education);});
  var pcts=recs.map(function(r){return r.pct;});
  var rhoAge=spearman(ageIdx,pcts);
  var rhoEdu=spearman(eduIdx,pcts);
  var etaGender=etaSquared(GENDER_VALS.map(function(v){return recs.filter(function(r){return r.gender===v;}).map(function(r){return r.pct;});}));
  var etaAge=etaSquared(AGE_VALS.map(function(v){return recs.filter(function(r){return r.ageGroup===v;}).map(function(r){return r.pct;});}));
  var etaEdu=etaSquared(EDU_VALS.map(function(v){return recs.filter(function(r){return r.education===v;}).map(function(r){return r.pct;});}));

  var smallN = m<30;

  body+='<section class="card"><div class="row" style="justify-content:space-between"><h2>'+esc(testLabel(dashFilter))+' परीक्षा · विस्तृत</h2><span class="small muted">लाइभ · '+m+' सहभागी</span></div><div class="kpis">'
    +'<div class="kpi"><span class="muted small">सहभागी</span><b>'+m+'</b></div>'
    +'<div class="kpi"><span class="muted small">औसत अङ्क</span><b>'+avg+'%</b></div>'
    +'<div class="kpi"><span class="muted small">उत्तीर्ण (≥५०%)</span><b>'+pass+' / '+m+'</b></div>'
    +'<div class="kpi"><span class="muted small">उच्च / न्यून</span><b style="font-size:20px">'+hiP+'% · '+loP+'%</b></div>'
    +'</div></section>';

  /* correlation and regression infographic; the earlier table stays under it as a table view */
  body+=demoInfographic(recs,dashFilter);
  body+='<section class="card">'+detailsBox("svc-"+dashFilter,"जनसांख्यिकी र अङ्कबीचको सम्बन्ध: तालिका (η² सहित)",''
    +'<p class="note">उमेर र शैक्षिक तह क्रमबद्ध विवरण भएकाले Spearman सहसम्बन्ध (r, −१ देखि +१) निकालिएको छ। लिङ्गमा क्रम छैन, त्यसैले समूहबीचको भिन्नता η² (०–१) ले नापिएको छ। यी सम्बन्ध हुन्, कारण होइनन्।</p>'
    +'<div class="tbl-wrap"><table><thead><tr><th>चर</th><th>नाप</th><th>मान</th><th>बल</th><th>दिशा</th></tr></thead><tbody>'
    +'<tr><td>उमेर समूह</td><td>Spearman r</td><td>'+fmt(rhoAge,2)+'</td><td>'+strengthWord(rhoAge)+'</td><td>'+dirWord(rhoAge)+'</td></tr>'
    +'<tr><td>शैक्षिक तह</td><td>Spearman r</td><td>'+fmt(rhoEdu,2)+'</td><td>'+strengthWord(rhoEdu)+'</td><td>'+dirWord(rhoEdu)+'</td></tr>'
    +'<tr><td>लिङ्ग</td><td>η² (समूहगत भिन्नता)</td><td>'+fmt(etaGender,3)+'</td><td>'+etaWord(etaGender)+'</td><td>समूह औसतमा आधारित</td></tr>'
    +'<tr><td>उमेर समूह (समूहगत)</td><td>η²</td><td>'+fmt(etaAge,3)+'</td><td>'+etaWord(etaAge)+'</td><td>—</td></tr>'
    +'<tr><td>शैक्षिक तह (समूहगत)</td><td>η²</td><td>'+fmt(etaEdu,3)+'</td><td>'+etaWord(etaEdu)+'</td><td>—</td></tr>'
    +'</tbody></table></div>'
    +(smallN?'<p class="msg c-warn">सहभागी ३० भन्दा कम भएकाले यी सम्बन्धलाई प्रारम्भिक सङ्केतका रूपमा मात्र लिनुहोस्।</p>':''))
    +'</section>';

  /* per-factor group cards */
  function factorCard(title,field,list,vals){
    var g=groupScores(recs,field,vals);
    var s='<section class="card"><h2>'+esc(title)+'</h2>';
    g.forEach(function(x){
      var lab=labelOf(list,x.v);
      var av=x.avg===null?"—":Math.round(x.avg)+"%";
      var passTxt=x.n?Math.round(x.pass/x.n*100)+"% उत्तीर्ण":"";
      s+=barRow(lab+" (n="+x.n+")",x.avg===null?0:x.avg,100,"var(--accent)",av+" · "+passTxt);
    });
    return s+'</section>';
  }
  body+='<div class="grid3">'
    +factorCard("लिङ्ग अनुसार औसत अङ्क","gender",GENDERS,GENDER_VALS)
    +factorCard("उमेर समूह अनुसार औसत अङ्क","ageGroup",AGES,AGE_VALS)
    +factorCard("शैक्षिक तह अनुसार औसत अङ्क","education",EDUS,EDU_VALS)
    +'</div>';

  body+='<div class="grid2" style="margin-top:0"><section class="card"><h2>ग्रेड वितरण</h2>';
  gl.forEach(function(g){body+=barRow(g+" ("+gradeLabel(g)+")",gcount[g],m,g==="D"?"var(--bad)":"var(--accent)",String(gcount[g]));});
  body+='</section><section class="card"><h2>सत्रगत औसत सफलता</h2>';
  sessAvg.forEach(function(s){body+=barRow(s.label,s.pct,100,"var(--gold)",s.pct+"%");});
  body+='</section></div>';

  body+='<section class="card"><h2>प्रश्नगत विश्लेषण</h2><p class="note">५०% भन्दा कम सहभागीले सही दिएका प्रश्न "कठिन" देखाइन्छ। सबैभन्दा धेरैले छानेको गलत विकल्प पनि देखाइन्छ।</p><div class="tbl-wrap"><table><thead><tr><th>प्रश्न</th><th>सत्र</th><th>सही उत्तर</th><th>सही दर</th><th>सबैभन्दा धेरैले छानेको गलत</th><th>स्थिति</th></tr></thead><tbody>';
  qstats.forEach(function(s){
    var hard=s.pct<50;
    var wrongTxt=s.wrongN>0?L(s.wrong)+' ('+s.wrongN+' जना)':'—';
    body+='<tr><td>'+s.id+'</td><td>'+(s.theme+1)+'</td><td>'+L(s.ans)+'</td><td>'+s.pct+'%</td><td>'+wrongTxt+'</td><td>'+(hard?'<span class="chip c-bad">कठिन</span>':'<span class="chip c-ok">ठीक</span>')+'</td></tr>';
  });
  body+='</tbody></table></div></section>';

  body+='<section class="card"><h2>सहभागी ग्रेड</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>कोड</th><th>लिङ्ग</th><th>उमेर</th><th>शैक्षिक तह</th><th>अङ्क</th><th>%</th><th>ग्रेड</th>';
  SESSIONS.forEach(function(s){body+='<th>S'+(s.id+1)+'</th>';});
  body+='<th>समय (मि.)</th><th>बुझाएको</th></tr></thead><tbody>';
  recs.forEach(function(r,idx){
    body+='<tr><td>'+(idx+1)+'</td><td>'+esc(r.code)+'</td><td>'+esc(labelOf(GENDERS,r.gender))+'</td><td>'+esc(labelOf(AGES,r.ageGroup))+'</td><td>'+esc(labelOf(EDUS,r.education))+'</td><td>'+r.score+'/'+r.qids.length+'</td><td>'+r.pct+'%</td><td><strong>'+gradeOf(r.pct)+'</strong></td>';
    SESSIONS.forEach(function(s){
      var tids=themeIds(r,s.id), c=0;
      tids.forEach(function(id){ if(r.answers[recPos(r,id)]===POOL_BY_ID[id].a) c++; });
      body+='<td>'+c+'/'+tids.length+'</td>';
    });
    body+='<td>'+Math.round((r.seconds||0)/60)+'</td><td class="small">'+esc(String(r.submittedAt).slice(0,16).replace('T',' '))+'</td></tr>';
  });
  body+='</tbody></table></div></section>';

  body+='<section class="card"><h2>प्रश्न × सहभागी (✔ सही, ✘ गलत)</h2><div class="tbl-wrap"><table><thead><tr><th>#</th><th>कोड</th>';
  IDS.forEach(function(id){ body+='<th class="mx">'+id+'</th>'; });
  body+='<th>अङ्क</th></tr></thead><tbody>';
  recs.forEach(function(r,idx){
    body+='<tr><td>'+(idx+1)+'</td><td>'+esc(r.code)+'</td>';
    IDS.forEach(function(id){
      var rk=recPos(r,id);
      if(rk<0){ body+='<td class="mx" title="प्रश्न '+id+'">—</td>'; return; }
      var ok=r.answers[rk]===POOL_BY_ID[id].a;
      body+='<td class="mx '+(ok?'ok':'bad')+'" title="प्रश्न '+id+'">'+(ok?'✔':'✘')+'</td>';
    });
    body+='<td><strong>'+r.score+'</strong></td></tr>';
  });
  body+='</tbody></table></div></section>';

  box.innerHTML=body;
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-action]");
  if(!t) return;
  var a=t.getAttribute("data-action");
  if(a==="tab"){
    var tab=t.getAttribute("data-tab");
    $("exam").classList.toggle("hide",tab!=="exam");
    $("dash").classList.toggle("hide",tab!=="dash");
    $("tabExam").classList.toggle("on",tab==="exam");
    $("tabDash").classList.toggle("on",tab==="dash");
    window.scrollTo(0,0);
  }
  else if(a==="unlock") unlock();
  else if(a==="filter"){dashFilter=t.getAttribute("data-f");renderDash();}
  else if(a==="begin") beginExam();
  else if(a==="publicBegin") publicBegin();
  else if(a==="publicReview") publicReview();
  else if(a==="checkSession") checkSession();
  else if(a==="pick"){
    st.answers[st.cur]=parseInt(t.getAttribute("data-i"),10);
    st.submitArm=false;
    renderApp();
  }
  else if(a==="prev"){if(st.cur>0){st.cur--;renderApp();}}
  else if(a==="next"){if(st.cur<st.bank.length-1){st.cur++;renderApp();}}
  else if(a==="goto"){st.cur=parseInt(t.getAttribute("data-k"),10);renderApp();}
  else if(a==="arm"){st.submitArm=true;renderApp();}
  else if(a==="disarm"){st.submitArm=false;renderApp();}
  else if(a==="submit") submitExam();
  else if(a==="retry") saveResult();
  else if(a==="restart"){resetExam();renderApp();window.scrollTo(0,0);}
});
document.addEventListener("ws-auth",function(){ renderApp(); if(window.WS&&WS.isTrainer()) unlock(); });

if(PUBLIC) fetchPublicInfo();
renderApp();
if(DASH_CODE){ var dt=document.getElementById("tabDash"); if(dt) dt.click(); }
if(window.WS){
  WS.init().then(function(){ renderApp(); if(WS.isTrainer()) unlock(); }).catch(function(){ renderApp(); });
}
})();
</script>
