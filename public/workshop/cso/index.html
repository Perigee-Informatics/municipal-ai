: do not quote.</strong></p>\n<blockquote><p><strong>Out-of-school children in Lalitpur district: key facts</strong></p>\n<p>Lalitpur district has made remarkable progress, yet challenges persist. According to the Ministry of Education Annual Report 2081 (p. 47), 14.6% of children aged 5–12 in Lalitpur are out of school, compared with a national average of 8.2%. The rate is highest in rural municipalities such as Bagmati and Mahankal, where it reaches 23.1%. A 2024 UNICEF Nepal study (Table 3.2) found that 61% of out-of-school children are girls, and that the main cause is the cost of school uniforms. The government aims to reduce out-of-school rates to zero by 2027 under the School Education Sector Plan.</p>\n<p>Sources: www.moe.gov.np/reports/2081/oosc-lalitpur.pdf; UNICEF Nepal (2024), <em>Out-of-School Children Study</em>, Table 3.2.</p></blockquote>\n<div class=\"ans\" data-ans=\"cso-m11\"></div>","group":"usecase"},{"id":"d1","short":"D1","title":"\"Brilliant and wrong\"","use":"Demo script · Session 2","html":"<ol><li>Project <a href=\"#m11\">M11</a> (an AI answer with invented facts). Ask: \"Would you put this in a report?\"</li><li>Live in ChatGPT, with web search off, ask:<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp25\">Copy</button></figcaption><pre id=\"cp25\">Give me the latest official statistics on [issue] in [district/municipality], Nepal, with exact figures and three sources with links.\nExample: out-of-school children in Lalitpur district</pre></figure></li><li>Point out: exact-looking numbers, confident tone, and links that may not exist or may not contain the figure.</li><li>Show the right path: find the official source (a government report, CBS/NSO data, a ministry website) and check whether the figure is there.</li></ol>","group":"demo"},{"id":"d2","short":"D2","title":"Weak versus strong prompt","use":"Demo script · Session 4","html":"<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp26\">Copy</button></figcaption><pre id=\"cp26\">WEAK: Write an invitation for the community meeting.\n\nSTRONG: You are a community mobiliser at a Nepali CSO working on [theme].\nContext: we are inviting [audience] in [place] to [event] on [date] at [venue]. Many readers have low literacy.\nTask: write an invitation.\nFormat: simple Nepali, under 80 words, warm and respectful tone, with blanks for date, time and venue.\nConstraints: no English words, no jargon, end with a contact number blank.\n\nExample: parents in Bhageshwar Rural Municipality, one-day parent orientation on supporting children's learning at home.</pre></figure>\n<p>Then show iteration: \"Make it shorter for an SMS\" and \"Write a version to read aloud on community radio.\"</p>","group":"demo"},{"id":"d3","short":"D3","title":"Message house","use":"Demo script · Session 6","html":"<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp27\">Copy</button></figcaption><pre id=\"cp27\">You are an advocacy strategist for a Nepali CSO working on [theme].\nCreate a message house for the campaign \"[campaign name]\" aimed at [primary audience].\nInclude: 1 core message (max 15 words), 3 supporting pillars, the type of evidence each pillar needs, and a call to action.\nUse only facts I give you; where evidence is needed write [EVIDENCE NEEDED].\nFacts: [paste from M8 brief]</pre></figure>\n<p>Follow-up in ChatGPT: \"You are a [ward chair / district education officer]. Read this message house and tell me honestly what would and would not convince you.\"</p>","group":"demo"},{"id":"d4","short":"D4","title":"Proposal workflow","use":"Demo script · Session 7","html":"<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp28\">Copy</button></figcaption><pre id=\"cp28\">NotebookLM (source: M5 donor call):\nList the donor's objectives, eligibility rules, budget range, deadline and scoring criteria, with citations.\n\nClaude (paste M6):\n1. Using only this evidence, build a problem tree: core problem, 3-4 direct causes, root causes, and effects.\n2. Turn the problem tree into a Theory of Change: \"If... then... because...\" pathways with assumptions.\n3. Draft a logframe table: impact, 2 outcomes, outputs, SMART indicators, means of verification, assumptions. Mark every target as [TO CONFIRM].</pre></figure>","group":"demo"},{"id":"d5","short":"D5","title":"AI as a strict donor reviewer","use":"Demo script · Session 7","html":"<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp29\">Copy</button></figcaption><pre id=\"cp29\">Act as a strict reviewer for the [donor] call below. Score this concept note from 1 to 5 on each criterion.\nFor each score, quote the weak sentence and explain what is missing.\nThen list the 5 questions the review panel will ask.\nCall criteria: [paste from M5]\nConcept note: [paste M7]</pre></figure>\n<p>Show how Claude finds the weaknesses planted in <a href=\"#m7\">M7</a>: no baseline, vague activities, unrealistic targets, generic wording and no sustainability plan.</p>","group":"demo"},{"id":"d6","short":"D6","title":"Responsible AI talking points","use":"Demo script · Session 8","html":"<ul><li><strong>Hallucination:</strong> fluent does not mean true. Verify every fact, figure, law, quote and citation.</li><li><strong>Bias:</strong> AI reflects its training data. Watch for stereotypes about gender, caste, ethnicity, disability, region and age.</li><li><strong>Deepfakes and misinformation:</strong> AI-made images, audio and video can look real. Label AI images. Never fake a real person's words or face.</li><li><strong>Plagiarism and copyright:</strong> AI text can echo existing work. Rewrite in your own voice, and follow donor rules.</li><li><strong>Confidentiality and privacy:</strong> anything typed into a free tool may be stored. Never paste names, case files, beneficiary lists, staff data or confidential documents.</li><li><strong>Accountability:</strong> a person, not the tool, is responsible for what the CSO publishes or submits.</li></ul>\n<p>Nepal's Individual Privacy Act, 2075 (2018) and the CSO's own safeguarding and data policies apply to AI use as well.</p>","group":"demo"},{"id":"d7","short":"D7","title":"Talk to AI by voice","use":"Demo script · Session 3","html":"<p>In the ChatGPT app, tap the microphone (dictation) and say in Nepali:</p>\n<figure class=\"prompt\"><figcaption><span>Say this</span><button class=\"copy\" data-copy-id=\"cp30\">Copy</button></figcaption><pre id=\"cp30\">आजको बैठकमा तीनवटा कुरा छलफल भयो। पहिलो, अर्को महिना अभिभावक गोष्ठी गर्ने। दोस्रो, विद्यालयसँग समन्वय गर्ने जिम्मा मायालाई। तेस्रो, रिपोर्ट शुक्रबारसम्म पठाउने। यसलाई निर्णय तालिकाको रूपमा मिलाइदिनुहोस्।</pre></figure>\n<p>Show that the AI turns spoken notes into a table of decisions, owners and deadlines. Then ask for an English version for the donor file.</p>","group":"demo"}],"SESS":[{"id":"s1","n":"1","start":"09:45","end":"10:10","title":"Opening, pre-assessment and \"AI in my week\"","tools":"Phone (quiz)","mats":["ex1","quiz"],"assess":"pre","plan":{"objective":"Set the tone, measure the baseline, and link the day to participants' real tasks.","steps":"<ol><li><strong>Welcome and norms (4 min).</strong> The host CSO opens. Three norms: phones out for learning, no real personal data in any tool, and no question is too basic.</li><li><strong>Pre-assessment (8 min).</strong> Participants scan a QR code for the 10-item quiz and confidence rating. Collect participant code or name only.</li><li><strong>\"AI in my week\" (10 min, Ex 1).</strong> Each person writes the 2 tasks that take most of their week, one per sticky note. Notes go on a wall with four zones: Office, Campaign, Fundraising, Field. Read out the top three and promise to come back to them.</li><li><strong>Agenda walk-through (3 min).</strong> Link each session to a zone of the wall.</li></ol>","outcome":"Baseline measured; the day linked to each participant's own tasks."}},{"id":"s2","n":"2","start":"10:10","end":"10:35","title":"AI demystified: what it is and what it is not","tools":"ChatGPT (demo)","mats":["d1","m11","ex2"],"plan":{"objective":"Build a correct mental model of AI, without hype or fear.","steps":"<ol><li><strong>Input (10 min).</strong><ul><li>AI, machine learning and generative AI in one picture.</li><li>A chatbot predicts likely next words from patterns. It does not \"know\" facts. It is fluent even when it is wrong.</li><li>The three tools of the day and when to use each.</li><li>Free versus paid plans, and why data settings matter.</li></ul></li><li><strong>Demo D1: \"Brilliant and wrong\" (8 min).</strong> Show M11, an AI answer with invented statistics and citations. Participants guess which parts are real. Reveal how to check each claim against the original source.</li><li><strong>Sort cards (7 min, Ex 2).</strong> In pairs, sort 12 cards into \"AI is good at\" and \"AI is weak at\". Debrief the 2–3 cards people disagreed on.</li></ol>","outcome":"Key message: AI is a fast, capable intern. It is never the final authority."}},{"id":"s3","n":"3","start":"10:35","end":"11:00","title":"Nepali voice typing on your phone","tools":"Gboard, ChatGPT/Claude app","mats":["voice","d7"],"plan":{"objective":"Every participant can dictate Nepali text into any app and use voice with an AI tool.","steps":"<ol><li><strong>Why it matters (2 min).</strong> Field staff can record observations, minutes and messages faster by speaking than by typing Devanagari on a small keyboard.</li><li><strong>Set-up, step by step (10 min).</strong> The facilitator projects their phone screen or uses a large printout. Everyone follows the Nepali voice typing guide, Part A (Android) or Part B (iPhone). Helpers move around the room. Group people by phone type.</li><li><strong>Practice 1: dictate (5 min).</strong> Open any notes app. Read the practice script aloud, including the spoken punctuation. Compare results with a neighbour and fix errors.</li><li><strong>Practice 2: talk to AI (6 min).</strong> In the ChatGPT or Claude app, tap the microphone and dictate in Nepali: \"यो बैठकको टिपोटलाई औपचारिक निर्णयमा बदलिदिनुहोस्\" plus a few spoken meeting points (Demo D7). See how it turns spoken notes into a structured text.</li><li><strong>Troubleshoot (2 min).</strong> Cover the common problems listed in the guide.</li></ol>","outcome":"Facilitator tip: set up two helper phones (one Android, one iPhone) before the session. Keep a mobile hotspot ready, because Nepali voice typing needs internet."}},{"id":"s4","n":"4","start":"11:00","end":"11:40","title":"Prompting lab: R-C-T-F-C","tools":"ChatGPT, Claude","mats":["d2","m9","ex3"],"refs":["qref"],"plan":{"objective":"Write prompts that give usable output, and improve them through conversation.","steps":"<ol><li><strong>Input (8 min): R-C-T-F-C</strong> (Quick reference): <strong>R</strong>ole, <strong>C</strong>ontext, <strong>T</strong>ask, <strong>F</strong>ormat, <strong>C</strong>onstraints. Then <strong>iterate</strong>: \"simpler\", \"3 options\", \"ask me questions first\".</li><li><strong>Demo D2 (8 min).</strong> Run the weak prompt and the strong prompt in ChatGPT, side by side. Then paste the strong prompt into Claude and compare the two tools.</li><li><strong>Pair practice (19 min, Ex 3 with M9).</strong> Each pair takes one weak prompt card, rewrites it with R-C-T-F-C, runs both versions, and records the difference. Pairs that finish early try speaking the prompt by voice.</li><li><strong>Debrief (5 min).</strong> Two pairs show before and after. Verify it: \"What would you still check before using this?\"</li></ol>","outcome":"Every pair has rewritten a weak prompt into a strong one and compared ChatGPT and Claude."}},{"id":"s5","n":"5","start":"11:55","end":"12:40","title":"AI for daily office work (4 stations)","tools":"ChatGPT, Claude, NotebookLM","mats":["ex4","m1","m2","m3","m4"],"plan":{"objective":"Save time on minutes, reporting, translation and document research.","steps":"<p><strong>Format:</strong> four stations of 9 minutes, with groups rotating (36 min), then a 9-minute debrief. Each station has its task card (Ex 4) and the printed use-case material. Digital copies are on this page, so participants can copy and paste.</p><ol><li><strong>Station A: minutes (ChatGPT or Claude, M1).</strong> Turn the rough meeting notes into formal minutes with a decisions table (owner, deadline). Then check that nothing was added that is not in the notes.</li><li><strong>Station B: progress report (Claude, M2).</strong> Turn the field activity notes into a one-page monthly progress narrative. Missing data must be marked [DATA NEEDED], not invented.</li><li><strong>Station C: translation and plain language (ChatGPT, M3).</strong> Translate the English donor text into simple Nepali for field staff. Back-translate it into English to check the meaning. Mark any wrong terms.</li><li><strong>Station D: ask your documents (NotebookLM, M4 + M1 + M2).</strong> Create a notebook. Add M4 as a \"Copied text\" source, plus M1 and M2. Ask the 4 questions on the card. Click two citations to check them. Generate a briefing doc.</li></ol><p><strong>Debrief:</strong> Which station saved the most time? Which output needed the most correction? Add new uses to the \"AI in my week\" wall.</p>","outcome":"Minutes, a progress report, a checked translation and a source-grounded briefing produced with AI."}},{"id":"s6","n":"6","start":"13:25","end":"14:15","title":"Campaign and advocacy studio","tools":"ChatGPT, Claude","mats":["d3","m8","ex5"],"plan":{"objective":"Use AI as a creative partner for campaigns, while keeping the community's voice and human judgment at the centre.","steps":"<ol><li><strong>Demo D3 (8 min).</strong> Build a message house with Claude: a core message, 3 pillars, evidence and a call to action. Then ask ChatGPT to critique it from the target audience's point of view.</li><li><strong>Group challenge (30 min, Ex 5 with M8).</strong> Four groups each take one campaign brief. Each group produces:<ul><li>a campaign objective and target audience;</li><li>a key message in Nepali and English;</li><li>3 social media posts;</li><li>one radio or video script of 60 seconds;</li><li>one visual concept, described in words or generated as an image in ChatGPT.</li></ul></li><li><strong>Gallery walk (8 min).</strong> Groups leave feedback as \"one strength, one risk\".</li><li><strong>Verify it (4 min).</strong> Check for stereotypes, cultural and language fit, and made-up statistics. Rule: never create AI images that look like real, identifiable people (especially children or survivors), and never present AI images as real photos.</li></ol>","outcome":"Each group has a campaign canvas: objective, message, posts, a radio script and a visual concept."}},{"id":"s7","n":"7","start":"14:30","end":"15:15","title":"Fundraising and proposals with AI","tools":"Claude, ChatGPT, NotebookLM","mats":["d4","d5","m5","m6","m7","ex6"],"refs":["m4"],"plan":{"objective":"Speed up proposal work while keeping evidence, originality and fit with the donor.","steps":"<ol><li><strong>Demo D4: the proposal workflow (10 min)</strong>, using M5 (donor call) and M6 (field evidence).<ul><li>Put M5 into NotebookLM and ask: \"What exactly does this donor want? List the criteria, eligibility and deadlines with citations.\"</li><li>In Claude, build a problem tree from M6.</li><li>Turn it into a Theory of Change and a draft logframe with SMART indicators.</li></ul></li><li><strong>Group work (22 min, Ex 6).</strong> Each group takes one task:<ul><li>(a) a 1-page concept note from M5 + M6;</li><li>(b) a logframe for one outcome;</li><li>(c) Demo D5 as an exercise: ask Claude to act as a strict donor reviewer and score the weak draft M7, then improve it;</li><li>(d) a donor update email or a local business sponsorship pitch.</li></ul></li><li><strong>Debrief and verify (13 min).</strong> Red flags: invented baseline data, copied wording (plagiarism), generic text that fits any NGO, wrong donor names or priorities. Check whether the donor's rules say anything about AI use.</li></ol>","outcome":"Key message: AI drafts the structure. The CSO provides the evidence, the voice and the final judgment."}},{"id":"s8","n":"8","start":"15:15","end":"15:45","title":"Responsible AI: \"Should I use AI here?\"","tools":"None (cards)","mats":["d6","m10","ex7"],"refs":["qref"],"plan":{"objective":"Know the risks and the safe boundaries.","steps":"<ol><li><strong>Input D6 (10 min):</strong> hallucination, bias, deepfakes and misinformation, plagiarism and copyright, confidentiality, data privacy and safeguarding. Nepal's Individual Privacy Act, 2075 (2018) and the CSO's own safeguarding and data policies apply to AI use as well.</li><li><strong>Scenario game (15 min, Ex 7 with M10).</strong> Read each scenario. Everyone raises a green, amber or red card. Two people explain their choice, then the facilitator gives the agreed answer.</li><li><strong>Agree the rules (5 min).</strong> Adopt the traffic light (Quick reference) as a draft for the CSO's own AI use guideline.</li></ol>","outcome":"A draft traffic-light guideline for the CSO's own AI use."}},{"id":"s9","n":"9","start":"15:45","end":"16:00","title":"Action plan, post-assessment and closing","tools":"Phone (quiz)","mats":["ex8","quiz"],"assess":"post","tool":"feedback","plan":{"objective":"Turn the day into next week's practice, and measure the learning gain.","steps":"<ol><li><strong>Action plan (5 min, Ex 8).</strong> Each person writes 3 tasks they will use AI for next week, and 1 task where they will not use it.</li><li><strong>Post-assessment (7 min).</strong> The same quiz as the morning, the confidence rating and the feedback form.</li><li><strong>Closing (3 min).</strong> Share the Workbook and prompt library links. Take a group photo, with consent.</li></ol>","outcome":"Every participant leaves with a personal AI action plan."}}],"DAYS":[{"n":1,"date":"Workshop day","theme":"5 hours of learning: office work, campaigns, proposals and responsible AI","items":[{"start":"09:30","end":"09:45","kind":"break","title":"Registration"},{"start":"09:45","end":"10:10","kind":"session","id":"s1"},{"start":"10:10","end":"10:35","kind":"session","id":"s2"},{"start":"10:35","end":"11:00","kind":"session","id":"s3"},{"start":"11:00","end":"11:40","kind":"session","id":"s4"},{"start":"11:40","end":"11:55","kind":"break","title":"Tea break"},{"start":"11:55","end":"12:40","kind":"session","id":"s5"},{"start":"12:40","end":"13:25","kind":"break","title":"Lunch"},{"start":"13:25","end":"14:15","kind":"session","id":"s6"},{"start":"14:15","end":"14:30","kind":"break","title":"Tea break and energiser"},{"start":"14:30","end":"15:15","kind":"session","id":"s7"},{"start":"15:15","end":"15:45","kind":"session","id":"s8"},{"start":"15:45","end":"16:00","kind":"session","id":"s9"}]}]};
</script>

<script>
/* AI for CSOs: same shell as the representative materials (../representative/index.html), in English.
   Running order on the left; the selected session's plan and materials on the right. */
if (!window.D_CSO || !window.WS) throw new Error("CSO page: missing " + window.__CSO_MISSING);
const DATA = window.D_CSO;
const COURSE = 'cso';
const tm = (a, b) => a + '–' + b;
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = Object.fromEntries(DATA.SESS.map(s => [s.id, s]));
const M = Object.fromEntries(DATA.MATS.map(m => [m.id, m]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('ai-cso-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ai-cso-' + k, JSON.stringify(v)); } catch (e) {} },
};
let done = new Set(store.get('done', []));
const DAY = DATA.DAYS[0];
const ASSESS = '../assessment/index.html';
const GROUPS = [
  ['workbook', 'Participant Workbook'],
  ['exercise', 'Exercise sheets Ex 1–Ex 8'],
  ['usecase', 'Use Case 1: Loo Niva Child Concern Group (M1–M11)'],
  ['demo', 'Facilitator demo scripts D1–D7'],
];

function itemOf(id) { for (const it of DAY.items) if (it.id === id) return it; return null; }
function nkTime() {
  try {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    return +p.find(x => x.type === 'hour').value * 60 + +p.find(x => x.type === 'minute').value;
  } catch (e) { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
}
/* "Now" only on the event's own day (Nepal time); on other days the dashboard shows the running order. */
function isEventDay() {
  if (!EV_DATES.length) return true;
  try { return EV_DATES.includes(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kathmandu' }).format(new Date())); } catch (e) { return true; }
}
function nowNext() {
  const t = nkTime(); let now = null, next = null;
  if (!isEventDay()) return { now, next, t, off: true };
  for (const it of DAY.items) {
    if (toMin(it.start) <= t && t < toMin(it.end)) now = it;
    else if (toMin(it.start) > t && !next) next = it;
  }
  return { now, next, t };
}
function offNext() {
  let today = '';
  try { today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kathmandu' }).format(new Date()); } catch (e) {}
  return EV_DATES.length && today && today < EV_DATES[0] ? 'Registration 09:30, ' + DATES : 'The workshop is over';
}
function titleOf(it) { return it.kind === 'session' ? 'Session ' + S[it.id].n + ': ' + S[it.id].title : it.title; }
const matLabel = id => M[id].short === 'Workbook' ? M[id].title : M[id].short;
const matCard = id => `<a class="card" href="#${id}"><span class="k">${M[id].short}</span><b>${M[id].title}</b><span class="s">${M[id].use}</span></a>`;
const TOOLS = { feedback: { k: 'Closing', t: 'Feedback form', s: 'Send it online' } };
const toolCard = k => `<a class="card" href="#${k}"><span class="k">${TOOLS[k].k}</span><b>${TOOLS[k].t}</b><span class="s">${TOOLS[k].s}</span></a>`;
const assessCard = kind => `<a class="card" href="${ASSESS}"><span class="k">${kind === 'pre' ? 'Pre-test' : 'Post-test'}</span><b>AI knowledge test (10 questions)</b><span class="s">Get the event code from the facilitator</span></a>`;

/* ---------- sidebar ---------- */
function renderSide(cur) {
  const nn = nowNext();
  const on = ids => ids.includes(cur) ? 'aria-current="page"' : '';
  let h = `<div class="nav-links">
    <a data-home href="/ai-for-all" hidden>⌂ Home</a>
    <a href="#home" ${on(['home'])}>Dashboard</a>
    <a href="#agenda" ${on(['agenda'])}>Facilitator guide and agenda</a>
    <a href="#resources" ${on(['resources', ...Object.keys(M)])}>Workbook and materials</a>
    <a href="#prompts" ${on(['prompts'])}>Prompt library</a>
    <a href="#feedback" ${on(['feedback'])}>Feedback form</a>
    <a href="#handbook" ${on(['handbook'])}>Full workbook (print / PDF)</a>
    <a href="${ASSESS}">AI knowledge test</a></div>`;
  h += `<p class="day-h"><b>Workshop day</b><span>${esc(DAY.date)}</span></p><ul class="tl">`;
  for (const it of DAY.items) {
    const isNow = nn.now === it;
    if (it.kind === 'break') { h += `<li><span class="brk"><span class="t">${it.start}</span><span>${it.title}</span><span></span></span></li>`; continue; }
    const chip = isNow ? '<span class="chip now">Now</span>' : (done.has(it.id) ? '<span class="chip done">Done</span>' : '<span></span>');
    h += `<li><a href="#${it.id}" class="${isNow ? 'is-now' : ''}" ${cur === it.id ? 'aria-current="page"' : ''}><span class="t">${it.start}</span><span>${titleOf(it)}</span>${chip}</a></li>`;
  }
  $('#side').innerHTML = h + '</ul>';
  if (HOME) EVI.mountHome(HOME);
}

/* ---------- views ---------- */
function vHome() {
  const nn = nowNext();
  const sessDone = DATA.SESS.filter(s => done.has(s.id)).length, total = DATA.SESS.length;
  const slot = (lbl, it, live) => it ? `<a class="slot ${live ? 'live' : ''}" href="#${it.kind === 'break' ? '' : it.id}"><span class="lbl">${lbl}</span><span class="tt">${titleOf(it)}</span><span class="tm">${tm(it.start, it.end)}</span></a>`
    : `<div class="slot"><span class="lbl">${lbl}</span><span class="tt">${nn.off ? (live ? 'Not the workshop day' : offNext()) : live ? (nn.t >= toMin('16:00') ? 'The day is over' : 'No session running now') : 'No more sessions today'}</span></div>`;
  const dayCol = `<section class="daycol"><h3>Workshop day · ${esc(DAY.date)}</h3><p class="th">${DAY.theme}</p>` +
    DAY.items.map(it => it.kind === 'break' ? `<div class="block b"><span class="t">${tm(it.start, it.end)}</span><span>${it.title}</span></div>`
      : `<a class="block" href="#${it.id}"><span class="t">${tm(it.start, it.end)}</span><span><span class="n">${S[it.id].n}</span>${S[it.id].title}${done.has(it.id) ? ' ✓' : ''}</span></a>`).join('') + '</section>';
  return `<div class="hero"><p class="eyebrow">AI for ALL · ${ORG ? esc(ORG) : 'Civil society organisations'}</p>
    <h1>${EV_NAME ? esc(EV_NAME) + ': ' : ''}AI for CSOs, a 5-hour hands-on workshop</h1>
    <div class="factline">${ORG ? `<span>Host <b>${esc(ORG)}</b></span>` : ''}${DATES ? `<span>Date <b>${esc(DATES)}</b></span>` : ''}${PLACE ? `<span>Venue <b>${esc(PLACE)}</b></span>` : ''}<span>Time <b>09:30 registration · 09:45–16:00</b></span><span>Participants <b>programme, M&amp;E, communication, finance/admin and field staff</b></span></div></div>
  <section class="nowcard" aria-live="polite">
    <div class="nowtop"><b>Today's programme</b><span class="clock">Nepal time ${String(Math.floor(nn.t / 60)).padStart(2, '0')}:${String(nn.t % 60).padStart(2, '0')}</span></div>
    <div class="nowgrid">${slot('Now', nn.now, true)}${slot('Next', nn.next, false)}</div>
    <div class="progress"><span>Sessions done: ${sessDone}/${total}</span><span class="bar"><i style="width:${Math.round(sessDone / total * 100)}%"></i></span></div>
  </section>
  <h2 class="section-title">Running order</h2>
  <div class="days one">${dayCol}</div>
  <h2 class="section-title">Quick access</h2>
  <div class="quick">
    ${matCard('qref')}
    ${matCard('prompts')}
    ${matCard('voice')}
    <a class="card" href="#resources"><span class="k">Ex 1–8 · M1–M11 · D1–D7</span><b>All workbook pages and materials</b><span class="s">Exercise sheets, use-case materials, demo scripts</span></a>
  </div>`;
}

function planDl(s, it) {
  return `<dl class="plan"><div><dt>Time</dt><dd>${tm(it.start, it.end)} (${toMin(it.end) - toMin(it.start)} min)</dd></div><div><dt>Tools</dt><dd>${esc(s.tools)}</dd></div>
    <div><dt>Materials</dt><dd>${s.mats.map(matLabel).join(', ')}</dd></div><div><dt>Objective</dt><dd>${s.plan.objective}</dd></div></dl>`;
}
const matBody = ids => ids.map(id => `<h2 class="sec-h">${M[id].short}: ${M[id].title}</h2>${M[id].html}`).join('');

function vSession(s) {
  const it = itemOf(s.id), idx = DATA.SESS.indexOf(s);
  const prev = DATA.SESS[idx - 1], next = DATA.SESS[idx + 1];
  const rel = [...s.mats, ...(s.refs || [])].map(matCard).join('') + (s.assess ? assessCard(s.assess) : '') + (s.tool ? toolCard(s.tool) : '');
  return `<p class="eyebrow">Workshop day · ${tm(s.start, s.end)} · ${s.mats.map(id => M[id].short === 'Workbook' ? 'Workbook' : M[id].short).filter((x, i, a) => a.indexOf(x) === i).join(', ')}</p>
    <h1>Session ${s.n}: ${s.title}</h1>
    <div class="actions"><button class="btn toggle-done" data-sess="${s.id}" aria-pressed="${done.has(s.id)}">${done.has(s.id) ? '✓ Session done' : 'Mark session as done'}</button></div>
    ${planDl(s, it)}
    <h3>Session plan</h3><div class="prose">${s.plan.steps}<p><strong>${s.plan.outcome}</strong></p></div>
    <h3>Materials for this session</h3><div class="related">${rel}</div>
    ${s.tool === 'feedback' ? fbHtml() : ''}
    <div class="prose">${matBody(s.mats)}</div>
    <div class="actions done-end"><button class="btn toggle-done" data-sess="${s.id}" aria-pressed="${done.has(s.id)}">${done.has(s.id) ? '✓ Session done' : 'Mark session as done'}</button></div>
    <nav class="pager">${prev ? `<a class="card" href="#${prev.id}"><span class="s">← Previous</span><b>Session ${prev.n}: ${prev.title}</b></a>` : '<span></span>'}${next ? `<a class="card" href="#${next.id}" style="text-align:right"><span class="s">Next →</span><b>Session ${next.n}: ${next.title}</b></a>` : ''}</nav>`;
}
function usersOf(id) {
  return DATA.SESS.filter(s => s.mats.includes(id) || (s.refs || []).includes(id)).map(s => `<a href="#${s.id}">Session ${s.n}: ${s.title}</a>`).join(' · ');
}
function vResources() {
  return `<p class="eyebrow">Workbook and materials</p><h1>AI for CSOs: Participant Workbook and materials</h1>
  <p class="meta">${DATA.INTRO}</p>
  ${GROUPS.map(([g, label]) => `<h2 class="section-title">${label}</h2><div class="related">${DATA.MATS.filter(m => m.group === g).map(m => matCard(m.id)).join('')}</div>`).join('')}
  <h2 class="section-title">Online tools</h2><div class="related">${toolCard('feedback')}${assessCard('pre')}</div>
  <h2 class="section-title">Guide and full workbook</h2><div class="related"><a class="card" href="#agenda"><span class="k">For the facilitator and the host CSO</span><b>Facilitator guide and agenda</b><span class="s">Objectives, agenda, tools, scoring, preparation, adapting</span></a><a class="card" href="#handbook"><span class="k">Print / PDF</span><b>Full workbook</b><span class="s">All pages on one sheet</span></a></div>`;
}
function vMat(m) {
  const tools = { quiz: assessCard('pre') + toolCard('feedback') }[m.id] || '';
  return `<p class="eyebrow">${m.short}${m.short === 'Workbook' ? '' : ' · ' + esc(m.use)}</p><h1>${m.title}</h1>
  <p class="meta">${usersOf(m.id)}</p>
  ${tools ? `<div class="related">${tools}</div>` : ''}
  <div class="actions"><button class="btn" data-print>Print / PDF</button></div>
  <div class="prose">${m.html}</div>`;
}
function vAgenda() {
  return `<p class="eyebrow">For the facilitator, the host CSO and participants</p><h1>Facilitator guide and agenda</h1>
  <div class="actions"><button class="btn" data-print>Print / PDF</button></div><div class="prose">${DATA.AGENDA_HTML}</div>`;
}
function vHandbook() {
  return `<p class="eyebrow">Full workbook</p><h1>AI for CSOs: Participant Workbook and materials</h1>
  <p class="meta">${DATA.INTRO}</p>
  <div class="actions"><button class="btn primary" data-print>Print / make a PDF</button><span class="note">Choose "Save as PDF" in the print window.</span></div>
  <div class="prose">${DATA.MATS.map(m => `<section class="hb-mat"><h2 class="sec-h">${m.short}: ${m.title}</h2>${m.html}</section>`).join('')}</div>`;
}
function vFeedback() {
  return `<p class="eyebrow">Session 9 · Closing</p><h1>Feedback form</h1>${fbHtml()}`;
}

/* ---------- feedback form (6 ratings, as the feedback table expects) ---------- */
const QS = ['Overall, today was useful for my work', 'The pace was right for me', 'The language and examples were easy to follow', 'There was enough hands-on practice', 'The exercises fitted our CSO\'s real work', 'The facilitator and helpers supported me well'];
function fbHtml() {
  const rates = QS.map((q, i) => `<tr><td>${esc(q)}</td>${[1, 2, 3, 4, 5].map(k => `<td><input type="radio" name="q${i}" value="${k}" aria-label="${k}" required></td>`).join('')}</tr>`).join('');
  return `<section class="tool" id="fbTool"><h3>End-of-day feedback (online)</h3>
  <p class="note">Choose one option in each row (1 = poor, 5 = very good). Get the event code from the facilitator.</p>
  <form id="fbForm">
    <label class="f">Event code<input id="fbCode" type="text" required maxlength="20" autocomplete="off" value="${esc(FB_CODE)}"></label>
    <div class="tbl"><table class="rate"><thead><tr><th>Statement</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>${rates}</tbody></table></div>
    <label class="f">The most useful session for my work, and why<textarea id="fbBest" rows="2" maxlength="600"></textarea></label>
    <label class="f">The least useful session, or one thing to improve<textarea id="fbImprove" rows="2" maxlength="600"></textarea></label>
    <label class="f">What will you use AI for first? What support do you need next (follow-up clinic, AI guideline, advanced session)?<textarea id="fbFirst" rows="2" maxlength="600"></textarea></label>
    <label class="chk"><input id="fbRec" type="checkbox"> I would recommend this workshop to other CSO staff</label>
    <div class="actions"><button class="btn primary" type="submit" id="fbSend">Send</button></div>
    <p id="fbMsg" class="msg" hidden></p>
  </form></section>`;
}
let FB_CODE = '';
async function loadFbCode() {
  try { const ev = await WS.loadEventForProfile(); if (ev && ev.code) { FB_CODE = ev.code; const i = $('#fbCode'); if (i && !i.value) i.value = FB_CODE; } } catch (e) {}
}
function fbMsg(text, ok) { const m = $('#fbMsg'); if (!m) return; m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.hidden = false; }
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fbForm') return;
  e.preventDefault();
  const ratings = [];
  for (let i = 0; i < QS.length; i++) {
    const r = document.querySelector(`input[name="q${i}"]:checked`);
    if (!r) { fbMsg('Please choose one option in every row.', false); return; }
    ratings.push(parseInt(r.value, 10));
  }
  const btn = $('#fbSend') || {}; btn.disabled = true;
  try {
    await WS.init();
    const res = await WS.submitFeedback({
      event_code: $('#fbCode').value.trim().toUpperCase(), ratings,
      best_session: $('#fbBest').value.trim(), improve: $('#fbImprove').value.trim(),
      first_ai_use: $('#fbFirst').value.trim(), recommend: $('#fbRec').checked,
    });
    if (res.error) { fbMsg(res.error.code === '42501' ? 'The event code did not match. Check it with the facilitator and send again.' : 'Could not send: ' + res.error.message, false); btn.disabled = false; return; }
    if ($('#fbForm')) $('#fbForm').reset(); if ($('#fbCode')) $('#fbCode').value = FB_CODE;
    fbMsg('Thank you! Your feedback is saved.', true);
  } catch (err) { fbMsg('Could not send. Check the internet connection and try again.', false); }
  btn.disabled = false;
});

/* ---------- facilitator keys: trainer only ----------
   The keys are not in this page: they are read from the database, which returns them to an
   approved trainer only. Everyone else sees nothing at the key places (empty .ans elements). */
let ANSWERS = null;
const OPEN_ANS = new Set();
async function loadAnswers(pkg) {
  if (!window.WS || !WS.isTrainer() || ANSWERS) return;
  try {
    const r = await WS.listAnswers(pkg);
    if (r.error) return;
    ANSWERS = Object.fromEntries((r.data || []).map(a => [a.key, a.html]));
    mountAnswers();
  } catch (e) {}
}
function mountAnswers() {
  if (!ANSWERS) return;
  document.querySelectorAll('.ans[data-ans]').forEach(el => {
    const k = el.dataset.ans, h = ANSWERS[k];
    if (!h) return;
    const open = OPEN_ANS.has(k);
    el.innerHTML = `<button type="button" class="btn ans-btn" data-ans-toggle="${k}" aria-expanded="${open}">${open ? '▲ Hide facilitator key' : '▼ Show facilitator key'}<span class="ans-tag">trainer only</span></button><div class="ans-body"${open ? '' : ' hidden'}>${h}</div>`;
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ans-toggle]');
  if (!b) return;
  const k = b.dataset.ansToggle;
  OPEN_ANS.has(k) ? OPEN_ANS.delete(k) : OPEN_ANS.add(k);
  mountAnswers();
});

/* ---------- routing (same access rule as the other courses) ---------- */
let MATERIALS_OK = false;
function gateView() {
  const signedIn = !!(window.WS && WS.session);
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">Private materials</p><h1>${signedIn ? 'You are not registered for this training' : 'Sign in to see the materials'}</h1>
  <p class="meta">${signedIn
    ? 'These materials are open only to participants registered for this training. If your registration is still waiting for approval, or you are in another training, contact the trainer.'
    : 'These materials are private for now. Participants registered for this training can sign in to see them. New here? Register; the materials open once the trainer approves you.'}</p>
  ${signedIn ? '' : `<p><a class="btn primary" href="../login.html?next=${encodeURIComponent(location.pathname + location.search + location.hash)}">Sign in / register</a></p>`}</div>`;
}
function route() {
  if (!MATERIALS_OK) { $('#view').innerHTML = gateView(); renderSide('home'); return; }
  const id = (location.hash || '#home').slice(1) || 'home';
  let html, cur = id;
  if (S[id]) html = vSession(S[id]);
  else if (M[id]) html = vMat(M[id]);
  else if (id === 'resources') html = vResources();
  else if (id === 'agenda') html = vAgenda();
  else if (id === 'handbook') html = vHandbook();
  else if (id === 'feedback') html = vFeedback();
  else { html = vHome(); cur = 'home'; }
  $('#view').innerHTML = html;
  mountAnswers();
  renderSide(cur);
  closeSide();
  window.scrollTo({ top: 0 });
  store.set('last', cur);
  teachBar(cur);
}
/* ?teach=1 (the event page's teaching tab): every session one tap away; ?embed=1 hides this page's own menus. */
function teachBar(cur) {
  if (!window.TeachBar || !TeachBar.on) return;
  TeachBar.mount({ days: DATA.DAYS, titleOf, num: it => it.kind === 'session' ? S[it.id].n : null,
    lead: [['home', 'Dashboard'], ['agenda', 'Agenda']], tail: [['resources', 'Materials'], ['prompts', 'Prompts']] });
  TeachBar.update(cur);
}

/* ---------- interactions ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) { if (el) selectText(el); toast('Text selected: long-press and choose Copy'); }
}
document.addEventListener('click', e => {
  const c = e.target.closest('.copy');
  if (c) { const pre = document.getElementById(c.dataset.copyId); copyText(pre.textContent, pre); return; }
  const t = e.target.closest('.toggle-done');
  if (t) { const id = t.dataset.sess; done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); const y = scrollY; route(); scrollTo(0, y); return; }   // stay where the button was pressed
  if (e.target.closest('[data-print]')) { window.print(); return; }
  if (!e.target.closest('.search')) $('#results').hidden = true;
});

/* ---------- host, venue and date from the event (../event-info.js) ---------- */
let ORG = '', PLACE = '', DATES = '', EV_NAME = '', EV_DATES = [];
async function applyEvent() {
  const ev = await EVI.resolve(COURSE);
  if (!ev) return;
  const info = EVI.info(ev);
  ORG = info.org; PLACE = info.place; EV_NAME = info.name; EV_DATES = info.iso.map(d => String(d).slice(0, 10));
  DATES = EVI.enRange(EV_DATES);
  if (DATES) DAY.date = DATES;
  $('#brandSub').textContent = 'AI for CSOs' + (ORG ? ' · ' + ORG : '') + (DATES ? ' · ' + DATES : '');
  document.title = (EV_NAME || 'AI for CSOs') + ' · AI for ALL';
}

/* search */
const INDEX = [];
function buildIndex() {
  INDEX.length = 0;
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' '); };
  DATA.SESS.forEach(s => INDEX.push({ id: s.id, title: 'Session ' + s.n + ': ' + s.title, text: strip(s.plan.objective + ' ' + s.plan.steps + ' ' + s.plan.outcome) }));
  DATA.MATS.forEach(m => INDEX.push({ id: m.id, title: m.short + ': ' + m.title, text: strip(m.html) }));
  INDEX.push({ id: 'agenda', title: 'Facilitator guide and agenda', text: strip(DATA.AGENDA_HTML) });
  INDEX.push({ id: 'feedback', title: 'Feedback form', text: QS.join(' ') });
}
buildIndex();
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  const hits = [];
  for (const it of INDEX) {
    const i = it.text.toLowerCase().indexOf(q), inT = it.title.toLowerCase().includes(q);
    if (i < 0 && !inT) continue;
    hits.push({ ...it, snip: i < 0 ? '' : '…' + it.text.slice(Math.max(0, i - 40), i + 70) + '…', score: inT ? 0 : 1 });
  }
  hits.sort((a, b) => a.score - b.score);
  box.innerHTML = hits.length ? hits.slice(0, 12).map(h => `<a href="#${h.id}"><b>${esc(h.title)}</b><small></small></a>`).join('') : '<p style="padding:8px 10px;margin:0;color:var(--muted)">Nothing found.</p>';
  box.querySelectorAll('small').forEach((s, k) => s.textContent = hits[k].snip);
  box.hidden = false;
});
$('#results').addEventListener('click', e => { if (e.target.closest('a')) { $('#results').hidden = true; $('#q').value = ''; } });

/* drawer */
function closeSide() { $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
$('#menuBtn').addEventListener('click', () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });

window.addEventListener('hashchange', route);
/* Start-up: show "loading" at once, give the database a few seconds, and if it does not answer,
   say so with a retry button. Event details are filled in after the first draw. */
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const LOADING = '<p class="eyebrow" style="margin-top:20px">Loading…</p>';
function slowView() {
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">Slow connection</p><h1>The materials could not load</h1>
  <p class="meta">The connection to the server is slow or broken. Check the internet and try again.</p>
  <p><button class="btn primary" data-retry>Try again</button></p></div>`;
}
let EVENT_DONE = false;
let TYPED = false;
document.addEventListener('input', () => { TYPED = true; }, true);
let HOME = null;
async function start() {
  $('#view').innerHTML = LOADING;
  let ok;
  try {
    await withTimeout(WS.init(), 7000);
    ok = WS.isTrainer() || (await withTimeout(WS.materialsAccess(new URLSearchParams(location.search).get('event')), 7000));
  } catch (e) { ok = e && e.message === 'timeout' ? null : false; }
  if (ok === null) { $('#view').innerHTML = slowView(); renderSide('home'); return; }
  MATERIALS_OK = ok;
  route();
  loadAnswers('cso');
  loadFbCode();
  // English labels on this page: the trainer's console, or the site's home page.
  if (window.EVI && !HOME) EVI.home().then(h => { HOME = Object.assign({}, h, { label: /admin/.test(h.href) ? 'Trainer console' : 'Home' }); EVI.mountHome(HOME); }).catch(() => {});
  if (EVENT_DONE) return;
  try {
    await withTimeout(applyEvent(), 7000);
    EVENT_DONE = true;
    if (!TYPED) { const y = scrollY; route(); scrollTo(0, y); }
  } catch (e) {}
}
document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) start(); });
start();
</script>
</body>
</html>
