<style>
/* Layout: a two-day running order on the left (the spine of the event), the selected session's handbook pages on the right; phones get the order as a drawer. */
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #142440; --muted: #556275; --line: #D6DDE6;
  --accent: #B3123A; --accent-ink: #FFFFFF; --navy: #1C3A66; --soft: #E6ECF4;
  --prompt-bg: #FFF5DC; --prompt-line: #C98A0B; --prompt-ink: #3B2E10;
  --warn-bg: #FBE8EC; --warn-line: #B3123A; --doc-bg: #F6F7F9; --ok: #237A52; --ok-bg: #E2F2EA;
  --now-bg: #FBE3E9;
  --f-body: 'Mukta', 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', system-ui, sans-serif;
  --f-display: 'Rozha One', 'Mukta', 'Noto Serif Devanagari', Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark }

* { box-sizing: border-box }
html { height: 100% } body { min-height: 100% }   /* not a fixed height: the sticky header must stay on screen past the first screenful */
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer }
a { color: var(--navy) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--accent); white-space: nowrap }
.brand span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.search { margin-left: auto; position: relative; flex: 0 1 340px; min-width: 0 }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 15px }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 30px rgba(10,20,40,.18); padding: 6px }
.results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink) }
.results a:hover, .results a:focus { background: var(--soft) }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4 }
.home-link { white-space: nowrap; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--navy) }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 15px }

.shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100vh - 56px) }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto }
.nav-links { display: grid; gap: 2px; margin-bottom: 14px }
.nav-links a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 8px; font-weight: 500 }
.nav-links a[aria-current="page"] { background: var(--soft); color: var(--navy) }
.day-h { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px }
.day-h b { color: var(--ink); font-size: 14px; letter-spacing: 0 }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.tl a, .tl .brk { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; line-height: 1.35 }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; padding-top: 2px }
.tl .brk { color: var(--muted); font-size: 13.5px }
.tl a:hover { background: var(--soft) }
.tl a[aria-current="page"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy) }
.tl a.is-now { background: var(--now-bg) }
.chip { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; align-self: center }
.chip.now { background: var(--accent); color: var(--accent-ink) }
.chip.done { background: var(--ok-bg); color: var(--ok) }

main { min-width: 0; padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 48px) }
.wrap { max-width: 880px; margin-inline: auto }   /* centred: even space on both sides */
.eyebrow { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.2; margin: 4px 0 10px; text-wrap: balance }
.meta { color: var(--muted); margin: 0 0 18px }
.prose h2.sec-h { font-size: 24px; margin: 30px 0 10px }
.prose h3 { font-size: 21px; margin: 30px 0 8px; color: var(--navy); text-wrap: balance }
.prose h4 { font-size: 17.5px; margin: 20px 0 6px }
.prose p { margin: 8px 0 }   /* same width as lists, tables and prompt boxes: one even text edge */
.prose ul, .prose ol { padding-left: 1.4em; margin: 8px 0 }
.prose li { margin: 4px 0 }
.prose .note { color: var(--muted); font-size: 14.5px }
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 8px }
ol.steps > li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0 }
ol.steps > li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px }
ol.steps > li > div { min-width: 0 }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }
th { background: var(--soft); text-align: left; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
.box { border-radius: var(--r); padding: 12px 16px; margin: 14px 0; border-left: 4px solid var(--navy); background: var(--soft) }
.box.warn { background: var(--warn-bg); border-left-color: var(--warn-line) }
.box.doc { background: var(--doc-bg); border-left-color: var(--muted); border: 1px solid var(--line); border-left-width: 4px }
.box-t { font-weight: 700; margin: 0 0 4px }
.prompt { margin: 14px 0; border-radius: var(--r); background: var(--prompt-bg); border: 1px solid var(--prompt-line); overflow: hidden }
.prompt figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 700; color: var(--prompt-ink); border-bottom: 1px dashed var(--prompt-line) }
.prompt pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; font-family: var(--f-body); font-size: 15.5px; color: var(--prompt-ink); line-height: 1.6 }
.copy, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 14px; font-weight: 500; white-space: nowrap }
.copy { border-color: var(--prompt-line) }
.btn.primary { background: var(--navy); color: var(--surface); border-color: var(--navy) }
.btn[disabled] { opacity: .55; cursor: not-allowed }
code.ic { font-family: var(--f-body); background: var(--prompt-bg); color: var(--prompt-ink); border-radius: 5px; padding: 1px 6px }
.mini-copy { border: 0; background: none; color: var(--navy); font-size: 12.5px; text-decoration: underline; padding: 0 4px }

.plan { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 6px 0 22px }
.plan div { background: var(--surface); padding: 12px 14px; min-width: 0 }
.plan dt { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em }
.plan dd { margin: 2px 0 0; font-size: 15px; line-height: 1.5 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px }
.actions.done-end { margin: 32px 0 0; padding-top: 18px; border-top: 1px solid var(--line) }   /* the second "mark as done", at the end of the session */
.done-end + .pager { margin-top: 18px }
.toggle-done[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok) }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; min-width: 0 }
a.card:hover { border-color: var(--navy) }
.card .k { font-size: 13px; font-weight: 700; color: var(--accent) }
.card .s { font-size: 13.5px; color: var(--muted) }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap }
.pager a { max-width: 48%; min-width: 0 }

/* home */
.hero { display: grid; gap: 4px; margin-bottom: 18px }
.hero h1 { font-size: clamp(30px, 5vw, 50px) }
.factline { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px }
.factline b { color: var(--ink); font-weight: 500 }
.nowcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; margin: 18px 0 }
.nowtop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }

.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px }
.nowgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px }
.slot { border-radius: 10px; padding: 12px 14px; background: var(--bg); display: grid; gap: 2px; text-decoration: none; color: var(--ink); min-width: 0 }
.slot.live { background: var(--now-bg) }
.slot .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent) }

.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted) }

.daycol { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0 }
.daycol h3 { margin: 0; font-size: 18px }
.daycol p.th { margin: 0 0 8px; color: var(--muted); font-size: 14px }
.block { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; padding: 8px 6px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); align-items: baseline }
.block .t { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted) }
.block.b { color: var(--muted); font-size: 14px; padding-block: 4px }
.block .n { font-family: var(--f-display); color: var(--accent); margin-right: 6px }
a.block:hover { background: var(--soft) }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.dl-list { display: grid; gap: 10px }
.dl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between }
.dl .ti { font-weight: 700 }
.dl .wh { font-size: 13.5px; color: var(--muted) }
.dl .fmts { display: flex; gap: 8px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 50 }
.section-title { font-size: 20px; margin: 26px 0 8px }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0,1fr) }
  .side { position: fixed; inset: 56px auto 0 0; width: min(330px, 88vw); height: auto; z-index: 30; transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.25) }
  .side.open { transform: none }

}

}
.ans:empty { display: none }
.ans { margin: 14px 0 }
.ans-btn { border-color: var(--ok); color: var(--ok); font-weight: 700 }

</style>

<script>

window.D_CSO = {"INTRO":"Everything for the day in one place: the session plan, the Participant Workbook (quick reference, Nepali voice typing, exercise sheets Ex 1–Ex 8, prompt library, quiz), the Use Case 1 materials M1–M11 and the facilitator demo scripts D1–D7. All sample materials are fictional. Copy any grey box with its Copy button and paste it straight into ChatGPT, Claude or NotebookLM.","AGENDA_HTML":"<p><strong>AI for Civil Society Organisations (CSOs): a 5-hour workshop · 09:45–16:00</strong></p>\n<p>A ready-to-run, one-day workshop that teaches staff of any civil society organisation (CSO) to use AI safely in their daily work. The core sessions are generic. A <strong>use case</strong> supplies the examples and sample materials for each CSO; this event uses <a href=\"#uc\">Use Case 1: child rights and education (Loo Niva Child Concern Group)</a>.</p>\n<h2>Objectives and learning outcomes</h2>\n<p><strong>Overall objective:</strong> CSO staff understand AI, assess it critically, and use it effectively and responsibly in their office work and programmes.</p>\n<p><strong>Participants:</strong> 15–30 staff of one CSO or a mix of CSOs: programme, M&amp;E, communication, finance/admin and field staff. Mixed experience is expected, so pairs combine a beginner with a confident user.</p>\n<h3>By 16:00, participants will be able to</h3>\n<ol><li>Explain in plain words what generative AI is, what it does well, and where it fails.</li><li>Type in Nepali by voice on their own mobile phone, and use voice to talk to an AI tool.</li><li>Write structured prompts (R-C-T-F-C) and improve outputs through follow-up questions.</li><li>Use ChatGPT, Claude and NotebookLM for minutes, reports, translation, summaries and document questions.</li><li>Draft campaign and advocacy content for their CSO's issues and audiences.</li><li>Use AI to support concept notes, problem trees, Theory of Change, logframes and donor communication.</li><li>Recognise hallucination, bias, plagiarism and copyright risks, and verify outputs before use.</li><li>Apply the traffic-light rules for privacy, confidentiality and safeguarding, and decide when NOT to use AI.</li></ol>\n<h2>Agenda at a glance</h2>\n<p>Nine sessions total 300 minutes of learning. Registration opens at 09:30. Breaks add 75 minutes.</p>\n<div class=\"tbl\"><table><thead><tr><th>Time</th><th>Min</th><th>Session</th><th>Tools</th><th>Materials</th></tr></thead><tbody><tr><td>09:45–10:10</td><td>25</td><td><a href=\"#s1\">1. Opening, pre-assessment and \"AI in my week\"</a></td><td>Phone (quiz)</td><td>Ex 1, Quiz</td></tr><tr><td>10:10–10:35</td><td>25</td><td><a href=\"#s2\">2. AI demystified: what it is and what it is not</a></td><td>ChatGPT (demo)</td><td>D1, M11, Ex 2</td></tr><tr><td>10:35–11:00</td><td>25</td><td><a href=\"#s3\">3. Nepali voice typing on your phone</a></td><td>Gboard, ChatGPT/Claude app</td><td>Voice guide, D7</td></tr><tr><td>11:00–11:40</td><td>40</td><td><a href=\"#s4\">4. Prompting lab: R-C-T-F-C</a></td><td>ChatGPT, Claude</td><td>D2, M9, Ex 3</td></tr><tr><td>11:40–11:55</td><td>15</td><td>Tea break</td><td></td><td></td></tr><tr><td>11:55–12:40</td><td>45</td><td><a href=\"#s5\">5. AI for daily office work (4 stations)</a></td><td>ChatGPT, Claude, NotebookLM</td><td>M1–M4, Ex 4</td></tr><tr><td>12:40–13:25</td><td>45</td><td>Lunch</td><td></td><td></td></tr><tr><td>13:25–14:15</td><td>50</td><td><a href=\"#s6\">6. Campaign and advocacy studio</a></td><td>ChatGPT, Claude</td><td>D3, M8, Ex 5</td></tr><tr><td>14:15–14:30</td><td>15</td><td>Tea break and energiser</td><td></td><td></td></tr><tr><td>14:30–15:15</td><td>45</td><td><a href=\"#s7\">7. Fundraising and proposals with AI</a></td><td>Claude, ChatGPT, NotebookLM</td><td>D4–D5, M5–M7, Ex 6</td></tr><tr><td>15:15–15:45</td><td>30</td><td><a href=\"#s8\">8. Responsible AI: \"Should I use AI here?\"</a></td><td>None (cards)</td><td>D6, M10, Ex 7</td></tr><tr><td>15:45–16:00</td><td>15</td><td><a href=\"#s9\">9. Action plan, post-assessment and closing</a></td><td>Phone (quiz)</td><td>Ex 8, Quiz, feedback</td></tr></tbody></table></div>\n<h2>Tools for the hands-on work</h2>\n<p>All exercises use only three AI tools, on free accounts. Participants should sign in before the day. Other tools (Gemini, Copilot and others) can be mentioned once, because the skills transfer.</p>\n<div class=\"tbl\"><table><thead><tr><th>Tool</th><th>Best used for in this workshop</th><th>Access</th><th>Watch out for</th></tr></thead><tbody><tr><td>ChatGPT</td><td>Quick drafts, social posts, translation, brainstorming, image concepts, voice conversation in Nepali</td><td>chatgpt.com or the ChatGPT app, free account</td><td>Invents facts and sources when it has no data. Check privacy settings in Settings → Data controls</td></tr><tr><td>Claude</td><td>Long documents, careful writing, structured reports, proposal drafting, critical review of drafts</td><td>claude.ai or the Claude app, free account</td><td>Free plan has message limits. It still makes mistakes, so verify facts</td></tr><tr><td>NotebookLM</td><td>Questions and summaries grounded only in your own uploaded documents, with citations; briefing notes; audio overviews</td><td>notebooklm.google.com with a Google account</td><td>Answers only from the sources you add, and it can still misread them. Click citations to check. Free plan has daily limits</td></tr><tr><td>Gboard (keyboard, not a chatbot)</td><td>Nepali voice typing into any app: ChatGPT, Claude, NotebookLM, Messenger, Docs</td><td>Google Play Store (often pre-installed on Android)</td><td>Needs internet for Nepali. Check spelling and punctuation after dictating</td></tr></tbody></table></div>\n<p><strong>A simple rule for choosing:</strong> for a quick draft or idea, use ChatGPT. For a long or careful document, use Claude. To ask questions about our own documents, use NotebookLM.</p>\n<h2>Design principles</h2>\n<ol><li>Practice on real-looking work: every exercise uses the CSO's own kind of document.</li><li>About 55% hands-on and 45% input. Every practical session ends with a \"Verify it\" checkpoint.</li><li>Safe by design: all sample materials are fictional or anonymised. Participants never paste real personal data.</li><li>Inclusive: Nepali voice typing helps staff who type slowly or are more comfortable in Nepali.</li></ol>\n<p><strong>Material codes:</strong> Ex 1–Ex 8 = exercise sheets (Workbook); M1–M11 = sample materials in the use case; D1–D7 = facilitator demo scripts.</p>\n<h2>Assessment and scoring</h2>\n<p>The same 10 quiz items are used before (09:50) and after (15:50), in the online <a href=\"../assessment/index.html\">AI knowledge test</a>. Do not show answers until the post-assessment is complete.</p>\n<ol><li>One point per correct answer (0–10). Record the pre and post score for each participant code.</li><li><strong>Learning gain</strong> = average post score − average pre score. Report it in points and as a percentage of the pre score.</li><li><strong>Normalised gain</strong> (optional) = (post − pre) ÷ (10 − pre). Above 0.3 is a good result for a one-day workshop.</li><li><strong>Confidence change:</strong> the average change on each of the 5 confidence statements (1–5).</li><li>Report the 2–3 questions that most people still got wrong in the post-assessment, and cover them in the follow-up clinic.</li></ol>\n<h2>Preparation checklist</h2>\n<p><strong>One to two weeks before</strong></p>\n<ul><li>Agree the use case with the host CSO, or build a new one from the template</li><li>Ask the CSO for 3–4 anonymised samples of real work to adapt M1–M7, plus its safeguarding and data-protection policies</li><li>Get the participant list with roles and phone type (Android or iPhone)</li><li>Send the pre-workshop message: create free accounts on ChatGPT, Claude and NotebookLM (a Google account); update Gboard (Android); charge phones; bring a laptop if possible</li><li>Open the pre-test and print the QR codes (trainer console → event)</li></ul>\n<p><strong>The day before</strong></p>\n<ul><li>Print: Workbook (one per person), use-case materials M1–M10 (one set per group), station cards, scenario cards, and green, amber and red cards (one set per person)</li><li>Share this page's link or QR code for copy and paste of M1–M8</li><li>Test the Wi-Fi for 30 users, and keep a mobile hotspot as a backup</li><li>Set up two helper phones (Android and iPhone) with Nepali voice typing working</li><li>Load the demo prompts D1–D7 into a notes file on the facilitator laptop</li></ul>\n<p><strong>Room set-up:</strong> 4–6 group tables of 4–5 people, a projector and screen, speakers, a phone-to-screen cable or casting, extension cords and multi-plugs for charging, flip charts, markers and sticky notes. Label the four station tables A–D.</p>\n<h2>Deliverables to the host CSO</h2>\n<div class=\"tbl\"><table><thead><tr><th>Deliverable</th><th>When</th></tr></thead><tbody><tr><td>Session plan and methodology (this page)</td><td>Before the training</td></tr><tr><td>Slide presentation, Workbook and use-case materials</td><td>Before the training</td></tr><tr><td>Prompt library (Nepali and English)</td><td>On the day, shared digitally</td></tr><tr><td>Pre/post quiz, confidence rating and feedback form</td><td>On the day</td></tr><tr><td>Draft AI use guideline for the CSO (traffic light)</td><td>Within 1 week</td></tr><tr><td>Training summary report: attendance, learning gain, feedback and recommendations</td><td>Within 1 week</td></tr></tbody></table></div>\n<p><strong>Recommended follow-up:</strong> a 1-hour online \"AI clinic\" after 4–6 weeks to review real uses, plus naming 1–2 internal AI champions.</p>\n<h2>Adapting the workshop to another CSO</h2>\n<p>The sessions, demos, quiz and Workbook stay the same. Only the use case changes.</p>\n<ol><li><strong>Profile:</strong> the organisation's themes, target groups, working areas, partners and typical donors, taken from its website and documents.</li><li><strong>Sample materials M1–M11:</strong> rewrite each to fit the CSO's work, keeping the same purpose and the same deliberate flaws. For example, M7 must still have a missing baseline and vague activities, and M11 must still contain invented statistics.</li><li><strong>Campaign briefs (M8):</strong> choose the CSO's 4 real advocacy issues.</li><li><strong>Scenarios (M10):</strong> include at least 2 red cases that fit the CSO's data risks, for example survivors' stories, health records, land disputes or beneficiary lists.</li><li><strong>Keep it fictional:</strong> never use real names, real case details or unverified statistics. Label every sheet \"Fictional training material\".</li></ol>\n<p><strong>Suggested future use cases:</strong> women's rights and gender-based violence; disability rights; health and nutrition; environment and community forestry; governance and anti-corruption; cooperatives and livelihoods; disaster risk reduction; youth networks.</p>","OBJECTIVE":"CSO staff understand AI, assess it critically, and use it effectively and responsibly in their office work and programmes.","OUTCOMES":["Explain in plain words what generative AI is, what it does well, and where it fails.","Type in Nepali by voice on their own mobile phone, and use voice to talk to an AI tool.","Write structured prompts (R-C-T-F-C) and improve outputs through follow-up questions.","Use ChatGPT, Claude and NotebookLM for minutes, reports, translation, summaries and document questions.","Draft campaign and advocacy content for their CSO's issues and audiences.","Use AI to support concept notes, problem trees, Theory of Change, logframes and donor communication.","Recognise hallucination, bias, plagiarism and copyright risks, and verify outputs before use.","Apply the traffic-light rules for privacy, confidentiality and safeguarding, and decide when NOT to use AI."],"MATS":[{"id":"qref","short":"Workbook","title":"Quick reference: prompt formula, tools, traffic light","use":"R-C-T-F-C, which tool for what, five habits","html":"<p>This workbook is yours to keep. It holds everything you need on the day and afterwards.</p>\n<h3>The prompt formula: R-C-T-F-C</h3>\n<div class=\"tbl\"><table><thead><tr><th>Letter</th><th>Ask yourself</th><th>Example</th></tr></thead><tbody><tr><td><strong>R</strong>ole</td><td>Who should the AI act as?</td><td>\"You are a communications officer at a Nepali CSO working on [theme].\"</td></tr><tr><td><strong>C</strong>ontext</td><td>Who, where, why, for which audience?</td><td>\"For parents in a rural municipality, many with low literacy.\"</td></tr><tr><td><strong>T</strong>ask</td><td>What exactly should it do?</td><td>\"Write an invitation to a one-day orientation.\"</td></tr><tr><td><strong>F</strong>ormat</td><td>Length, structure, language, tone?</td><td>\"Simple Nepali, under 80 words, warm tone, with blanks for date and venue.\"</td></tr><tr><td><strong>C</strong>onstraints</td><td>What to avoid or keep?</td><td>\"No jargon, no English words, do not invent facts.\"</td></tr></tbody></table></div>\n<p><strong>Then improve it by talking:</strong> \"Make it simpler\", \"Give me 3 options\", \"Shorter, for SMS\", \"Ask me 5 questions before you write\", \"What is weak in this draft?\"</p>\n<h3>Which tool for what</h3>\n<div class=\"tbl\"><table><thead><tr><th>I want to…</th><th>Use</th><th>Tip</th></tr></thead><tbody><tr><td>Get a quick draft, post, idea or translation</td><td>ChatGPT</td><td>Give R-C-T-F-C, then refine</td></tr><tr><td>Write or improve a long, careful document (report, proposal, policy)</td><td>Claude</td><td>Paste your notes and ask for structure first</td></tr><tr><td>Ask questions only about <em>our own</em> documents</td><td>NotebookLM</td><td>Add sources, ask, then click the citation numbers to check</td></tr><tr><td>Type Nepali by speaking</td><td>Gboard voice typing</td><td>See <a href=\"#voice\">Nepali voice typing</a></td></tr></tbody></table></div>\n<h3>The traffic light: should I use AI here?</h3>\n<div class=\"tbl\"><table><thead><tr><th>Light</th><th>Rule</th><th>Examples</th></tr></thead><tbody><tr><td><strong>Green: go</strong></td><td>Public or non-sensitive content. A human still reviews it.</td><td>Posts, emails, invitations, summaries of public documents, brainstorming, grammar, general translation</td></tr><tr><td><strong>Amber: caution</strong></td><td>Allowed only with anonymised data and checking; label it where needed</td><td>Proposals and donor reports (check every fact); internal reports with names removed; analysis of aggregated, non-identifiable figures; AI images labelled as illustrations</td></tr><tr><td><strong>Red: stop</strong></td><td>Do not put this into any AI tool</td><td>Names, photos or case files of children, survivors or beneficiaries; protection or abuse cases; beneficiary lists; staff personal or salary data; confidential donor or partner documents; final decisions about people; realistic fake images of real people</td></tr></tbody></table></div>\n<h3>Five habits for every use</h3>\n<ol><li><strong>Protect:</strong> remove names and identifiers before pasting. If in doubt, leave it out.</li><li><strong>Verify:</strong> check every fact, figure, citation, law and name against the original source.</li><li><strong>Own it:</strong> a person, not the tool, is responsible for anything we publish or submit.</li><li><strong>Be original:</strong> rewrite in our own voice, and follow donor and copyright rules.</li><li><strong>Be fair:</strong> look for bias and stereotypes about gender, caste, ethnicity, disability, region and age.</li></ol>\n<h3>Privacy settings to check today</h3>\n<ul><li><strong>ChatGPT:</strong> Settings → Data controls → decide whether \"Improve the model for everyone\" is on. Use a temporary chat for anything you would not want stored.</li><li><strong>Claude:</strong> Settings → Privacy → review whether your chats may be used to improve the models.</li><li><strong>NotebookLM:</strong> keep notebooks private, and share only with named colleagues.</li><li>Menu names change from time to time. If you cannot find a setting, ask the facilitator.</li></ul>","group":"workbook"},{"id":"voice","short":"Workbook","title":"Nepali voice typing on your phone","use":"Android, iPhone, laptop; talk to AI by voice","html":"<p>Speak Nepali and your phone types it in Devanagari, in any app: ChatGPT, Claude, NotebookLM, Messenger, WhatsApp, Gmail or Docs. Google's Gboard keyboard has supported Nepali voice typing on Android since 2017 (<a href=\"https://blog.google/products/search/type-less-talk-more/\" target=\"_blank\" rel=\"noopener\">Google</a>). You need internet for it to work.</p>\n<h3>Part A: Android phones (Gboard)</h3>\n<p><strong>Step 1. Install or update Gboard</strong></p>\n<ol><li>Open the <strong>Play Store</strong>.</li><li>Search for <strong>Gboard – the Google Keyboard</strong>.</li><li>Tap <strong>Install</strong> (or <strong>Update</strong> if it is already installed). Many phones already have it.</li></ol>\n<p><strong>Step 2. Make Gboard your keyboard</strong></p>\n<ol><li>Open the <strong>Gboard</strong> app, or go to <strong>Settings → System → Languages &amp; input → On-screen keyboard</strong>.<ul><li>On Samsung phones: <strong>Settings → General management → Keyboard list and default → Default keyboard → Gboard</strong>.</li></ul></li><li>Turn <strong>Gboard</strong> on, then choose it as the <strong>default</strong> keyboard.</li></ol>\n<p><strong>Step 3. Add the Nepali language</strong></p>\n<ol><li>Open any app where you can type (for example Messages) and tap the text box so the keyboard appears.</li><li>Tap the <strong>gear icon (Settings)</strong> on the keyboard's top bar. If you do not see it, tap the <strong>four squares</strong> icon first.</li><li>Tap <strong>Languages → Add keyboard</strong>.</li><li>Search for <strong>Nepali</strong> and choose <strong>नेपाली (Nepali)</strong>.</li><li>Choose a layout:<ul><li><strong>नेपाली</strong> (Devanagari keys), or</li><li>the <strong>transliteration (abc → नेपाली)</strong> layout, where you type \"namaste\" and get नमस्ते.</li></ul></li><li>Tap <strong>Done</strong>. You can keep English as well.</li></ol>\n<p><strong>Step 4. Turn on voice typing</strong></p>\n<ol><li>In <strong>Gboard Settings</strong>, tap <strong>Voice typing</strong>.</li><li>Turn on <strong>Use voice typing</strong>.</li></ol>\n<p><strong>Step 5. Speak in Nepali</strong></p>\n<ol><li>Open a text box. Switch the keyboard to Nepali: tap the <strong>globe icon</strong>, or <strong>press and hold the space bar</strong> and choose <strong>नेपाली</strong>. The space bar now shows \"नेपाली\".</li><li>Tap the <strong>microphone icon</strong> (top right of the keyboard).</li><li>The first time, tap <strong>Allow</strong> to give microphone permission.</li><li>Speak clearly in short sentences. The words appear as you speak.</li><li>Tap the microphone again to stop. Then check the text and add punctuation (। , ?) by hand where needed.</li></ol>\n<h3>Part B: iPhone</h3>\n<p>iPhone's own dictation may not offer Nepali, so use one of these options.</p>\n<p><strong>Option B1: Gboard for iPhone</strong></p>\n<ol><li>Install <strong>Gboard</strong> from the <strong>App Store</strong>.</li><li>Go to <strong>Settings → General → Keyboard → Keyboards → Add New Keyboard → Gboard</strong>.</li><li>Tap <strong>Gboard</strong> in the list and turn on <strong>Allow Full Access</strong>. Voice typing needs this.</li><li>Open the <strong>Gboard app → Languages → Add language → नेपाली</strong>.</li><li>In any app, tap the <strong>globe icon</strong> to switch to Gboard, choose Nepali, then tap or press and hold the <strong>microphone</strong>.</li><li>If Nepali voice is not offered on your iPhone, use Option B2.</li></ol>\n<p><strong>Option B2: the microphone inside the ChatGPT app</strong></p>\n<ol><li>Open the <strong>ChatGPT</strong> app and tap the <strong>microphone</strong> in the message box.</li><li>Speak in Nepali, then tap to stop. ChatGPT turns your speech into text.</li><li>Check the text, then send it, or copy it into another app.</li></ol>\n<p><strong>For Nepali typing (not voice):</strong> Settings → General → Keyboard → Keyboards → Add New Keyboard → <strong>Nepali</strong>.</p>\n<h3>Part C: laptop (Google Docs)</h3>\n<ol><li>Open <strong>Google Docs</strong> in the <strong>Chrome</strong> browser.</li><li>Go to <strong>Tools → Voice typing</strong> (or press <strong>Ctrl + Shift + S</strong>).</li><li>Click the language name above the microphone and choose <strong>नेपाली</strong>.</li><li>Click the microphone and speak. Allow microphone access the first time.</li></ol>\n<h3>Part D: talk to AI by voice</h3>\n<ul><li><strong>ChatGPT app:</strong> tap the <strong>microphone</strong> (dictation) to turn speech into a typed message you can check before sending. The <strong>sound-wave</strong> button starts a live spoken conversation instead.</li><li><strong>Claude app:</strong> tap the <strong>microphone</strong> in the message box, or use the Gboard microphone inside Claude's text box.</li><li><strong>NotebookLM:</strong> use the Gboard microphone to speak your question in the chat box.</li><li><strong>Best practice:</strong> speak your rough notes, then ask the AI: \"यसलाई सफा गरेर माइन्युट/रिपोर्टको ढाँचामा लेखिदिनुहोस्\" (Clean this up and write it as minutes/a report).</li></ul>\n<h3>Practice script (read aloud)</h3>\n<figure class=\"prompt\"><figcaption><span>Practice script</span><button class=\"copy\" data-copy-id=\"cp1\">Copy</button></figcaption><pre id=\"cp1\">नमस्कार, भोलिको बैठक बिहान दस बजे संस्थाको कार्यालयमा हुनेछ। कृपया समयमै उपस्थित हुनुहोला।\n\nआज वडा नम्बर पाँचमा सामुदायिक बैठक सम्पन्न भयो। बैठकमा पच्चीस जना सहभागी हुनुभयो, जसमध्ये अठार जना महिला थिए। सहभागीहरूले सेवा पाउन धेरै टाढा जानुपर्ने गुनासो गर्नुभयो। अर्को बैठक अर्को महिनाको पहिलो साता गर्ने निर्णय भयो।</pre></figure>\n<p>After dictating, compare with the script. Did the numbers, names and the । marks come out right?</p>\n<h3>Troubleshooting</h3>\n<div class=\"tbl\"><table><thead><tr><th>Problem</th><th>Fix</th></tr></thead><tbody><tr><td>No microphone icon on the keyboard</td><td>Gboard Settings → Voice typing → turn on Use voice typing. Check that Gboard is the default keyboard</td></tr><tr><td>It types English, not Nepali</td><td>Switch the keyboard to नेपाली (globe icon, or press and hold the space bar) before tapping the microphone</td></tr><tr><td>Nothing happens, or \"Can't reach Google\"</td><td>Nepali voice typing needs internet. Check mobile data or Wi-Fi</td></tr><tr><td>Microphone permission refused</td><td>Phone Settings → Apps → Gboard → Permissions → Microphone → Allow</td></tr><tr><td>The Samsung keyboard keeps coming back</td><td>Set Gboard as the default keyboard (Step 2)</td></tr><tr><td>Many wrong words</td><td>Speak slower and closer to the phone, in a quiet place, in short sentences. Tap a wrong word to see suggestions</td></tr><tr><td>iPhone: no microphone in Gboard</td><td>Turn on Allow Full Access, or use Option B2</td></tr></tbody></table></div>\n<p><strong>Safety:</strong> do not dictate names, phone numbers or case details in a crowded place. The same traffic-light rules apply to voice.</p>","group":"workbook"},{"id":"ex1","short":"Ex 1","title":"AI in my week","use":"Exercise sheet, Session 1","html":"<p>Write the 2 tasks that take most of your working week, one per sticky note. Put them on the wall under <strong>Office</strong>, <strong>Campaign</strong>, <strong>Fundraising</strong> or <strong>Field</strong>.</p>\n<div class=\"tbl\"><table><thead><tr><th>My task</th><th>How long it takes per week</th><th>Could AI help? (guess now)</th><th>After today: how?</th></tr></thead><tbody><tr><td>1.</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>2.</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table></div>","group":"exercise"},{"id":"ex2","short":"Ex 2","title":"Good at / weak at","use":"Exercise sheet, Session 2","html":"<p>In pairs, sort these 12 cards into two piles: <strong>AI is good at</strong> and <strong>AI is weak at</strong>. Mark the ones you disagree about.</p>\n<ol><li>Writing a first draft of a letter</li><li>Giving the latest statistics for your district</li><li>Summarising a 40-page report</li><li>Telling you what the current law says, with section numbers</li><li>Brainstorming 10 campaign slogans</li><li>Giving real, working source links</li><li>Turning rough notes into a table</li><li>Deciding what to do in a child-protection or safeguarding case</li><li>Explaining a hard concept in simple words</li><li>Knowing your organisation's own figures and history</li><li>Translating a paragraph into Nepali</li><li>Doing a long budget calculation that nobody checks</li></ol>\n<div class=\"ans\" data-ans=\"cso-ex2\"></div>","group":"exercise"},{"id":"ex3","short":"Ex 3","title":"Prompt makeover","use":"Exercise sheet, Session 4","html":"<p>Take one weak prompt card (<a href=\"#m9\">M9</a>). Rewrite it with R-C-T-F-C. Run both versions in ChatGPT, then the strong one in Claude.</p>\n<div class=\"tbl\"><table><thead><tr><th></th><th>Your answer</th></tr></thead><tbody><tr><td>Weak prompt (from the card)</td><td></td></tr><tr><td><strong>R</strong>ole</td><td></td></tr><tr><td><strong>C</strong>ontext</td><td></td></tr><tr><td><strong>T</strong>ask</td><td></td></tr><tr><td><strong>F</strong>ormat</td><td></td></tr><tr><td><strong>C</strong>onstraints</td><td></td></tr><tr><td>What was better in the strong version?</td><td></td></tr><tr><td>ChatGPT or Claude: which output did you prefer, and why?</td><td></td></tr><tr><td>What would you still check before using it?</td><td></td></tr></tbody></table></div>","group":"exercise"},{"id":"ex4","short":"Ex 4","title":"Office work stations","use":"Exercise sheet, Session 5","html":"<p>Nine minutes at each station. Write down one time saving and one error you found.</p>\n<p><strong>Station A: minutes (ChatGPT or Claude + <a href=\"#m1\">M1</a>)</strong></p>\n<ol><li>Paste the rough notes (M1).</li><li>Prompt:<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp2\">Copy</button></figcaption><pre id=\"cp2\">Turn these notes into formal minutes: date, participants (roles only), agenda items, discussion summary, and a table of decisions with owner and deadline. Do not add anything that is not in the notes. Write [UNCLEAR] where the notes are unclear.</pre></figure></li><li>Check: Did it invent any decision, name or date?</li></ol>\n<p><strong>Station B: monthly progress report (Claude + <a href=\"#m2\">M2</a>)</strong></p>\n<ol><li>Paste the field activity notes (M2).</li><li>Prompt:<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp3\">Copy</button></figcaption><pre id=\"cp3\">Write a one-page monthly progress narrative for the donor: activities done, results against targets (as a table), challenges, and next month's plan. Use only these figures. Mark missing data as [DATA NEEDED].</pre></figure></li><li>Check: Do the numbers add up? Are the percentages correct?</li></ol>\n<p><strong>Station C: translation and back-translation (ChatGPT + <a href=\"#m3\">M3</a>)</strong></p>\n<ol><li>Paste the English text (M3). Prompt:<figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp4\">Copy</button></figcaption><pre id=\"cp4\">Translate into simple, natural Nepali for field staff with basic education. Short sentences, no difficult Sanskrit words. Then list any terms you were unsure about.</pre></figure></li><li>In a new chat, paste the Nepali text and ask: \"Translate this into English.\"</li><li>Compare with M3. What changed in meaning?</li></ol>\n<p><strong>Station D: ask our documents (NotebookLM + <a href=\"#m4\">M4</a>, M1, M2)</strong></p>\n<ol><li>Go to notebooklm.google.com → <strong>Create new notebook</strong>.</li><li><strong>Add source → Copied text</strong>, and paste M4. Repeat for M1 and M2.</li><li>Ask these four questions:<ul><li>\"What are the three biggest problems described in the sources?\"</li><li>\"Which places or groups are most affected? Give the figures.\"</li><li>\"Which decisions in the meeting notes respond to the problems in the situation brief?\"</li><li>\"What information is missing that a donor would ask for?\"</li></ul></li><li>Click two citation numbers. Does the source really say that?</li><li>Optional: Studio → <strong>Briefing doc</strong>, or an <strong>Audio Overview</strong> in Nepali.</li></ol>\n<div class=\"tbl\"><table><thead><tr><th>Station</th><th>Time saved (estimate)</th><th>Error or weakness found</th></tr></thead><tbody><tr><td>A</td><td></td><td></td></tr><tr><td>B</td><td></td><td></td></tr><tr><td>C</td><td></td><td></td></tr><tr><td>D</td><td></td><td></td></tr></tbody></table></div>","group":"exercise"},{"id":"ex5","short":"Ex 5","title":"Campaign canvas","use":"Exercise sheet, Session 6","html":"<p>Your group's brief (<a href=\"#m8\">M8</a>): ______________________. Use Claude for strategy and ChatGPT for posts and images.</p>\n<div class=\"tbl\"><table><thead><tr><th>Part</th><th>Your group's output</th></tr></thead><tbody><tr><td>Campaign objective (what change, by when)</td><td></td></tr><tr><td>Primary audience and secondary audience</td><td></td></tr><tr><td>Key message, Nepali (max 15 words)</td><td></td></tr><tr><td>Key message, English</td><td></td></tr><tr><td>3 social media posts</td><td></td></tr><tr><td>60-second radio or video script (outline)</td><td></td></tr><tr><td>Visual concept (in words, or a ChatGPT image labelled \"AI illustration\")</td><td></td></tr><tr><td>One risk (stereotype, wrong fact, harm to someone)</td><td></td></tr></tbody></table></div>","group":"exercise"},{"id":"ex6","short":"Ex 6","title":"Proposal clinic","use":"Exercise sheet, Session 7","html":"<p>Your group's task (circle one): (a) concept note, (b) logframe for one outcome, (c) review the weak draft <a href=\"#m7\">M7</a>, (d) donor update or business sponsorship pitch.</p>\n<ol><li>Read the donor call (<a href=\"#m5\">M5</a>) in NotebookLM first, and note the donor's 3 main criteria.</li><li>Use Claude with the field evidence (<a href=\"#m6\">M6</a>) for your task.</li><li>Fill in the check below before presenting.</li></ol>\n<div class=\"tbl\"><table><thead><tr><th>Check</th><th>Yes / No / Fix needed</th></tr></thead><tbody><tr><td>Every figure comes from M6 or is marked [TO CONFIRM]</td><td></td></tr><tr><td>It matches the donor's criteria and priorities</td><td></td></tr><tr><td>Activities are specific (who, where, how many, when)</td><td></td></tr><tr><td>Indicators are SMART</td><td></td></tr><tr><td>It sounds like our organisation, not a generic NGO</td><td></td></tr><tr><td>No copied text from other proposals</td><td></td></tr></tbody></table></div>","group":"exercise"},{"id":"ex7","short":"Ex 7","title":"Should I use AI here?","use":"Exercise sheet, Session 8","html":"<p>For each scenario (<a href=\"#m10\">M10</a>), raise green, amber or red. Note the group's answer and why.</p>\n<div class=\"tbl\"><table><thead><tr><th>No.</th><th>My light</th><th>Agreed light</th><th>Why</th></tr></thead><tbody><tr><td>1</td><td></td><td></td><td></td></tr><tr><td>2</td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td></tr><tr><td>4</td><td></td><td></td><td></td></tr><tr><td>5</td><td></td><td></td><td></td></tr><tr><td>6</td><td></td><td></td><td></td></tr><tr><td>7</td><td></td><td></td><td></td></tr><tr><td>8</td><td></td><td></td><td></td></tr></tbody></table></div>","group":"exercise"},{"id":"ex8","short":"Ex 8","title":"My AI action plan","use":"Exercise sheet, Session 9","html":"<div class=\"tbl\"><table><thead><tr><th></th><th>Task</th><th>Tool</th><th>First step, and when</th></tr></thead><tbody><tr><td>I will use AI for</td><td>1.</td><td></td><td></td></tr><tr><td></td><td>2.</td><td></td><td></td></tr><tr><td></td><td>3.</td><td></td><td></td></tr><tr><td>I will NOT use AI for</td><td>1.</td><td>Why:</td><td></td></tr></tbody></table></div>\n<p>One thing I will check every time before I use AI output: ______________________</p>","group":"exercise"},{"id":"prompts","short":"Workbook","title":"Prompt library for CSO work","use":"16 prompts to copy: office, research, campaign, proposals","html":"<p>Copy a prompt, fill in the [brackets], and paste it into the suggested tool. Never paste names, photos, case details or confidential data.</p>\n<h3>Office and documentation</h3>\n<p><strong>1. Meeting minutes</strong> <span class=\"note\">(ChatGPT or Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp5\">Copy</button></figcaption><pre id=\"cp5\">You are a programme officer at a Nepali CSO working on [theme]. Turn these rough notes from [meeting] into formal minutes: date, participants (roles only), agenda, discussion summary, and a table of decisions with owner and deadline. Do not add anything that is not in the notes; write [UNCLEAR] where needed. Language: [Nepali/English]. Notes: [paste]</pre></figure>\n<p><strong>2. Progress report</strong> <span class=\"note\">(Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp6\">Copy</button></figcaption><pre id=\"cp6\">Write a [1-page] progress narrative for [project] for [month] for [donor]. Use only these activities and figures: [paste]. Structure: activities, results against targets (table), challenges and how we responded, next steps. Mark any missing data as [DATA NEEDED]. Formal but plain English.</pre></figure>\n<p><strong>3. Email or letter</strong> <span class=\"note\">(ChatGPT)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp7\">Copy</button></figcaption><pre id=\"cp7\">Draft a [polite/formal] email to [recipient role] about [purpose]. Key points: [list]. Under [150] words, with a clear request and deadline. Give 2 versions: one formal, one warmer.</pre></figure>\n<p><strong>4. Translation with a check</strong> <span class=\"note\">(ChatGPT)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp8\">Copy</button></figcaption><pre id=\"cp8\">Translate into simple, natural Nepali for [audience, e.g. parents with low literacy]. Short sentences, everyday words. Keep these terms as they are: [terms]. Then list any words you were unsure about.</pre></figure>\n<p><strong>5. Spoken notes to clean text</strong> <span class=\"note\">(ChatGPT or Claude, after voice typing)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp9\">Copy</button></figcaption><pre id=\"cp9\">यो मैले बोलेर टाइप गरेको टिपोट हो। व्याकरण र विराम चिन्ह सच्याउनुहोस्, अर्थ नबदल्नुहोस्, र [माइन्युट / फिल्ड रिपोर्ट / सूचना] को ढाँचामा लेखिदिनुहोस्। टिपोट: [paste]</pre></figure>\n<h3>Research and our own documents</h3>\n<p><strong>6. Ask our documents</strong> <span class=\"note\">(NotebookLM)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp10\">Copy</button></figcaption><pre id=\"cp10\">Using only these sources, answer: [question]. Quote the relevant line for each point. If the sources do not answer it, say \"not in the sources\".</pre></figure>\n<p><strong>7. Summary with checks</strong> <span class=\"note\">(Claude or NotebookLM)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp11\">Copy</button></figcaption><pre id=\"cp11\">Summarise [document] in 5 points for [audience], each with a page or section reference. Then list 3 claims I should verify and where to verify them.</pre></figure>\n<p><strong>8. Compare documents</strong> <span class=\"note\">(NotebookLM)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp12\">Copy</button></figcaption><pre id=\"cp12\">Compare [source A] and [source B]: where do they agree, where do they differ, and what does each leave out? Present it as a table.</pre></figure>\n<h3>Campaign and advocacy</h3>\n<p><strong>9. Message house</strong> <span class=\"note\">(Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp13\">Copy</button></figcaption><pre id=\"cp13\">You are an advocacy strategist for a Nepali CSO working on [theme]. Create a message house for [issue] aimed at [audience]: 1 core message (max 15 words), 3 pillars, the evidence each needs, and a call to action. Use only facts I give; write [EVIDENCE NEEDED] otherwise. Then critique it from the audience's point of view. Facts: [paste]</pre></figure>\n<p><strong>10. Social media posts</strong> <span class=\"note\">(ChatGPT)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp14\">Copy</button></figcaption><pre id=\"cp14\">Write [3] Facebook posts in Nepali and English about [topic] for [audience]. Each under [60] words, hopeful tone, one clear action, no statistics unless I provide them. Suggest a visual for each that does not show any identifiable person.</pre></figure>\n<p><strong>11. Radio or video script</strong> <span class=\"note\">(ChatGPT)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp15\">Copy</button></figcaption><pre id=\"cp15\">Write a 60-second community radio script in simple Nepali on [issue] for [audience]. Two voices (a [role] and a [role]), a local everyday setting, one key message, and a clear call to action at the end.</pre></figure>\n<p><strong>12. Audience reaction test</strong> <span class=\"note\">(ChatGPT)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp16\">Copy</button></figcaption><pre id=\"cp16\">You are a [ward chair / parent / district official / journalist]. Read this message and tell me honestly what convinces you, what does not, and what you would ask. Message: [paste]</pre></figure>\n<h3>Fundraising and proposals</h3>\n<p><strong>13. Read the donor call</strong> <span class=\"note\">(NotebookLM)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp17\">Copy</button></figcaption><pre id=\"cp17\">From this call, list: objectives, eligibility, budget range, duration, deadline, required documents and scoring criteria, with citations. Then list what is unclear.</pre></figure>\n<p><strong>14. Problem tree, then Theory of Change</strong> <span class=\"note\">(Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp18\">Copy</button></figcaption><pre id=\"cp18\">Using only this evidence [paste], build a problem tree: core problem, direct causes, root causes, effects. Then turn it into a Theory of Change with if-then-because pathways and assumptions.</pre></figure>\n<p><strong>15. Logframe</strong> <span class=\"note\">(Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp19\">Copy</button></figcaption><pre id=\"cp19\">Draft a logframe table for this project: impact, outcomes, outputs, SMART indicators, baseline, target, means of verification, assumptions. Use only the data I gave; mark every unknown baseline or target as [TO CONFIRM]. Project summary: [paste]</pre></figure>\n<p><strong>16. Strict donor reviewer</strong> <span class=\"note\">(Claude)</span></p><figure class=\"prompt\"><figcaption><span>Prompt</span><button class=\"copy\" data-copy-id=\"cp20\">Copy</button></figcaption><pre id=\"cp20\">Act as a strict reviewer for [donor]. Score this draft from 1 to 5 against each criterion: [paste]. Quote the weak sentences, explain what is missing, and list the 5 questions the panel will ask. Draft: [paste]</pre></figure>\n<h3>Prompts that make any prompt better</h3>\n<ul><li>\"Before you answer, ask me up to 5 questions you need to do this well.\"</li><li>\"Give me 3 different options, and say which you would choose and why.\"</li><li>\"What are the weaknesses or risks in what you just wrote?\"</li><li>\"Which statements in your answer should I verify? Where?\"</li></ul>","group":"workbook"},{"id":"quiz","short":"Workbook","title":"Quiz, confidence rating and feedback","use":"Pre/post quiz (10 questions), confidence rating","html":"<p>The same 10-question quiz is taken at the start (pre) and at the end (post) of the day, online: scan the QR code or open the <a href=\"../assessment/index.html\">AI knowledge test</a> with the event code from the facilitator. The printed version is below for anyone without a phone.</p>\n<p>Participant code: ________ &nbsp; ☐ Pre &nbsp; ☐ Post</p>\n<h3>Quiz (10 questions)</h3>\n<ol><li>A chatbot without web search mainly works by:<ul><li>a) searching the internet live</li><li>b) looking up a verified database</li><li>c) predicting likely next words from patterns</li><li>d) copying from Wikipedia</li></ul></li><li>In AI, \"hallucination\" means:<ul><li>a) the AI stops working</li><li>b) confident output that is false or invented</li><li>c) the AI creates images</li><li>d) a slow internet connection</li></ul></li><li>Which part of R-C-T-F-C tells the AI the audience, place and purpose?<ul><li>a) Role</li><li>b) Task</li><li>c) Format</li><li>d) Context</li></ul></li><li>Which is safest to paste into a free AI tool?<ul><li>a) a public government policy document</li><li>b) a beneficiary list with phone numbers</li><li>c) a case file with only the name removed</li><li>d) the staff salary sheet</li></ul></li><li>Which tool answers only from documents you upload, with citations?<ul><li>a) ChatGPT</li><li>b) NotebookLM</li><li>c) Gboard</li><li>d) Claude</li></ul></li><li>AI gives you a statistic with a source link. You should:<ul><li>a) use it, because the link looks official</li><li>b) ask the AI \"are you sure?\"</li><li>c) open the source and confirm the figure is there</li><li>d) round the number and use it</li></ul></li><li>An AI-written proposal section reads very well. Before submitting, you should:<ul><li>a) submit it as it is</li><li>b) verify the facts, check the donor criteria, and rewrite it in your own voice</li><li>c) translate it into Nepali</li><li>d) ask AI to make it longer</li></ul></li><li>Which is an example of bias in AI output?<ul><li>a) a spelling mistake</li><li>b) a slow answer</li><li>c) always showing leaders as men and caregivers as women</li><li>d) an answer that is too long</li></ul></li><li>On an Android phone, you type Nepali by voice by:<ul><li>a) using the paid version of ChatGPT only</li><li>b) this is not possible</li><li>c) using the calculator app</li><li>d) using Gboard with Nepali added, then tapping the microphone</li></ul></li><li>Who is accountable for AI-assisted content that a CSO publishes?<ul><li>a) the staff member and the CSO</li><li>b) the AI company</li><li>c) the AI tool</li><li>d) the donor</li></ul></li></ol>\n<div class=\"ans\" data-ans=\"cso-quiz\"></div>\n<h3>Confidence rating</h3>\n<p>Rate each statement from 1 (not at all) to 5 (fully), before and after the day.</p>\n<div class=\"tbl\"><table><thead><tr><th>Statement</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td>I can explain what AI can and cannot do</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>I can type Nepali by voice on my phone</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>I can write a prompt that gives a useful first draft</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>I can use AI for reports, proposals and campaigns</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>I know when NOT to use AI, and how to keep data safe</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h3>End-of-day feedback</h3>\n<p>Send it online with the <a href=\"#feedback\">feedback form</a>.</p>","group":"workbook"},{"id":"uc","short":"Use case 1","title":"Child rights and education CSO (Loo Niva Child Concern Group)","use":"Profile and materials index","html":"<p>This use case adapts the workshop for a CSO that works on child rights, education, child participation, advocacy and child protection. It was built for Loo Niva Child Concern Group. The profile below comes from the organisation's website (<a href=\"https://www.loonivachild.org.np/\" target=\"_blank\" rel=\"noopener\">loonivachild.org.np</a>). <strong>All sample materials (M1–M11) are fictional.</strong></p>\n<h3>Profile</h3>\n<div class=\"tbl\"><table><thead><tr><th>Item</th><th>Details</th></tr></thead><tbody><tr><td>Organisation</td><td>Loo Niva Child Concern Group, Lalitpur Metropolitan City (Ward 25)</td></tr><tr><td>Thematic areas</td><td>Education, participation, advocacy, protection</td></tr><tr><td>Flagship campaign</td><td>Right to Education Campaign (Education Watch): monitors education laws at national and local level and holds stakeholders accountable</td></tr><tr><td>Target groups</td><td>Poor and marginalised children, scholarship students, parents, schools, teachers, child clubs, CSOs and local media</td></tr><tr><td>Typical activities</td><td>Parent orientations, teacher exposure visits, child clubs and a child magazine, scholarships, school matching funds, review meetings with CSOs and media</td></tr><tr><td>Working areas</td><td>Lalitpur Metropolitan City; Nawadurga and Bhageshwar Rural Municipalities; visits in Kathmandu and Kavrepalanchowk</td></tr><tr><td>Projects named on the website</td><td>ESP, REAP, CLEAP</td></tr><tr><td>Partners named on the website</td><td>Finn Church Aid, CESVI, Ministry for Foreign Affairs of Finland, Girls Not Brides, National Campaign for Education, NGO Federation of Nepal, Nabil Bank, among others</td></tr><tr><td>Themes added by the TOR</td><td>Climate justice, fundraising, proposal development</td></tr><tr><td>Main data risks</td><td>Children's names, photos and case details; scholarship and beneficiary lists; protection cases; parents' contact details; school-level performance data</td></tr></tbody></table></div>\n<h3>How to use this use case</h3>\n<ol><li>Print each material as a separate sheet with the header \"Fictional training material\".</li><li>Share digital copies through one link or QR code (this page), so participants can copy and paste.</li><li>Ask the CSO before the day whether any example should be swapped for a current project.</li><li>The facilitator keys (under M2, M4, M7, M9, M10 and M11) show only to the trainer's account.</li></ol>\n<h3>Materials index</h3>\n<div class=\"tbl\"><table><thead><tr><th>Code</th><th>Title</th><th>Session</th></tr></thead><tbody><tr><td><a href=\"#m1\">M1</a></td><td>Rough notes: quarterly review meeting with CSOs and local media</td><td>5 (A)</td></tr><tr><td><a href=\"#m2\">M2</a></td><td>Field activity notes: parent orientation and child clubs, one month</td><td>5 (B)</td></tr><tr><td><a href=\"#m3\">M3</a></td><td>English donor text: the learning-at-home approach</td><td>5 (C)</td></tr><tr><td><a href=\"#m4\">M4</a></td><td>Situation brief: school education in \"Sundarpur Rural Municipality\"</td><td>5 (D), 7</td></tr><tr><td><a href=\"#m5\">M5</a></td><td>Call for proposals: \"Himalayan Foundational Learning Fund\"</td><td>7</td></tr><tr><td><a href=\"#m6\">M6</a></td><td>Field evidence sheet: early-grade learning and dropout</td><td>7</td></tr><tr><td><a href=\"#m7\">M7</a></td><td>Weak draft concept note</td><td>7 (D5)</td></tr><tr><td><a href=\"#m8\">M8</a></td><td>Four campaign briefs</td><td>6</td></tr><tr><td><a href=\"#m9\">M9</a></td><td>Six weak prompt cards</td><td>4</td></tr><tr><td><a href=\"#m10\">M10</a></td><td>Eight scenario cards</td><td>8</td></tr><tr><td><a href=\"#m11\">M11</a></td><td>\"Brilliant and wrong\" AI output</td><td>2 (D1)</td></tr></tbody></table></div>","group":"usecase"},{"id":"m1","short":"M1","title":"Rough notes, quarterly review meeting with CSOs and local media","use":"Session 5, Station A (minutes)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 5, Station A (minutes). The notes are deliberately messy.</p>\n<figure class=\"prompt\"><figcaption><span>M1 notes</span><button class=\"copy\" data-copy-id=\"cp21\">Copy</button></figcaption><pre id=\"cp21\">Qtrly review mtg - CSOs + local media - Sundarpur RM hall - Mangsir 5 (?) 2083, ~11am\npresent: prog coordinator (chair), 2 field staff, ward 3 &amp; ward 5 edu focal persons, 3 journalists (Sundar FM, 1 online, 1 print), child club reps (2) with their teacher, women's group chair\n\n- prog coord update: parent orientation done in 4 of 6 wards. ward 2 &amp; 6 pending - road blocked by landslide, try again after road opens\n- journalists want monthly story ideas + case stories. child club teacher raised CONSENT issue. agreed: NO photos of children without parent consent, no names, no school name in sensitive stories\n- ward 5 edu focal person: free textbooks 3 wks late in 2 schools. somebody to write letter to RM education section - Sita? (field) - by next week??\n- school matching fund - 2 schools have not submitted documents. follow up (who?)\n- child magazine next issue - deadline \"before Tihar\"?? (already passed) -&gt; maybe end of Poush\n- Sundar FM offers to air a radio PSA on school enrolment FREE for 2 weeks in Baisakh. we draft script. ok by all\n- women's group: wants a separate orientation for fathers - fathers do not come. discuss with team\n- next mtg after 3 months, venue TBD\n- AOB: internet in RM hall very bad</pre></figure>","group":"usecase"},{"id":"m2","short":"M2","title":"Field activity notes, Kartik 2083","use":"Session 5, Station B (progress report)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 5, Station B (progress report). It contains one missing figure and one wrong calculation for participants to find.</p>\n<figure class=\"prompt\"><figcaption><span>M2 notes</span><button class=\"copy\" data-copy-id=\"cp22\">Copy</button></figcaption><pre id=\"cp22\">Monthly field notes - Sundarpur RM - Kartik 2083 - Learning at Home project\n\nParent orientation: target 6 sessions -&gt; done 4 (wards 1, 3, 4, 5)\n  participants 112 (women 81, men 31); target 150 participants\n  participation rate = 112/150 = 85%  &lt;- (as written by field staff)\nChild club meetings: 8 clubs, target 8 meetings -&gt; held 7 (ward 6 club no meeting, road)\n  children taking part 164 (girls 92, boys 72)\nChild magazine: 37 contributions received (target 40) - poems, drawings, 6 short stories\nTeacher coaching visits: target 10 -&gt; done ?? (notes with Ram, to check)\nScholarship students: 45 enrolled at start of year; 3 left this month\n  (2 moved with families for seasonal work, 1 - reason being followed up by protection focal person)\nChallenges: landslide blocked road to wards 2 and 6; textbook delay in 2 schools; fathers rarely attend\nNext month: 2 pending orientations, fathers' session (to discuss), radio PSA script</pre></figure>\n<div class=\"ans\" data-ans=\"cso-m2\"></div>","group":"usecase"},{"id":"m3","short":"M3","title":"English donor text for translation","use":"Session 5, Station C (translation)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 5, Station C (translation and back-translation).</p>\n<figure class=\"prompt\"><figcaption><span>M3 text</span><button class=\"copy\" data-copy-id=\"cp23\">Copy</button></figcaption><pre id=\"cp23\">Our learning-at-home approach strengthens foundational literacy and numeracy by engaging parents as active partners in their children's education. Through community-based monitoring, parents and child clubs track whether schools receive teachers, textbooks and grants on time, and raise gaps with duty-bearers at ward and municipal level. All activities follow our safeguarding policy: no child is photographed or named without informed consent from a parent or guardian. In the coming year, we will expand the approach to two remote wards, with a particular focus on girls, children with disabilities and families affected by seasonal migration.</pre></figure>\n<p><em>Hard terms to watch:</em> foundational literacy and numeracy, learning at home, community-based monitoring, duty-bearers, safeguarding, informed consent.</p>","group":"usecase"},{"id":"m4","short":"M4","title":"Situation brief, school education in Sundarpur Rural Municipality","use":"Session 5, Station D (NotebookLM) and Session 7","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 5, Station D (NotebookLM: add as \"Copied text\"), and Session 7.</p>\n<blockquote><p><strong>Sundarpur Rural Municipality: School Education Situation Brief, 2083</strong> (fictional)</p>\n<p><strong>1. Overview.</strong> Sundarpur Rural Municipality has 6 wards and 14 community schools (9 basic and 5 secondary). In 2083, 3,480 students were enrolled in grades 1–8, of whom 51% were girls. Two wards (2 and 6) are remote, with road access often cut during the monsoon.</p>\n<p><strong>2. Learning levels.</strong> A municipal early-grade reading check in Baisakh 2083 found that only about 40% of grade 3 students could read a grade-level Nepali text with understanding. Results ranged from 51% in ward 1 to 22% in ward 6. Numeracy was not assessed.</p>\n<p><strong>3. Dropout and attendance.</strong> The average dropout rate in grades 1–8 was 6.0%, but much higher in the remote wards.</p>\n<div class=\"tbl\"><table><thead><tr><th>Ward</th><th>Students (grades 1–8)</th><th>Dropout rate</th><th>Grade 3 reading at grade level</th></tr></thead><tbody><tr><td>1</td><td>820</td><td>3.1%</td><td>51%</td></tr><tr><td>2</td><td>410</td><td>10.4%</td><td>27%</td></tr><tr><td>3</td><td>690</td><td>4.8%</td><td>44%</td></tr><tr><td>4</td><td>560</td><td>5.0%</td><td>40%</td></tr><tr><td>5</td><td>640</td><td>5.5%</td><td>39%</td></tr><tr><td>6</td><td>360</td><td>12.2%</td><td>22%</td></tr></tbody></table></div>\n<p>School records give seasonal migration, early marriage, household work and distance as the main reasons for dropout. Attendance falls by about a quarter during the planting and harvest months.</p>\n<p><strong>4. Teachers and facilities.</strong> Nine approved teacher positions were vacant at the start of the year, 6 of them in wards 2 and 6. Five of the 14 schools have no separate toilet for girls. Only 4 schools have a functioning library corner.</p>\n<p><strong>5. Climate and disasters.</strong> In the 2082 monsoon, landslides and flooding closed 4 schools for an average of 11 school days. Teachers reported heat affecting concentration in classrooms with tin roofs during Jestha and Asar.</p>\n<p><strong>6. Textbooks and grants.</strong> Free textbooks reached 3 schools more than 3 weeks after the start of the session. Two schools did not receive their matching grant on time because documents were incomplete.</p>\n<p><strong>7. Parent and community engagement.</strong> School management committees met an average of 4 times in the year. Mothers attend school meetings far more often than fathers. Child clubs exist in 8 schools but are active in only 5.</p>\n<p><strong>8. Municipal response.</strong> The municipality's education plan aims to raise grade 3 reading to 60% within five years. It plans to add reading materials and train teachers, but has not yet allocated funds for wards 2 and 6 specifically.</p>\n<p><strong>9. Data gaps.</strong> There is no reliable data on children with disabilities, out-of-school children who never enrolled, or children's numeracy levels.</p></blockquote>\n<div class=\"ans\" data-ans=\"cso-m4\"></div>","group":"usecase"},{"id":"m5","short":"M5","title":"Call for concept notes, Himalayan Foundational Learning Fund","use":"Session 7 (NotebookLM; Ex 6)","html":"<p class=\"note\"><strong>Fictional training material.</strong> The donor, the municipality and all figures are invented.</p><p>Used in: Session 7 (add to NotebookLM; Ex 6).</p>\n<blockquote><p><strong>Himalayan Foundational Learning Fund (HFLF): Call for Concept Notes 2083/84</strong> (fictional)</p>\n<p><strong>1. Purpose.</strong> HFLF supports Nepali organisations to improve foundational literacy and numeracy for children in grades 1–3 in remote rural municipalities.</p>\n<p><strong>2. Priority groups.</strong> Girls, children with disabilities, and children from families affected by seasonal migration.</p>\n<p><strong>3. Eligibility</strong></p>\n<ul><li>Nepali NGO registered for at least 5 years and affiliated with the Social Welfare Council.</li><li>Audited accounts for the last 3 years.</li><li>At least 3 years of experience in school education or child rights.</li><li>A letter of support from the rural or urban municipality where the project will run.</li></ul>\n<p><strong>4. Grant size and duration.</strong> NPR 40–60 lakh for 24 months. Applicants must contribute at least 10% co-funding (cash or in kind).</p>\n<p><strong>5. What to submit.</strong> A concept note of no more than 4 pages, a one-page budget summary, and a logframe summary.</p>\n<p><strong>6. Scoring criteria (100 points)</strong></p>\n<div class=\"tbl\"><table><thead><tr><th>Criterion</th><th>Points</th></tr></thead><tbody><tr><td>Relevance and evidence of need (with referenced data)</td><td>25</td></tr><tr><td>Approach and innovation</td><td>20</td></tr><tr><td>Feasibility, realistic targets and M&amp;E</td><td>20</td></tr><tr><td>Gender equality and social inclusion</td><td>15</td></tr><tr><td>Partnership with local government and sustainability</td><td>15</td></tr><tr><td>Value for money</td><td>5</td></tr></tbody></table></div>\n<p><strong>7. Deadline.</strong> Concept notes by 30 Poush 2083, through the HFLF online portal.</p>\n<p><strong>8. Use of digital tools.</strong> Applicants may use digital tools, including AI, to prepare applications. They remain fully responsible for accuracy and originality. All statistics must be referenced.</p></blockquote>","group":"usecase"},{"id":"m6","short":"M6","title":"Field evidence sheet, early-grade learning and dropout","use":"Session 7 (problem tree, ToC, logframe)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 7 (problem tree, Theory of Change, logframe, concept note).</p>\n<p><strong>Data (from M4 and our project records)</strong></p>\n<ul><li>Grade 3 students reading at grade level: about 40% municipality-wide; 27% in ward 2; 22% in ward 6 (municipal reading check, Baisakh 2083).</li><li>Dropout, grades 1–8: 6.0% overall; 10.4% in ward 2; 12.2% in ward 6.</li><li>Nine vacant teacher positions, 6 of them in wards 2 and 6.</li><li>Only 4 of 14 schools have a library corner. Five have no separate girls' toilet.</li><li>Four schools closed for an average of 11 days in the 2082 monsoon.</li><li>No data on numeracy or on children with disabilities.</li></ul>\n<p><strong>What we observed in the field (anonymised)</strong></p>\n<ul><li>\"My daughter is in grade 3 but cannot read the textbook. I cannot help because I did not go to school.\" (a mother, ward 6)</li><li>\"Many families go to India for work after the harvest, and the children go with them for months.\" (a head teacher, ward 2)</li><li>\"We have one teacher for two classes, so the small children just copy from the board.\" (a teacher, ward 6)</li><li>Fathers rarely attend school meetings or orientations.</li><li>Child clubs that are active bring out-of-school children back to school through home visits.</li></ul>\n<p><strong>Our assets and experience</strong></p>\n<ul><li>Parent orientation model (6 modules), already run in 4 wards.</li><li>8 child clubs, 5 of them active, plus a child magazine.</li><li>Working relationship with the municipality's education section and school management committees.</li><li>Experience with school matching funds and scholarships.</li><li>Community radio partner (Sundar FM).</li></ul>","group":"usecase"},{"id":"m7","short":"M7","title":"Weak draft concept note","use":"Session 7, Demo D5 and Ex 6 (c)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 7, Demo D5 and Ex 6 (c). Participants ask Claude to review it as a strict donor reviewer, then improve it.</p>\n<figure class=\"prompt\"><figcaption><span>M7 draft</span><button class=\"copy\" data-copy-id=\"cp24\">Copy</button></figcaption><pre id=\"cp24\">Concept Note: Quality Education for All Children of Sundarpur (draft)\n\nBackground. Education is the backbone of development. According to UNESCO, 75% of children in Sundarpur Rural Municipality cannot read. Nepal has made great progress in education, but many challenges remain. Our organisation has long experience and is committed to the rights of every child.\n\nObjective. To ensure quality education for all children of Sundarpur.\n\nActivities.\n1. Conduct various awareness programmes in the community.\n2. Organise trainings for teachers and parents.\n3. Distribute books and stationery.\n4. Work with stakeholders for better education.\n\nExpected results. Within one year, 100% of children will read fluently and dropout will become zero. The community will be aware about the importance of education.\n\nTarget group. All children, parents and teachers of the municipality.\n\nBudget. NPR 1 crore for 12 months.\n\nMonitoring. Regular monitoring will be done by the team.</pre></figure>\n<div class=\"ans\" data-ans=\"cso-m7\"></div>","group":"usecase"},{"id":"m8","short":"M8","title":"Four campaign briefs","use":"Session 6, Ex 5 (one brief per group)","html":"<p class=\"note\"><strong>Fictional training material.</strong> \"Sundarpur Rural Municipality\" and all names and figures are invented.</p><p>Used in: Session 6, Ex 5. One brief per group.</p>\n<div class=\"tbl\"><table><thead><tr><th>Brief</th><th>Issue</th><th>Primary audience</th><th>Change we want</th><th>Facts to use (from M4)</th></tr></thead><tbody><tr><td>1. Right to Education Watch</td><td>Late textbooks and vacant teacher posts in remote wards</td><td>Ward chairs and the municipal education committee</td><td>All vacant posts filled and textbooks delivered before the next academic session</td><td>9 vacant posts, 6 in wards 2 and 6; textbooks more than 3 weeks late in 3 schools</td></tr><tr><td>2. Keep girls in school, end child marriage</td><td>Early marriage is one of the reasons girls drop out</td><td>Parents, community and religious leaders</td><td>Families commit to keeping girls in school; leaders speak out publicly</td><td>School records name early marriage as a dropout reason; Nepal's legal minimum age for marriage is 20</td></tr><tr><td>3. Climate-safe schools</td><td>Landslides, floods and heat interrupt learning</td><td>Municipal disaster management committee, with child clubs as messengers</td><td>A school safety plan and budget for climate-resilient classrooms</td><td>4 schools closed for 11 days on average in the 2082 monsoon; heat in tin-roof classrooms</td></tr><tr><td>4. Children's voices count</td><td>Child clubs inactive; the child magazine lacks contributions</td><td>Children, teachers and school management committees</td><td>Revive the 3 inactive clubs; get 60 contributions for the next magazine</td><td>8 clubs, only 5 active; 37 contributions last month</td></tr></tbody></table></div>","group":"usecase"},{"id":"m9","short":"M9","title":"Six weak prompt cards","use":"Session 4, Ex 3 (one card per pair)","html":"<p>Used in: Session 4, Ex 3. Cut them into cards, one per pair.</p>\n<ol><li>\"Write a call for child magazine submissions.\"</li><li>\"Write a thank-you letter to our donor.\"</li><li>\"Make a report of the teacher exposure visit.\"</li><li>\"Write a Facebook post about the right to education.\"</li><li>\"Write an SMS reminder for parents about the meeting.\"</li><li>\"Summarise this education policy.\"</li></ol>\n<div class=\"ans\" data-ans=\"cso-m9\"></div>","group":"usecase"},{"id":"m10","short":"M10","title":"Eight scenario cards","use":"Session 8, Ex 7 (green, amber or red)","html":"<p>Used in: Session 8, Ex 7. Read each card aloud. Participants raise green, amber or red.</p>\n<ol><li>A field officer pastes a child's protection case file into a free chatbot to draft a referral letter.</li><li>The communication officer uses ChatGPT to draft Facebook posts for the school enrolment campaign.</li><li>The team uses a ChatGPT-generated illustration, clearly not a real child and labelled \"AI illustration\", on a campaign poster.</li><li>A programme officer uploads the public national school education plan to NotebookLM to summarise it.</li><li>A staff member uploads the scholarship list (names, schools, family income) to Claude to analyse dropout risk.</li><li>The M&amp;E officer uses Claude to draft the donor report from aggregated figures with no names.</li><li>A field officer uses ChatGPT to translate a parent meeting invitation into simple Nepali.</li><li>A tired team submits an AI-written concept note after only a quick read, because the deadline is tonight.</li></ol>\n<div class=\"ans\" data-ans=\"cso-m10\"></div>","group":"usecase"},{"id":"m11","short":"M11","title":"\"Brilliant and wrong\" AI output","use":"Session 2, Demo D1","html":"<p>Used in: Session 2, Demo D1. Print with the banner. <strong>AI-generated example containing false information
