}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;

* { box-sizing: border-box }
html { height: 100% } body { min-height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6 }
button { font: inherit; color: inherit; cursor: pointer }
a { color: var(--navy) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 16px }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--accent); white-space: nowrap }
.brand span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.search { margin-left: auto; position: relative; flex: 0 1 320px; min-width: 0 }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 15px }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, 92vw); max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 30px rgba(10,20,40,.18); padding: 6px }
.results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink) }
.results a:hover, .results a:focus { background: var(--soft) }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4 }
.home-link { white-space: nowrap; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--navy) }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 15px }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 56px) }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto }
.nav-links { display: grid; gap: 2px; margin-bottom: 14px }
.nav-links a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 8px; font-weight: 500 }
.nav-links a[aria-current="page"] { background: var(--soft); color: var(--navy) }
.day-h { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px }
.day-h b { color: var(--ink); font-size: 14px; letter-spacing: 0 }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.tl a { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; line-height: 1.35 }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; padding-top: 2px }
.tl a:hover { background: var(--soft) }
.tl a[aria-current="page"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy) }
.chip { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; align-self: center }
.chip.done { background: var(--ok-bg); color: var(--ok) }

main { min-width: 0; padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 48px) }
.wrap { max-width: 880px; margin-inline: auto }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4.2vw, 42px); line-height: 1.2; margin: 4px 0 10px; text-wrap: balance }
.meta { color: var(--muted); margin: 0 0 18px }
.prose h2 { font-size: 23px; margin: 28px 0 10px; color: var(--navy) }
.prose h3 { font-size: 19px; margin: 22px 0 8px; color: var(--navy) }
.prose p { margin: 8px 0 }
.prose ul, .prose ol { padding-left: 1.4em; margin: 8px 0 }
.prose li { margin: 4px 0 }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }
th { background: var(--soft); text-align: left; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
.box { border-radius: var(--r); padding: 12px 16px; margin: 14px 0; border-left: 4px solid var(--navy); background: var(--soft) }
.box.warn { background: var(--warn-bg); border-left-color: var(--warn-line) }
.box.trainer { background: var(--ok-bg); border-left-color: var(--ok) }
.box-t { font-weight: 700; margin: 0 0 4px }
.prompt { margin: 14px 0; border-radius: var(--r); background: var(--prompt-bg); border: 1px solid var(--prompt-line); overflow: hidden }
.prompt figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 700; color: var(--prompt-ink); border-bottom: 1px dashed var(--prompt-line) }
.prompt pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; font-family: var(--f-body); font-size: 15.5px; color: var(--prompt-ink); line-height: 1.6 }
.copy, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px }
.copy { border-color: var(--prompt-line) }
.btn.primary { background: var(--navy); color: var(--surface); border-color: var(--navy) }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 18px }
.toggle-done[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok) }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap }
.pager a { text-decoration: none; font-weight: 600 }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 }
.card-grid .card { margin: 0; text-decoration: none; color: var(--ink) }
.card-grid .card:hover { border-color: var(--navy) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin: 12px 0 }
.fb-q { margin: 14px 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.fb-scale { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.fb-scale label { border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer }
.fb-scale input { margin-right: 6px }
.f { display: grid; gap: 4px; margin: 12px 0; font-weight: 600; font-size: 15px }
.f input, .f textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink) }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 50 }

@media (max-width: 900px) {
  .menu-btn { display: inline-block }
  .shell { grid-template-columns: 1fr }
  .side { position: fixed; inset: 56px auto 0 0; width: min(310px, 86vw); height: auto; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: none }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35) }
}
@media print {
  .top, .side, .actions, .pager, .copy, .toast { display: none !important }
  .shell { display: block }
  main { padding: 0 }
  body { background: #fff; color: #000 }
  .prompt { break-inside: avoid }
}

(function () {
"use strict";

  set(k, v) { try { localStorage.setItem("ai-judiciary-" + k, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get("done", []));

let _pid = 0;
function promptBox(label, text) {
  const id = "cp" + (++_pid);
  return `<figure class="prompt"><figcaption><span>${esc(label)}</span><button type="button" class="copy" data-copy-id="${id}">Copy</button></figcaption><pre id="${id}">${esc(text)}</pre></figure>`;
}

const ol = items => `<ol>${items.map(x => `<li>${x}</li>`).join("")}</ol>`;

const SC_POLICY = "https://kathmandupost.com/national/2026/07/03/nepal-s-courts-embrace-ai-keep-judgment-writing-human";
const INDIA_REF = "https://www.ictworks.org/how-5-judicial-ai-solutions-are-proving-skeptics-wrong-in-india/";

/* ---------- Shared content ---------- */
const TOOLS = [
  ["a. Legal research", "Gemini, or Perplexity", "Gemini's web-grounded answers work well under one login; Perplexity's free tier always shows its source links, so an officer can verify a claim before trusting it — valuable given AI's tendency to cite \"incorrect or even non-existent laws.\""],
  ["b. Analysis &amp; summary of a Likhat", "Google NotebookLM", "Answers only from the document you upload, not from general training data — the single most important safeguard for legal accuracy. Handles Nepali/Devanagari text."],
  ["c. Translation of a Likhat", "Google Translate (compare with DeepL)", "The most mature Nepali-language support of the free tools, free and unlimited, handles full documents. DeepL also supports Nepali and is worth a side-by-side comparison — pair either with bilingual human review for legal terms."],

const VOCAB = [
  ["Prompt", "the instruction or question you type or say to the AI."],
  ["Context", "the background you give it (facts, a document, earlier messages); more relevant context usually means a better answer."],
  ["Follow-up", "a second message that refines or narrows the first answer, rather than starting over."],
  ["Hallucination", "when an AI states something confidently that is false or doesn't exist, including a law or case citation. This is why verification matters."],
  ["Grounding / source", "an answer tied to a specific document or a cited source, as opposed to the model's general training. Grounded answers (like NotebookLM's) are safer for factual work."]

  "<strong>AI drafts, summarises, translates and organises — it never decides.</strong> Nothing produced today should go into a judgment, a writ petition, or any output requiring judicial discretion or legal reasoning. This mirrors Nepal's own Supreme Court AI policy adopted 3 July 2026.",

function vHome() {
  const meta = [ORG, PLACE, DATES].filter(Boolean).join(" · ");
  const agendaRows = SESSIONS.map(m => `<tr><td>${esc(m.time)}</td><td>${m.mins}</td><td><a href="#${m.id}">${m.n}. ${esc(m.title)}</a></td></tr>`).join("");
  return `<div class="wrap prose">
    <p class="eyebrow">Short Training Packages · AI in Judiciary</p>
    <h1>AI in Judiciary: Using Free AI Tools Inside the Supreme Court's AI Policy</h1>
    <p class="meta">2-hour hands-on session for judges and senior officers of Nepal's district and high courts.${meta ? "<br>" + esc(meta) : ""}</p>
    <div class="box"><p class="box-t">Session goal</p><p>Participants see two live case studies, practise one task in a small group on fictional case papers, and leave knowing which free tool fits which court task — and what AI must never do.</p></div>
    <h2>The frame: Nepal's Supreme Court AI policy</h2>
    <p>On 3 July 2026 the Supreme Court permitted AI for legal research, document management and case organisation, drafting of non-decisional documents and administrative support, and prohibited AI from writing judgments, drafting writ petitions, or any task requiring judicial discretion (<a href="${SC_POLICY}" target="_blank" rel="noopener">source</a>). Everything in this session stays inside the permitted zone.</p>
    <h2>Learning outcomes</h2>
    <ol>
      <li>Type Nepali by voice with Gboard, and use five words of prompt vocabulary and the Role/Task/Context/Format framework.</li>
      <li>Use a web-grounded tool (Gemini, Perplexity) for legal research, and verify its sources.</li>
      <li>Summarise a Likhat with a document-grounded tool (NotebookLM) and explain why grounding matters.</li>
      <li>Compare machine translations (Google Translate, DeepL) and flag legal terms for human review.</li>
      <li>Draft a Bahas outline, a Bayan structure or a Likhat skeleton, and supply the legal substance yourself.</li>
      <li>Organise a case backlog into a tracker with a prioritisation rule.</li>
      <li>Apply the guardrails: AI assists, never decides; always verify; never paste real case material into free tools.</li>
    </ol>
    <h2>Agenda (11:00–13:00)</h2>
    <div class="tbl"><table><thead><tr><th>Time</th><th>Min</th><th>Segment</th></tr></thead><tbody>${agendaRows}</tbody></table></div>
    <h2>Tools</h2>
    <p>Free tools only. One Google account covers <strong>Gemini</strong>, <strong>NotebookLM</strong> and <strong>Google Translate</strong>; ChatGPT, Perplexity and DeepL are demonstrated as "also worth knowing". Your table's device is already signed in — you don't need your own account today.</p>
    <div class="box warn"><p class="box-t">All case papers are fictional</p><p>Every name, party, case number, date and figure in the sample case papers (M1–M5) is invented for this training. Never substitute real, under-adjudication case material.</p></div>
    ${isTrainer() ? `<div class="box trainer"><p class="box-t">Facilitator notes (visible to trainer only)</p><p>Each segment page has a Facilitator note. The <a href="#prep">facilitator checklist</a> covers the two weeks before, the week before and the day itself.</p></div>` : ""}
    <div class="actions">
      <a class="btn primary" href="#s1">Start →</a>
      <a class="btn" href="#handout">Printable handout</a>
    </div>
  </div>`;
}

function vSession(m) {
  const prev = m.n > 1 ? SESSIONS[m.n - 2] : null;
  const next = m.n < SESSIONS.length ? SESSIONS[m.n] : null;
  return `<div class="wrap prose">
    <p class="eyebrow">Segment ${m.n} of ${SESSIONS.length} · ${esc(m.time)} (${m.mins} min)</p>
    <h1>${esc(m.title)}</h1>
    <div class="actions">
      <button type="button" class="btn toggle-done" data-sess="${m.id}" aria-pressed="${done.has(m.id)}">${done.has(m.id) ? "✓ Done" : "Mark as done"}</button>
    </div>
    <div class="box"><p class="box-t">What happens</p><ul>${m.whatToDo.map(x => `<li>${x}</li>`).join("")}</ul></div>
    ${m.body}
    ${isTrainer() ? `<div class="box trainer"><p class="box-t">Facilitator note (trainer only)</p><p>${esc(m.trainerNote)}</p></div>` : ""}
    <div class="pager">
      ${prev ? `<a href="#${prev.id}">← ${prev.n}. ${esc(prev.title)}</a>` : `<a href="#home">← Overview</a>`}
      ${next ? `<a href="#${next.id}">${next.n}. ${esc(next.title)} →</a>` : `<a href="#feedback">Feedback form →</a>`}
    </div>
  </div>`;
}

function vExercise(x) {
  const prev = x.n > 1 ? EXERCISES[x.n - 2] : null;
  const next = x.n < EXERCISES.length ? EXERCISES[x.n] : null;
  return `<div class="wrap prose">
    <p class="eyebrow">Exercise ${x.n} · Group ${x.group} · Tool: ${esc(x.tool)}</p>
    <h1>${esc(x.title)}</h1>
    <h2>Steps</h2>${ol(x.steps)}
    ${x.prompts.map(([l, t]) => promptBox(l, t)).join("")}
    <div class="box"><p class="box-t">Report back (about 3 minutes)</p><p>${esc(x.report)}</p></div>
    <p class="meta">Tip: always end with a follow-up like "What should I double-check before relying on this?"</p>
    <div class="pager">
      ${prev ? `<a href="#${prev.id}">← Exercise ${prev.n}</a>` : `<a href="#s6">← Group work</a>`}
      ${next ? `<a href="#${next.id}">Exercise ${next.n} →</a>` : `<a href="#c1">Sample case papers →</a>`}
    </div>
  </div>`;
}

function vCase(c) {
  const i = CASES.indexOf(c), prev = CASES[i - 1], next = CASES[i + 1];
  return `<div class="wrap prose">
    <p class="eyebrow">Sample case papers · ${c.code} · Fictional, for training only</p>
    <h1>${esc(c.title)}</h1>
    <p class="meta">Case No. 081-CI-0456, District Court, Kailashpur (fictional): boundary dispute over Kitta No. 142, Ward 3, Gaunthali Rural Municipality.</p>
    ${c.text ? promptBox(c.code + " (Nepali)", c.text) + `<div class="box"><p class="box-t">English gloss</p><p>${esc(c.gloss)}</p></div>` : c.html + (c.copy ? promptBox(c.code + " (copy as text)", c.copy) : "")}
    <div class="pager">
      ${prev ? `<a href="#${prev.id}">← ${prev.code}</a>` : `<a href="#s6">← Group work</a>`}
      ${next ? `<a href="#${next.id}">${next.code} →</a>` : `<a href="#handout">Printable handout →</a>`}
    </div>
  </div>`;
}

function vHandout() {
  return `<div class="wrap prose">
    <p class="eyebrow">Quick reference · Print / PDF</p>
    <h1>AI in Judiciary: Take-home Handout</h1>
    <div class="actions"><button type="button" class="btn primary" data-print>🖨 Print / Save as PDF</button></div>
    <h2>1. Which free tool for which task</h2>
    ${table(["Task", "Best free tool"], TOOLS.map(r => [r[0], r[1]]))}
    <h2>2. Prompt vocabulary</h2>
    ${ul(VOCAB.map(([w, d]) => `<strong>${w}</strong> — ${d}`))}
    <p><strong>Role, Task, Context, Format:</strong> "You are [role]. [Task], using [context]. Answer in [format]."</p>
    <p><em>Example:</em> "${esc(RTCF_EXAMPLE)}"</p>
    <h2>3. Prompt library</h2>
    ${table(["Task", "Prompt starter"], PROMPTS.map(([t, p]) => [`<strong>${t}</strong>`, "\"" + esc(p) + "\""]))}
    <h2>4. Nepali voice typing (Gboard, Android)</h2>${ol(GBOARD_ANDROID)}
    <h2>5. Guardrails</h2>${ul(GUARDRAILS)}
    <div class="box warn"><p class="box-t">Data-privacy rule</p><p>Never paste a real, under-adjudication case file or a real litigant's personal data into a free/public AI tool. AI assists — research, summary, translation, drafting support, organisation — and never decides; nothing it produces belongs in a judgment, a writ petition, or anything requiring judicial discretion.</p></div>
  </div>`;
}

function vPrep() {
  if (!isTrainer()) return vHome();
  return `<div class="wrap prose">
    <p class="eyebrow">Facilitator only</p>
    <h1>Facilitator preparation checklist</h1>
    <h2>Two weeks before</h2>${ul([
      "Confirm with the National Judiciary Academy and the venue on projector/screen and tested wifi; arrange a mobile-hotspot backup — the session depends on connectivity.",
      "Print or load the sample case papers (M1–M5) onto each group's device.",
      "Draft the one-page task cards for each of the 5 groups."
    ])}
    <h2>One week before</h2>${ul([
      "Create and test one free account per tool (a Google account for Gemini/NotebookLM/Translate; separate ChatGPT, Perplexity and DeepL accounts) and run each sample document through each tool once.",
      "Pre-log-in one device per group — account-creation friction is the most common way a hands-on segment overruns.",
      "Prepare a backup: screenshots or a 1–2 minute screen recording of each demo's expected output, in case venue internet fails.",
      "Print the free-tool matrix (the handout) for every participant.",
      "Coordinate with the National Judiciary Academy on the final participant list and any opening remarks or protocol."
    ])}
    <div class="box warn"><p class="box-t">Data-privacy note — say this explicitly</p><p>Free consumer AI tools are not confidential by default. Every sample document in the demo and in group work must be constructed or fully anonymised — state this to the room as a standing rule.</p></div>
    <h2>Day of</h2>${ul([
      "Arrive early to re-test venue wifi and re-log-in every device.",
      "Brief a co-facilitator or IT support person to circulate during the 30-minute group-work block.",
      "Have the printed group-assignment list and table cards ready.",
      "Share this page's QR code so participants can submit the feedback form."
    ])}
  </div>`;
}

function vFeedback() {
  const code = EV_CODE || new URLSearchParams(location.search).get("event") || "";
  return `<div class="wrap prose">
    <p class="eyebrow">Closing</p>
    <h1>Session Feedback</h1>
    <p class="meta">Anonymous and takes 1 minute. Rate each statement from 1 (strongly disagree) to 5 (strongly agree).</p>
    <form id="fbForm">
      <label class="f">Event code<input id="fbCode" value="${esc(code)}" required placeholder="e.g. AIJUD001"></label>
      ${FB_QS.map((q, i) => `<div class="fb-q"><div><strong>${i + 1}.</strong> ${esc(q)}</div><div class="fb-scale">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="r${i}" value="${n}" required>${n}</label>`).join("")}</div></div>`).join("")}
      <label class="f">Which exercise was most useful to your day-to-day work?<input id="fbBest" placeholder="e.g. Exercise 2, Likhat summary"></label>
      <label class="f">What would you want more time on, in a future session?<textarea id="fbImp" rows="2"></textarea></label>
      <label class="f">Which free tool are you most likely to try again on your own?<textarea id="fbFirst" rows="2"></textarea></label>
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input type="checkbox" id="fbRec" checked> I would recommend this session to colleagues.</label>
      <button type="submit" class="btn primary" id="fbSend">Submit feedback</button>
      <p id="fbMsg" class="meta" style="margin-top:10px"></p>
    </form>
  </div>`;
}

function gateView() {
  const signedIn = !!(window.WS && WS.session);
  const nextUrl = "../login.html?next=" + encodeURIComponent(location.pathname + location.search + location.hash);
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">Private materials</p><h1>${signedIn ? "You are not registered for this training" : "Sign in to see the materials"}</h1>
  <p class="meta">${signedIn
    ? "These materials are open only to participants registered for this training. If your registration is still waiting for approval, or you are in another training, contact the trainer."
    : "These materials are private for now. Participants registered for this training can sign in to see them."}</p>
  ${signedIn ? "" : `<p class="actions"><a class="btn primary" href="${nextUrl}">Sign in</a> <a class="btn" href="/workshop/login.html#signup">Register</a></p>`}</div>`;
}

function route() {
  if (!MATERIALS_OK) { $("#view").innerHTML = gateView(); renderSide("home"); return; }
  const id = (location.hash || "#home").slice(1) || "home";
  let html, cur = id;
  if (S_MAP[id]) html = vSession(S_MAP[id]);
  else if (E_MAP[id]) html = vExercise(E_MAP[id]);
  else if (C_MAP[id]) html = vCase(C_MAP[id]);
  else if (id === "prep" && isTrainer()) html = vPrep();
  else if (id === "handout") html = vHandout();
  else if (id === "feedback") html = vFeedback();
  else { html = vHome(); cur = "home"; }
  $("#view").innerHTML = html;
  renderSide(cur);
  closeSide();
  window.scrollTo({ top: 0 });
  if (window.TeachBar && TeachBar.on) {
    TeachBar.mount({
      days: [{ label: "2-hour session", items: SESSIONS.map(m => ({ id: m.id, kind: "session", start: m.time.split("–")[0], title: m.title })) }],
      titleOf: it => S_MAP[it.id].n + ". " + S_MAP[it.id].title,
      num: it => S_MAP[it.id].n,
      lead: [["home", "Overview"]],
      tail: EXERCISES.map(x => [x.id, "Ex " + x.n]).concat(CASES.map(c => [c.id, c.code]), [["handout", "Handout"], ["feedback", "Feedback"]])
    });
    TeachBar.update(cur);
  }
}

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { toast("Select and copy the text manually"); }
}

document.addEventListener("click", e => {
  const c = e.target.closest(".copy");
  if (c) { const pre = document.getElementById(c.dataset.copyId); if (pre) copyText(pre.textContent); return; }
  const t = e.target.closest(".toggle-done");
  if (t) { const id = t.dataset.sess; done.has(id) ? done.delete(id) : done.add(id); store.set("done", [...done]); const y = scrollY; route(); scrollTo(0, y); return; }
  if (e.target.closest("[data-print]")) { window.print(); return; }
  if (e.target.closest("[data-retry]")) { start(); return; }
  if (!e.target.closest(".search")) $("#results").hidden = true;
});

document.addEventListener("submit", async e => {
  if (e.target.id !== "fbForm") return;
  e.preventDefault();
  const msg = $("#fbMsg"), btn = $("#fbSend");
  const code = $("#fbCode").value.trim().toUpperCase();
  const ratings = FB_QS.map((_, i) => Number((document.querySelector('input[name="r' + i + '"]:checked') || {}).value || 0));
  if (!code || ratings.some(x => x < 1)) { msg.textContent = "Please enter the event code and rate all 6 items."; return; }
  btn.disabled = true; msg.textContent = "Submitting…";
  const r = await WS.submitFeedback({
    event_code: code, ratings: ratings,
    best_session: $("#fbBest").value.trim(),
    improve: $("#fbImp").value.trim(),
    first_ai_use: $("#fbFirst").value.trim(),
    recommend: $("#fbRec").checked
  });
  btn.disabled = false;
  if (r.error) { msg.textContent = "Could not submit: " + r.error.message; return; }
  msg.textContent = "Thank you! Your feedback has been recorded.";
  e.target.reset(); $("#fbCode").value = code;
});

/* Search */
const strip = s => String(s || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
const INDEX = SESSIONS.map(m => ({ id: m.id, title: m.n + ". " + m.title, text: strip(m.whatToDo.join(" ") + " " + m.body) }))
  .concat(EXERCISES.map(x => ({ id: x.id, title: "Exercise " + x.n + ". " + x.title, text: strip(x.steps.join(" ") + " " + x.tool + " " + x.prompts.map(p => p[1]).join(" ")) })))
  .concat(CASES.map(c => ({ id: c.id, title: c.code + ". " + c.title, text: strip((c.text || "") + " " + (c.gloss || "") + " " + (c.html || "")) })));
INDEX.push({ id: "handout", title: "Printable handout", text: "tool matrix prompt library vocabulary Gboard voice typing guardrails privacy" });
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = $("#results");
  if (q.length < 2) { box.hidden = true; return; }
  const hits = INDEX.filter(it => it.title.toLowerCase().includes(q) || it.text.toLowerCase().includes(q));
  box.innerHTML = hits.length ? hits.map(h => `<a href="#${h.id}"><b>${esc(h.title)}</b></a>`).join("") : '<p style="padding:8px 10px;margin:0;color:var(--muted)">Nothing found.</p>';
  box.hidden = false;
});
$("#results").addEventListener("click", e => { if (e.target.closest("a")) { $("#results").hidden = true; $("#q").value = ""; } });

function closeSide() { $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").addEventListener("click", () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
window.addEventListener("hashchange", route);

async function applyEvent() {
  const ev = await EVI.resolve(COURSE);
  if (!ev) return;
  const info = EVI.info(ev);
  ORG = info.org; PLACE = info.place; EV_NAME = info.name; EV_CODE = ev.code || "";
  DATES = EVI.enRange((info.iso || []).map(d => String(d).slice(0, 10)));
  $("#brandSub").textContent = "AI in Judiciary" + (ORG ? " · " + ORG : "") + (DATES ? " · " + DATES : "");
  document.title = (EV_NAME || "AI in Judiciary") + " · AI for ALL";
}

const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
let HOME = null;
async function start() {
  $("#view").innerHTML = '<div class="wrap"><p class="eyebrow" style="margin-top:20px">Loading…</p></div>';
  let ok;
  try {
    await withTimeout(WS.init(), 7000);
    ok = isTrainer() || (await withTimeout(WS.materialsAccess(new URLSearchParams(location.search).get("event")), 7000));
  } catch (e) { ok = e && e.message === "timeout" ? null : false; }
  if (ok === null) {
    $("#view").innerHTML = '<div class="wrap" style="padding-top:20px"><p class="eyebrow">Slow connection</p><h1>The materials could not load</h1><p class="meta">Check the internet and try again.</p><p><button class="btn primary" data-retry>Try again</button></p></div>';
    renderSide("home"); return;
  }
  MATERIALS_OK = ok;
  route();
  if (window.EVI && !HOME) EVI.home().then(h => { HOME = Object.assign({}, h, { label: /admin/.test(h.href) ? "Trainer console" : "Home" }); EVI.mountHome(HOME); }).catch(() => {});
  try { await withTimeout(applyEvent(), 7000); const y = scrollY; route(); scrollTo(0, y); } catch (e) {}
}
start();
})();
</script>
</body>
</html>
