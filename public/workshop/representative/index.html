<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>जनप्रतिनिधिका लागि AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&family=Rozha+One&display=swap">
<style>
/* Layout: a two-day running order on the left (the spine of the event), the selected session's handbook pages on the right; phones get the order as a drawer. */
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #142440; --muted: #556275; --line: #D6DDE6;
  --accent: #B3123A; --accent-ink: #FFFFFF; --navy: #1C3A66; --soft: #E6ECF4;
  --prompt-bg: #FFF5DC; --prompt-line: #C98A0B; --prompt-ink: #3B2E10;
  --warn-bg: #FBE8EC; --warn-line: #B3123A; --doc-bg: #F6F7F9; --ok: #237A52; --ok-bg: #E2F2EA;
  --now-bg: #FBE3E9;
  --f-body: 'Mukta', 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', system-ui, sans-serif;
  --f-display: 'Rozha One', 'Mukta', 'Noto Serif Devanagari', Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer }
a { color: var(--navy) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--accent); white-space: nowrap }
.brand span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.search { margin-left: auto; position: relative; flex: 0 1 340px; min-width: 0 }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 15px }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 30px rgba(10,20,40,.18); padding: 6px }
.results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink) }
.results a:hover, .results a:focus { background: var(--soft) }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4 }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 15px }

.shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100% - 56px) }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto }
.nav-links { display: grid; gap: 2px; margin-bottom: 14px }
.nav-links a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 8px; font-weight: 500 }
.nav-links a[aria-current="page"] { background: var(--soft); color: var(--navy) }
.day-h { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px }
.day-h b { color: var(--ink); font-size: 14px; letter-spacing: 0 }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.tl a, .tl .brk { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; line-height: 1.35 }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; padding-top: 2px }
.tl .brk { color: var(--muted); font-size: 13.5px }
.tl a:hover { background: var(--soft) }
.tl a[aria-current="page"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy) }
.tl a.is-now { background: var(--now-bg) }
.chip { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; align-self: center }
.chip.now { background: var(--accent); color: var(--accent-ink) }
.chip.done { background: var(--ok-bg); color: var(--ok) }

main { min-width: 0; padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 48px) }
.wrap { max-width: 860px }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.2; margin: 4px 0 10px; text-wrap: balance }
.meta { color: var(--muted); margin: 0 0 18px }
.prose h2.sec-h { font-size: 24px; margin: 30px 0 10px }
.prose h3 { font-size: 21px; margin: 30px 0 8px; color: var(--navy); text-wrap: balance }
.prose h4 { font-size: 17.5px; margin: 20px 0 6px }
.prose p { margin: 8px 0; max-width: 68ch }
.prose ul, .prose ol { padding-left: 1.4em; margin: 8px 0 }
.prose li { margin: 4px 0 }
.prose .note { color: var(--muted); font-size: 14.5px }
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 8px }
ol.steps > li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0 }
ol.steps > li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px }
ol.steps > li > div { min-width: 0 }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }
th { background: var(--soft); text-align: left; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
.box { border-radius: var(--r); padding: 12px 16px; margin: 14px 0; border-left: 4px solid var(--navy); background: var(--soft) }
.box.warn { background: var(--warn-bg); border-left-color: var(--warn-line) }
.box.doc { background: var(--doc-bg); border-left-color: var(--muted); border: 1px solid var(--line); border-left-width: 4px }
.box-t { font-weight: 700; margin: 0 0 4px }
.prompt { margin: 14px 0; border-radius: var(--r); background: var(--prompt-bg); border: 1px solid var(--prompt-line); overflow: hidden }
.prompt figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 700; color: var(--prompt-ink); border-bottom: 1px dashed var(--prompt-line) }
.prompt pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; font-family: var(--f-body); font-size: 15.5px; color: var(--prompt-ink); line-height: 1.6 }
.copy, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 14px; font-weight: 500; white-space: nowrap }
.copy { border-color: var(--prompt-line) }
.btn.primary { background: var(--navy); color: var(--surface); border-color: var(--navy) }
.btn[disabled] { opacity: .55; cursor: not-allowed }
code.ic { font-family: var(--f-body); background: var(--prompt-bg); color: var(--prompt-ink); border-radius: 5px; padding: 1px 6px }
.mini-copy { border: 0; background: none; color: var(--navy); font-size: 12.5px; text-decoration: underline; padding: 0 4px }

.plan { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 6px 0 22px }
.plan div { background: var(--surface); padding: 12px 14px; min-width: 0 }
.plan dt { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em }
.plan dd { margin: 2px 0 0; font-size: 15px; line-height: 1.5 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px }
.toggle-done[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok) }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; min-width: 0 }
a.card:hover { border-color: var(--navy) }
.card .k { font-size: 13px; font-weight: 700; color: var(--accent) }
.card .s { font-size: 13.5px; color: var(--muted) }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap }
.pager a { max-width: 48%; min-width: 0 }

/* home */
.hero { display: grid; gap: 4px; margin-bottom: 18px }
.hero h1 { font-size: clamp(30px, 5vw, 50px) }
.factline { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px }
.factline b { color: var(--ink); font-weight: 500 }
.nowcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; margin: 18px 0 }
.nowtop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
.seg button { border: 0; background: none; padding: 4px 14px; font-size: 14px }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--surface) }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px }
.nowgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px }
.slot { border-radius: 10px; padding: 12px 14px; background: var(--bg); display: grid; gap: 2px; text-decoration: none; color: var(--ink); min-width: 0 }
.slot.live { background: var(--now-bg) }
.slot .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent) }
.slot .tt { font-size: 18px; font-weight: 700; line-height: 1.35 }
.slot .tm { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums }
.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted) }
.bar { flex: 1; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px }
.days { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; margin: 10px 0 24px }
.daycol { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0 }
.daycol h3 { margin: 0; font-size: 18px }
.daycol p.th { margin: 0 0 8px; color: var(--muted); font-size: 14px }
.block { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; padding: 8px 6px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); align-items: baseline }
.block .t { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted) }
.block.b { color: var(--muted); font-size: 14px; padding-block: 4px }
.block .n { font-family: var(--f-display); color: var(--accent); margin-right: 6px }
a.block:hover { background: var(--soft) }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.dl-list { display: grid; gap: 10px }
.dl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between }
.dl .ti { font-weight: 700 }
.dl .wh { font-size: 13.5px; color: var(--muted) }
.dl .fmts { display: flex; gap: 8px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 50 }
.section-title { font-size: 20px; margin: 26px 0 8px }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0,1fr) }
  .side { position: fixed; inset: 56px auto 0 0; width: min(330px, 88vw); height: auto; z-index: 30; transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.25) }
  .side.open { transform: none }
  .menu-btn { display: inline-block }
  .brand span { display: none }
}
@media (max-width: 640px) {
  .days, .nowgrid, .plan { grid-template-columns: minmax(0,1fr) }
  .search { flex-basis: 160px }
  .pager a { max-width: 100% }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none } }
</style>
<style>
/* Representative-only additions on top of the shared employee layout. */
.prose blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--line); background: var(--doc-bg); border-radius: 0 var(--r) var(--r) 0 }
.prose ul.task-list { list-style: none; padding-left: 0 }
.prose ul.task-list label { display: flex; gap: 8px; align-items: flex-start }
.prose ul.task-list input { margin-top: 6px }
.prose li > .prompt { margin: 8px 0 }
.days.one { grid-template-columns: minmax(0,1fr) }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 22px 0 }
.tool h3 { margin-top: 0 }
.tool input, .tool textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
.tool textarea, .tool input[type=text] { width: 100% }
.tool input[type=number] { width: 80px }
.tool label.f { display: block; margin: 10px 0 }
.tool label.chk { display: flex; gap: 8px; align-items: center; margin: 10px 0 }
.tool table.rate td { text-align: center } .tool table.rate td:first-child { text-align: left }
.calc-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 }
.calc-sum div { background: var(--bg); border-radius: 10px; padding: 8px 10px }
.calc-sum span.l { display: block; color: var(--muted); font-size: 13.5px }
td.st-sel { color: var(--ok); font-weight: 700 } td.st-no { color: var(--accent) }
.msg { margin: 8px 0; font-weight: 500 } .msg.ok { color: var(--ok) } .msg.bad { color: var(--accent) }
@media print {
  .top, .side, .actions, .pager, .no-print, .toast { display: none !important }
  .shell { display: block } main { padding: 0 } body { background: #fff; color: #000; font-size: 12pt }
  .hb-mat { page-break-before: always }
}
</style>
</head>
<body style="margin:0">
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">कार्यतालिका</button>
  <a class="brand" href="#home"><b>AI तालिम</b><span id="brandSub">जनप्रतिनिधिका लागि · २०८३ कात्तिक २७</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="खोज्नुहोस्: सूचना, माइन्युट, आयोजना छनौट…" autocomplete="off" aria-label="सामग्री खोज्नुहोस्">
    <div class="results" id="results" hidden></div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="कार्यतालिका"></nav>
  <main id="main"><div class="wrap" id="view"><p class="eyebrow" style="margin-top:20px">लोड हुँदैछ…</p></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/workshop/representative/data.js"></script>
<script src="/workshop/account.js"></script>
<script src="/workshop/event-info.js"></script>
<script>
/* If a supporting file did not load, say so instead of leaving a blank page. */
(function () {
  var missing = [];
  if (!window.D_REP) missing.push('/workshop/representative/data.js');
  if (!window.WS) missing.push('/workshop/account.js');
  if (!missing.length) return;
  window.__REP_MISSING = missing;
  document.getElementById('view').innerHTML = '<p class="eyebrow">सामग्री लोड हुन सकेन</p><h1>पृष्ठ खुलेन</h1>' +
    '<p class="meta">यी फाइल लोड भएनन्: <code>' + missing.join('</code>, <code>') + '</code>। पृष्ठ फेरि लोड गर्नुहोस् (Ctrl+Shift+R)। समस्या रहिरह्यो भने प्रशिक्षकलाई यो सन्देश देखाउनुहोस्।</p>';
})();
</script>
<script>
/* Same shell as the employee materials (../index.html): running order on the left, the selected session's materials on the right. */
if (!window.D_REP || !window.WS) throw new Error("representative page: missing " + window.__REP_MISSING);
const DATA = window.D_REP;
const DEV = '०१२३४५६७८९';
const dn = s => String(s).replace(/[0-9]/g, d => DEV[d]);
const tm = (a, b) => dn(a) + '–' + dn(b);
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = Object.fromEntries(DATA.SESS.map(s => [s.id, s]));
const M = Object.fromEntries(DATA.MATS.map(m => [m.id, m]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('ai-rep-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ai-rep-' + k, JSON.stringify(v)); } catch (e) {} },
};
let done = new Set(store.get('done', []));
const DAY = DATA.DAYS[0];
const ASSESS = '../assessment/index.html';

function itemOf(id) { for (const it of DAY.items) if (it.id === id) return it; return null; }
function nkTime() {
  try {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    return +p.find(x => x.type === 'hour').value * 60 + +p.find(x => x.type === 'minute').value;
  } catch (e) { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
}
function nowNext() {
  const t = nkTime(); let now = null, next = null;
  for (const it of DAY.items) {
    if (toMin(it.start) <= t && t < toMin(it.end)) now = it;
    else if (toMin(it.start) > t && !next) next = it;
  }
  return { now, next, t };
}
function titleOf(it) { return it.kind === 'session' ? 'सत्र ' + S[it.id].n + ': ' + S[it.id].title : it.kind === 'other' ? DATA.OTHER[it.id].title : it.title; }
const matCard = id => `<a class="card" href="#${id}"><span class="k">${M[id].short}</span><b>${M[id].title}</b><span class="s">${M[id].use}</span></a>`;
const TOOLS = {
  calc: { k: 'सामग्री ७', t: 'आयोजना छनौट क्याल्कुलेटर', s: 'बजेट सीमा, नियम र अङ्कका आधारमा सूची' },
  feedback: { k: 'सामग्री १२', t: 'पृष्ठपोषण फाराम', s: 'अनलाइन पठाउनुहोस्' },
};
const toolCard = k => `<a class="card" href="#${k}"><span class="k">${TOOLS[k].k}</span><b>${TOOLS[k].t}</b><span class="s">${TOOLS[k].s}</span></a>`;
const assessCard = kind => `<a class="card" href="${ASSESS}"><span class="k">${kind === 'pre' ? 'पूर्व–परीक्षा' : 'पश्च–परीक्षा'}</span><b>AI ज्ञान परीक्षा</b><span class="s">इभेन्ट कोड प्रशिक्षकबाट पाउनुहोस्</span></a>`;

/* ---------- sidebar ---------- */
function renderSide(cur) {
  const nn = nowNext();

];
let scores = store.get('calc', {});
function calcHtml() {
  return `<section class="tool" id="calcTool"><h3>सामग्री ७ को क्याल्कुलेटर: आयोजना छनौट</h3>
  <p class="note">यो औजारले नियम र अङ्कका आधारमा सूची बनाउँछ। प्रत्येक माग (१३ वटा) को अङ्क टोलीले मापदण्ड अनुसार आफैँ दिनुहोस् (०–१००)। तपाईंको अन्तिम निर्णय र स्थानीय जानकारी नै प्रमुख हुन्।</p>
  <div class="tbl"><table><thead><tr><th>क्र.सं.</th><th>माग</th><th>लागत (रु. लाख)</th><th>लाभान्वित घरधुरी</th><th>लक्षित?</th><th>अङ्क (०–१००)</th><th>स्थिति</th></tr></thead><tbody id="calcBody"></tbody></table></div>
  <div class="calc-sum">
    <div><span class="l">बजेट सीमा</span><b>रु. ${dn(BUDGET)} लाख</b></div>
    <div><span class="l">छानिएको जम्मा</span><b>रु. <span id="cTotal">०</span> लाख</b></div>
    <div><span class="l">बाँकी</span><b>रु. <span id="cLeft">${dn(BUDGET)}</span> लाख</b></div>
    <div><span class="l">लक्षित कार्यक्रम</span><b>रु. <span id="cTarget">०</span> लाख (<span id="cTargetPct">०</span>%)</b></div>
  </div>
  <p id="calcMsg" class="msg"></p>
  <p class="note">नियम: रु. ३ लाखभन्दा सानो गैर-लक्षित आयोजना छैन। रु. ५० लाखभन्दा बढी वा एकभन्दा बढी वडा समेट्ने आयोजना र प्रदेश/संघको क्षेत्राधिकारका माग गाउँपालिका स्तरमा पठाइन्छ। लक्षित कार्यक्रम बजेटको कम्तीमा १५% (रु. १३.५ लाख) हुनुपर्छ।</p>
  <div class="actions"><button type="button" class="btn" id="calcReset">रिसेट गर्नुहोस्</button></div></section>`;
}
function num(v) { const x = parseFloat(v); return isNaN(x) ? null : x; }
function compute() {
  const rows = DEM.map(d => { const sc = num((scores[d.n] || {}).score); let tgt = (scores[d.n] || {}).t; if (tgt === undefined) tgt = d.t; return { d, score: sc, t: tgt, status: '' }; });
  const pool = [];
  rows.forEach(r => {
    const d = r.d;
    if (d.route || d.cost === null || d.cost > UPPER) { r.status = 'गाउँपालिका/माथिल्लो तहमा पठाउने'; return; }
    if (!r.t && d.cost < MIN_SMALL) { r.status = 'रु. ३ लाखभन्दा सानो (टुक्रे)'; return; }
    if (r.score === null) { r.status = 'अङ्क दिनुहोस्'; return; }
    pool.push(r);
  });
  pool.sort((x, y) => y.score - x.score || x.d.n - y.d.n);
  let used = 0;
  pool.forEach(r => { if (used + r.d.cost <= BUDGET) { used += r.d.cost; r.status = 'छानियो'; } else r.status = 'बजेट बाहिर'; });
  const tgtSum = rows.filter(r => r.status === 'छानियो' && r.t).reduce((s, r) => s + r.d.cost, 0);
  return { rows, used, tgtSum };
}
function calcSummary() {
  const c = compute();
  c.rows.forEach(r => { const el = document.querySelector(`[data-st="${r.d.n}"]`); if (el) { el.textContent = r.status; el.className = r.status === 'छानियो' ? 'st-sel' : 'st-no'; } });
  $('#cTotal').textContent = dn(c.used); $('#cLeft').textContent = dn(BUDGET - c.used);
  $('#cTarget').textContent = dn(c.tgtSum); $('#cTargetPct').textContent = dn(Math.round(c.tgtSum / BUDGET * 100));
  const msg = []; let bad = false;
  if (c.tgtSum < BUDGET * TARGET_MIN_PCT / 100) { msg.push('लक्षित कार्यक्रम अपुग छ: कम्तीमा १५% (रु. १३.५ लाख) पुर्‍याउनुहोस्।'); bad = true; }
  if (c.rows.some(r => r.score === null && !r.d.route && r.d.cost !== null && r.d.cost <= UPPER)) msg.push('सबै मागमा अङ्क दिनुहोस्।');
  if (!msg.length) msg.push('सबै नियम पूरा भयो। जम्मा अङ्क आफैँ जोडेर पुष्टि गर्नुहोस्।');
  $('#calcMsg').className = 'msg ' + (bad ? 'bad' : 'ok'); $('#calcMsg').textContent = msg.join(' ');
}
function mountCalc() {
  const body = $('#calcBody'); if (!body) return;
  const c = compute();
  body.innerHTML = c.rows.map(r => { const d = r.d; return `<tr><td>${dn(d.n)}</td><td>${esc(d.name)}</td><td>${d.cost === null ? 'अनुमान नभएको' : dn(d.cost)}</td><td>${d.hh ? dn(d.hh) : '—'}</td>
    <td><input type="checkbox" data-t="${d.n}" aria-label="लक्षित"${r.t ? ' checked' : ''}></td>
    <td><input type="number" min="0" max="100" data-s="${d.n}" aria-label="अङ्क" value="${r.score === null ? '' : r.score}"></td><td data-st="${d.n}"></td></tr>`; }).join('');
  calcSummary();
}

document.addEventListener('change', e => { const n = e.target.dataset && e.target.dataset.t; if (n) { scores[n] = scores[n] || {}; scores[n].t = e.target.checked; store.set('calc', scores); calcSummary(); } });

/* ---------- सामग्री १२ feedback form ---------- */
const QS = ['कार्यशाला मेरो कामका लागि उपयोगी थियो', 'सिकाइको गति मलाई ठिक्क थियो', 'भाषा बुझ्न सजिलो थियो', 'आफैँ गरेर सिक्ने पर्याप्त अवसर मिल्यो', 'आयोजना छनौट अभ्यास वास्तविक जस्तो लाग्यो', 'सहजकर्ता र सहयोगीबाट राम्रो सहयोग मिल्यो'];
function fbHtml() {
  const rates = QS.map((q, i) => `<tr><td>${esc(q)}</td>${[1, 2, 3, 4, 5].map(k => `<td><input type="radio" name="q${i}" value="${k}" aria-label="${dn(k)}" required></td>`).join('')}</tr>`).join('');
  return `<section class="tool" id="fbTool"><h3>सामग्री १२: पृष्ठपोषण फाराम (अनलाइन)</h3>
  <p class="note">हरेक पङ्क्तिमा एउटा मात्र विकल्प छान्नुहोस् (१ = कमजोर, ५ = धेरै राम्रो)। इभेन्ट कोड प्रशिक्षकबाट पाउनुहोस्।</p>
  <form id="fbForm">
    <label class="f">इभेन्ट कोड<input id="fbCode" type="text" required maxlength="20" autocomplete="off"></label>
    <div class="tbl"><table class="rate"><thead><tr><th>प्रश्न</th><th>१</th><th>२</th><th>३</th><th>४</th><th>५</th></tr></thead><tbody>${rates}</tbody></table></div>
    <label class="f">कुन सत्र सबैभन्दा उपयोगी लाग्यो, र किन?<textarea id="fbBest" rows="2" maxlength="600"></textarea></label>
    <label class="f">अर्को पटक के सुधार गर्नुपर्छ?<textarea id="fbImprove" rows="2" maxlength="600"></textarea></label>
    <label class="f">तपाईं सबैभन्दा पहिले कुन काम AI बाट गर्नुहुन्छ?<textarea id="fbFirst" rows="2" maxlength="600"></textarea></label>
    <label class="chk"><input id="fbRec" type="checkbox"> यो कार्यशाला अरू जनप्रतिनिधिलाई सिफारिस गर्छु</label>
    <div class="actions"><button class="btn primary" type="submit" id="fbSend">पठाउनुहोस्</button></div>
    <p id="fbMsg" class="msg" hidden></p>
  </form></section>`;
}
function fbMsg(text, ok) { const m = $('#fbMsg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.hidden = false; }
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fbForm') return;
  e.preventDefault();
  const ratings = [];
  for (let i = 0; i < QS.length; i++) {
    const r = document.querySelector(`input[name="q${i}"]:checked`);
    if (!r) { fbMsg('सबै प्रश्नमा एउटा विकल्प छान्नुहोस्।', false); return; }
    ratings.push(parseInt(r.value, 10));
  }
  const btn = $('#fbSend'); btn.disabled = true;
  try {
    await WS.init();
    const res = await WS.submitFeedback({
      event_code: $('#fbCode').value.trim().toUpperCase(), ratings,
      best_session: $('#fbBest').value.trim(), improve: $('#fbImprove').value.trim(),
      first_ai_use: $('#fbFirst').value.trim(), recommend: $('#fbRec').checked,
    });
    if (res.error) { fbMsg('पठाउन सकिएन: ' + res.error.message, false); btn.disabled = false; return; }
    $('#fbForm').reset();
    fbMsg('धन्यवाद! तपाईंको पृष्ठपोषण सुरक्षित भयो।', true);
  } catch (err) { fbMsg('पठाउन सकिएन। इन्टरनेट जाँच गरी फेरि प्रयास गर्नुहोस्।', false); }
  btn.disabled = false;
});

/* ---------- routing (same access rule as the employee materials) ---------- */
let MATERIALS_OK = false;
function gateView() {
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">सामग्री निजी छ</p><h1>सामग्री हेर्न खाता चाहिन्छ</h1>
  <p class="meta">यो सामग्री अहिले प्रशिक्षकले सार्वजनिक गरेका छैनन्। स्वीकृत सहभागीहरूले साइन इन गरेर हेर्न सक्छन्।</p>
  <p><a class="btn primary" href="../login.html?next=${encodeURIComponent(location.pathname + location.hash)}">साइन इन / नयाँ दर्ता</a></p></div>`;
}
function route() {
  if (!MATERIALS_OK) { $('#view').innerHTML = gateView(); renderSide('home'); return; }
  const id = (location.hash || '#home').slice(1) || 'home';
  let html, cur = id;
  if (S[id]) html = vSession(S[id]);
  else if (DATA.OTHER[id]) html = vOther(id);
  else if (M[id]) html = vMat(M[id]);
  else if (id === 'resources') html = vResources();
  else if (id === 'agenda') html = vAgenda();
  else if (id === 'handbook') html = vHandbook();
  else if (id === 'calc') html = vCalc();
  else if (id === 'feedback') html = vFeedback();
  else { html = vHome(); cur = 'home'; }
  $('#view').innerHTML = html;
  mountCalc();
  renderSide(cur);
  closeSide();
  window.scrollTo({ top: 0 });
  store.set('last', cur);
}

/* ---------- interactions ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('प्रतिलिपि भयो'); }
  catch (e) { if (el) selectText(el); toast('पाठ छानिएको छ; लामो थिचेर Copy गर्नुहोस्'); }
}
document.addEventListener('click', e => {
  const c = e.target.closest('.copy');
  if (c) { const pre = document.getElementById(c.dataset.copyId); copyText(pre.textContent, pre); return; }
  const m = e.target.closest('.mini-copy');
  if (m) { copyText(m.dataset.copy, m.previousElementSibling); return; }
  const t = e.target.closest('.toggle-done');
  if (t) { const id = t.dataset.sess; done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); route(); return; }
  if (e.target.closest('[data-print]')) { window.print(); return; }
  if (e.target.closest('#calcReset')) { scores = {}; store.set('calc', scores); mountCalc(); return; }
  if (!e.target.closest('.search')) $('#results').hidden = true;
});

/* ---------- organiser, place and dates from the event (../event-info.js) ---------- */
let ORG = '', PLACE = '', EV_RULES = null;
const fillEv = t => EV_RULES ? EVI.fill(t, EV_RULES) : t;
async function applyEvent() {
  const ev = await EVI.resolve('representative');
  if (!ev) return;
  const info = EVI.info(ev);
  ORG = info.org; PLACE = info.place;
  EV_RULES = EVI.representativeRules(info);
  EVI.fillDeep(DATA, EV_RULES, ['SESS', 'OTHER']);
  $('#brandSub').textContent = EVI.fill('जनप्रतिनिधिका लागि · २०८३ कात्तिक २७', EV_RULES);
  if (ORG) document.title = 'जनप्रतिनिधिका लागि AI · ' + ORG;
  buildIndex();
}

/* search */
const INDEX = [];
function buildIndex() {
  INDEX.length = 0;
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' '); };
  DATA.SESS.forEach(s => INDEX.push({ id: s.id, title: 'सत्र ' + s.n + ': ' + s.title, text: strip(s.plan.method + ' ' + s.plan.outcome) }));
  DATA.MATS.forEach(m => INDEX.push({ id: m.id, title: m.short + ': ' + m.title, text: strip(m.html) }));
  Object.entries(DATA.OTHER).forEach(([id, o]) => INDEX.push({ id, title: o.title, text: strip(o.plan.method + ' ' + o.plan.outcome) }));
  INDEX.push({ id: 'agenda', title: 'कार्यशाला कार्ययोजना', text: strip(DATA.AGENDA_HTML) });
  INDEX.push({ id: 'calc', title: 'आयोजना छनौट क्याल्कुलेटर', text: DEM.map(d => d.name).join(' ') });
  INDEX.push({ id: 'feedback', title: 'पृष्ठपोषण फाराम', text: QS.join(' ') });
}
buildIndex();
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  const hits = [];
  for (const it of INDEX) {
    const i = it.text.toLowerCase().indexOf(q), inT = it.title.toLowerCase().includes(q);
    if (i < 0 && !inT) continue;
    hits.push({ ...it, snip: i < 0 ? '' : '…' + it.text.slice(Math.max(0, i - 40), i + 70) + '…', score: inT ? 0 : 1 });
  }
  hits.sort((a, b) => a.score - b.score);
  box.innerHTML = hits.length ? hits.slice(0, 12).map(h => `<a href="#${h.id}"><b>${h.title}</b><small></small></a>`).join('') : '<p style="padding:8px 10px;margin:0;color:var(--muted)">केही भेटिएन।</p>';
  box.querySelectorAll('small').forEach((s, k) => s.textContent = hits[k].snip);
  box.hidden = false;
});
$('#results').addEventListener('click', e => { if (e.target.closest('a')) { $('#results').hidden = true; $('#q').value = ''; } });

/* drawer */
function closeSide() { $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
$('#menuBtn').addEventListener('click', () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });

window.addEventListener('hashchange', route);
/* Start-up. Never leave the page blank: show "loading" at once, give the database a few seconds,
   and if it does not answer, say so with a retry button. Event details (organiser, place, dates)
   are filled in after the first draw so they never hold the page back. */
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const LOADING = '<p class="eyebrow" style="margin-top:20px">लोड हुँदैछ…</p>';
function slowView() {
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">जडानमा ढिलाइ</p><h1>सामग्री लोड हुन सकेन</h1>
  <p class="meta">सर्भरसँगको जडान ढिलो छ वा टुटेको छ। इन्टरनेट जाँचेर फेरि प्रयास गर्नुहोस्।</p>
  <p><button class="btn primary" data-retry>फेरि प्रयास गर्नुहोस्</button></p></div>`;
}
let EVENT_DONE = false;
async function start() {
  $('#view').innerHTML = LOADING;
  let ok;
  try {
    await withTimeout(WS.init(), 7000);
    ok = (await withTimeout(WS.materialsPublic(), 7000)) || WS.isApproved() || WS.isTrainer();
  } catch (e) { ok = e && e.message === 'timeout' ? null : false; }
  if (ok === null) { $('#view').innerHTML = slowView(); renderSide('home'); return; }
  MATERIALS_OK = ok;
  route();
  if (EVENT_DONE) return;
  try {
    await withTimeout(applyEvent(), 7000);
    EVENT_DONE = true;
    const y = scrollY; route(); scrollTo(0, y);
  } catch (e) {}
}
document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) start(); });
start();
setInterval(() => {
  if (!MATERIALS_OK) return;
  const id = (location.hash || '#home').slice(1);
  renderSide(S[id] || DATA.OTHER[id] || M[id] ? id : (id || 'home'));
  if (!location.hash || id === 'home') { const y = scrollY; $('#view').innerHTML = vHome(); scrollTo(0, y); }
}, 60000);
</script>
