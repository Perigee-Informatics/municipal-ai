<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>जनप्रतिनिधिका लागि AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&family=Rozha+One&display=swap">
<style>
/* Layout: a two-day running order on the left (the spine of the event), the selected session's handbook pages on the right; phones get the order as a drawer. */
:root {
  --bg: #EEF1F4; --surface: #FFFFFF; --ink: #142440; --muted: #556275; --line: #D6DDE6;
  --accent: #B3123A; --accent-ink: #FFFFFF; --navy: #1C3A66; --soft: #E6ECF4;
  --prompt-bg: #FFF5DC; --prompt-line: #C98A0B; --prompt-ink: #3B2E10;
  --warn-bg: #FBE8EC; --warn-line: #B3123A; --doc-bg: #F6F7F9; --ok: #237A52; --ok-bg: #E2F2EA;
  --now-bg: #FBE3E9;
  --f-body: 'Mukta', 'Nirmala UI', 'Kohinoor Devanagari', 'Noto Sans Devanagari', system-ui, sans-serif;
  --f-display: 'Rozha One', 'Mukta', 'Noto Serif Devanagari', Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1420; --surface: #152033; --ink: #E3E9F2; --muted: #9AA8BB; --line: #26344B;
  --accent: #F2708C; --accent-ink: #1A0A10; --navy: #93B4E6; --soft: #1B2942;
  --prompt-bg: #2A2414; --prompt-line: #E2AE45; --prompt-ink: #F3E6C4;
  --warn-bg: #33161E; --warn-line: #F2708C; --doc-bg: #182436; --ok: #6FD3A2; --ok-bg: #133227; --now-bg: #3A1824;
  color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer }
a { color: var(--navy) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink) }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--accent); white-space: nowrap }
.brand span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.search { margin-left: auto; position: relative; flex: 0 1 340px; min-width: 0 }
.search input { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 15px }
.results { position: absolute; right: 0; top: calc(100% + 6px); width: min(460px, 92vw); max-height: 60vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 12px 30px rgba(10,20,40,.18); padding: 6px }
.results a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink) }
.results a:hover, .results a:focus { background: var(--soft) }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4 }
.home-link { white-space: nowrap; text-decoration: none; font-weight: 600; font-size: 15px; color: var(--navy) }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; font-size: 15px }

.shell { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100% - 56px) }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow: auto }
.nav-links { display: grid; gap: 2px; margin-bottom: 14px }
.nav-links a { text-decoration: none; color: var(--ink); padding: 6px 10px; border-radius: 8px; font-weight: 500 }
.nav-links a[aria-current="page"] { background: var(--soft); color: var(--navy) }
.day-h { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; gap: 8px }
.day-h b { color: var(--ink); font-size: 14px; letter-spacing: 0 }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px }
.tl a, .tl .brk { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; line-height: 1.35 }
.tl .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px; padding-top: 2px }
.tl .brk { color: var(--muted); font-size: 13.5px }
.tl a:hover { background: var(--soft) }
.tl a[aria-current="page"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--navy) }
.tl a.is-now { background: var(--now-bg) }
.chip { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; white-space: nowrap; align-self: center }
.chip.now { background: var(--accent); color: var(--accent-ink) }
.chip.done { background: var(--ok-bg); color: var(--ok) }

main { min-width: 0; padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 48px) }
.wrap { max-width: 860px }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.6vw, 44px); line-height: 1.2; margin: 4px 0 10px; text-wrap: balance }
.meta { color: var(--muted); margin: 0 0 18px }
.prose h2.sec-h { font-size: 24px; margin: 30px 0 10px }
.prose h3 { font-size: 21px; margin: 30px 0 8px; color: var(--navy); text-wrap: balance }
.prose h4 { font-size: 17.5px; margin: 20px 0 6px }
.prose p { margin: 8px 0; max-width: 68ch }
.prose ul, .prose ol { padding-left: 1.4em; margin: 8px 0 }
.prose li { margin: 4px 0 }
.prose .note { color: var(--muted); font-size: 14.5px }
ol.steps { list-style: none; padding: 0; counter-reset: st; display: grid; gap: 8px }
ol.steps > li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 0 }
ol.steps > li::before { content: counter(st); width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px }
ol.steps > li > div { min-width: 0 }
.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums }
th { background: var(--soft); text-align: left; font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
.box { border-radius: var(--r); padding: 12px 16px; margin: 14px 0; border-left: 4px solid var(--navy); background: var(--soft) }
.box.warn { background: var(--warn-bg); border-left-color: var(--warn-line) }
.box.doc { background: var(--doc-bg); border-left-color: var(--muted); border: 1px solid var(--line); border-left-width: 4px }
.box-t { font-weight: 700; margin: 0 0 4px }
.prompt { margin: 14px 0; border-radius: var(--r); background: var(--prompt-bg); border: 1px solid var(--prompt-line); overflow: hidden }
.prompt figcaption { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; font-weight: 700; color: var(--prompt-ink); border-bottom: 1px dashed var(--prompt-line) }
.prompt pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; font-family: var(--f-body); font-size: 15.5px; color: var(--prompt-ink); line-height: 1.6 }
.copy, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 14px; font-weight: 500; white-space: nowrap }
.copy { border-color: var(--prompt-line) }
.btn.primary { background: var(--navy); color: var(--surface); border-color: var(--navy) }
.btn[disabled] { opacity: .55; cursor: not-allowed }
code.ic { font-family: var(--f-body); background: var(--prompt-bg); color: var(--prompt-ink); border-radius: 5px; padding: 1px 6px }
.mini-copy { border: 0; background: none; color: var(--navy); font-size: 12.5px; text-decoration: underline; padding: 0 4px }

.plan { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin: 6px 0 22px }
.plan div { background: var(--surface); padding: 12px 14px; min-width: 0 }
.plan dt { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em }
.plan dd { margin: 2px 0 0; font-size: 15px; line-height: 1.5 }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 18px }
.toggle-done[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok) }

.related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 12px 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; min-width: 0 }
a.card:hover { border-color: var(--navy) }
.card .k { font-size: 13px; font-weight: 700; color: var(--accent) }
.card .s { font-size: 13.5px; color: var(--muted) }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap }
.pager a { max-width: 48%; min-width: 0 }

/* home */
.hero { display: grid; gap: 4px; margin-bottom: 18px }
.hero h1 { font-size: clamp(30px, 5vw, 50px) }
.factline { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px }
.factline b { color: var(--ink); font-weight: 500 }
.nowcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; margin: 18px 0 }
.nowtop { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
.seg button { border: 0; background: none; padding: 4px 14px; font-size: 14px }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--surface) }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px }
.nowgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px }
.slot { border-radius: 10px; padding: 12px 14px; background: var(--bg); display: grid; gap: 2px; text-decoration: none; color: var(--ink); min-width: 0 }
.slot.live { background: var(--now-bg) }
.slot .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: var(--accent) }
.slot .tt { font-size: 18px; font-weight: 700; line-height: 1.35 }
.slot .tm { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums }
.progress { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted) }
.bar { flex: 1; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px }
.days { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; margin: 10px 0 24px }
.daycol { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0 }
.daycol h3 { margin: 0; font-size: 18px }
.daycol p.th { margin: 0 0 8px; color: var(--muted); font-size: 14px }
.block { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; padding: 8px 6px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); align-items: baseline }
.block .t { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--muted) }
.block.b { color: var(--muted); font-size: 14px; padding-block: 4px }
.block .n { font-family: var(--f-display); color: var(--accent); margin-right: 6px }
a.block:hover { background: var(--soft) }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.dl-list { display: grid; gap: 10px }
.dl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between }
.dl .ti { font-weight: 700 }
.dl .wh { font-size: 13.5px; color: var(--muted) }
.dl .fmts { display: flex; gap: 8px; flex-wrap: wrap }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 50 }
.section-title { font-size: 20px; margin: 26px 0 8px }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0,1fr) }
  .side { position: fixed; inset: 56px auto 0 0; width: min(330px, 88vw); height: auto; z-index: 30; transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.25) }
  .side.open { transform: none }
  .menu-btn { display: inline-block }
  .top .home-link { display: none }
  .brand span { display: none }
}
@media (max-width: 640px) {
  .days, .nowgrid, .plan { grid-template-columns: minmax(0,1fr) }
  .search { flex-basis: 160px }
  .pager a { max-width: 100% }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none } }
</style>
<style>
/* Representative-only additions on top of the shared employee layout. */
.prose blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--line); background: var(--doc-bg); border-radius: 0 var(--r) var(--r) 0 }
.prose ul.task-list { list-style: none; padding-left: 0 }
.prose ul.task-list label { display: flex; gap: 8px; align-items: flex-start }
.prose ul.task-list input { margin-top: 6px }
.prose li > .prompt { margin: 8px 0 }
.days.one { grid-template-columns: minmax(0,1fr) }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 22px 0 }
.tool h3 { margin-top: 0 }
.tool input, .tool textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
.tool textarea, .tool input[type=text] { width: 100% }
.tool input[type=number] { width: 80px }
.tool label.f { display: block; margin: 10px 0 }
.tool label.chk { display: flex; gap: 8px; align-items: center; margin: 10px 0 }
.tool table.rate td { text-align: center } .tool table.rate td:first-child { text-align: left }
.calc-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0 }
.calc-sum div { background: var(--bg); border-radius: 10px; padding: 8px 10px }
.calc-sum span.l { display: block; color: var(--muted); font-size: 13.5px }
td.st-sel { color: var(--ok); font-weight: 700 } td.st-no { color: var(--accent) }
.msg { margin: 8px 0; font-weight: 500 } .msg.ok { color: var(--ok) } .msg.bad { color: var(--accent) }
@media print {
  .top, .side, .actions, .pager, .no-print, .toast { display: none !important }
  .shell { display: block } main { padding: 0 } body { background: #fff; color: #000; font-size: 12pt }
  .hb-mat { page-break-before: always }
}
</style>
</head>
<body style="margin:0">
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">कार्यतालिका</button>
  <a class="brand" href="#home"><b>AI तालिम</b><span id="brandSub">जनप्रतिनिधिका लागि · २०८३ कात्तिक २७</span></a>
  <a class="home-link" data-home href="/workshop/index.html" hidden>⌂ गृहपृष्ठ</a>
  <div class="search">
    <input id="q" type="search" placeholder="खोज्नुहोस्: सूचना, माइन्युट, आयोजना छनौट…" autocomplete="off" aria-label="सामग्री खोज्नुहोस्">
    <div class="results" id="results" hidden></div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="कार्यतालिका"></nav>
  <main id="main"><div class="wrap" id="view"><p class="eyebrow" style="margin-top:20px">लोड हुँदैछ…</p></div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* Generated from the representative workshop handbook (कार्ययोजना + सामग्री १–१२). */
window.D_REP = {"INTRO":"यो पुस्तिका मिति ……….. हुने कार्यशालाका सहभागीहरूका लागि तयार गरिएको हो।\nसामग्री ३, ४ र ७ देखि १२ सम्म सबै सहभागीलाई छापेर दिइनेछ। सामग्री ३ र ७\nकार्यशालाको भाइबर समूहमा पनि पठाइनेछ, ताकि सहभागीले टाइप नगरी सिधै AI मा टाँस्न\nसकून्।","AGENDA_HTML":"<p><strong>………………. पालिका, …………… · मिति: …………</strong></p>\n<p>………………….. पालिकाका जनप्रतिनिधिहरूलाई आफ्नै मोबाइलमा, नेपाली भाषामै, निःशुल्क\nAI उपकरण प्रयोग गरी दैनिक कामकाज छिटो र प्रभावकारी बनाउन सक्षम बनाउने उद्देश्यले\nयो एकदिने व्यावहारिक कार्यशाला आयोजना गरिएको हो। वार्षिक योजना तथा बजेटका\nलागि आयोजना छनौट गर्ने अभ्यास यस कार्यशालाको मुख्य आकर्षण हुनेछ।</p>\n<h2>कार्यशालाको संक्षिप्त परिचय</h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>विवरण</strong></th>\n<th><strong>जानकारी</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>कार्यशालाको नाम</td>\n<td>जनप्रतिनिधिका लागि कृत्रिम बुद्धिमत्ता (AI): कार्यदक्षता र प्रभावकारिता\nअभिवृद्धि कार्यशाला</td>\n</tr>\n<tr>\n<td>आयोजक</td>\n<td>…………………. पालिका, ………… प्रदेश</td>\n</tr>\n<tr>\n<td>मिति</td>\n<td>२०८३ कात्तिक २७ गते</td>\n</tr>\n<tr>\n<td>समय</td>\n<td>बिहान १०:०० देखि बेलुका ४:०० बजेसम्म (खाना: १२:४५ देखि १:३० बजेसम्म)</td>\n</tr>\n<tr>\n<td>स्थान</td>\n<td>गाउँपालिकाको सभाहल (यकिन गर्न बाँकी)</td>\n</tr>\n<tr>\n<td>सहभागी</td>\n<td>गाउँपालिका अध्यक्ष, उपाध्यक्ष, वडाध्यक्षहरू, गाउँ कार्यपालिका सदस्यहरू, महिला\nतथा दलित महिला सदस्यहरू र वडा सदस्यहरू (करिब ३० देखि ४५ जना)</td>\n</tr>\n<tr>\n<td>पर्यवेक्षक तथा सहयोगी</td>\n<td>प्रमुख प्रशासकीय अधिकृत, सूचना प्रविधि अधिकृत, योजना अधिकृत</td>\n</tr>\n<tr>\n<td>सहजकर्ता टोली</td>\n<td>मुख्य सहजकर्ता, सह-सहजकर्ता र ५ देखि ६ जना सहयोगी (६ देखि ८ जना सहभागीका\nलागि एक जना)</td>\n</tr>\n<tr>\n<td>प्रयोग हुने उपकरण</td>\n<td>पूरै कोठाले एउटै निःशुल्क AI च्याट एप (ChatGPT, Gemini वा Claude मध्ये एक) र\nGboard मा नेपाली बोलेर टाइप गर्ने सुविधा</td>\n</tr>\n<tr>\n<td>सहभागी सामग्री</td>\n<td>छुट्टै पुस्तिका: <em>सिकाइ सामग्री</em> (सामग्री १ देखि १२)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>कार्यशालाका उद्देश्यहरू:</strong> कार्यशाला सकिँदासम्म प्रत्येक\nसहभागीले:</p>\n<ol>\n<li>AI ले के गर्न सक्छ र के सक्दैन, अनि यसको उत्तर किन जाँच्नुपर्छ भन्ने कुरा सरल\nभाषामा बुझाउन सक्नेछन्।</li>\n<li>भूमिका + काम + सन्दर्भ + ढाँचा मिलाएर नेपालीमा स्पष्ट प्रम्प्ट (निर्देशन) लेख्न र\nआएको उत्तरलाई थप सुधार्न सक्नेछन्।</li>\n<li>बोलेर टाइप गर्ने सुविधा र मोबाइलको क्यामेराबाट कागजात छिटो AI मा हाल्न\nसक्नेछन्।</li>\n<li>सूचना, माइन्युट, कागजातको सारांश, भाषण र सामाजिक सञ्जालको पोस्ट गरी पाँच\nसाझा काम आफैँ गर्न सक्नेछन्।</li>\n<li>स्थानीय सरकार सञ्चालन ऐन, २०७४ अनुसार आफ्नो पदको जिम्मेवारीसँग जोडिएका\nकाममा AI प्रयोग गर्न सक्नेछन्।</li>\n<li>वडाको वार्षिक योजनाका लागि आएका माग छुट्याउन, अङ्क दिन र छनौट गर्न AI को\nसहयोग लिन सक्नेछन्, र आफ्नो छनौटको औचित्य पुष्टि गर्न सक्नेछन्।</li>\n<li>सार्वजनिक पदमा रहेर AI प्रयोग गर्दा गोपनीयता, शुद्धता र जवाफदेहिताका नियम\nपालना गर्नेछन्।</li>\n</ol>\n<p><strong>गाउँपालिकाका लागि अपेक्षित उपलब्धि:</strong> सूचना, पत्र, माइन्युट र\nभाषणको मस्यौदा छिटो तयार हुने; कार्यपालिका तथा गाउँ सभाको बैठकमा जनप्रतिनिधिहरू\nथप तयारीका साथ सहभागी हुने; आयोजना छनौट थप स्पष्ट र तथ्यमा आधारित हुने; र AI\nप्रयोगसम्बन्धी साझा प्रतिबद्धता पत्रमा हस्ताक्षर हुने।</p>\n<h2>दिनभरको\nकार्यतालिका (मिति २०८३ कात्तिक २७, बिहान १०:०० देखि बेलुका ४:०० बजेसम्म)</h2>\n<p>बिहानका सत्रमा सबैले गर्ने पाँच साझा काम सिकिनेछ भने दिउँसो तिनै सीपलाई आ–आफ्नो\nपदको काम र आयोजना छनौट अभ्यासमा प्रयोग गरिनेछ। कुल समयको करिब तीन चौथाइ भाग\nप्रत्यक्ष अभ्यासमा खर्च हुनेछ।</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>समय</strong></th>\n<th><strong>सत्र</strong></th>\n<th><strong>विधि</strong></th>\n<th><strong>सामग्री</strong></th>\n<th><strong>नतिजा</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१०:०० – १०:३० (३० मिनेट)</td>\n<td>उद्घाटन: अध्यक्षज्यूबाट स्वागत, परिचय, अपेक्षा संकलन र पूर्व–प्रश्नावली</td>\n<td>सामूहिक; ५ प्रश्नको छोटो प्रश्नावली</td>\n<td>सामग्री ११</td>\n<td>सहभागीको सुरुको ज्ञान थाहा हुने</td>\n</tr>\n<tr>\n<td>१०:३० – ११:०० (३० मिनेट)</td>\n<td>सत्र १: AI भनेको के हो? स्थानीय सरकारका लागि अवसर र सीमा</td>\n<td>छोटो प्रस्तुति, प्रत्यक्ष प्रदर्शन, \"भ्रम कि तथ्य\" खेल</td>\n<td>सामग्री १</td>\n<td>AI बारे साझा र सरल बुझाइ</td>\n</tr>\n<tr>\n<td>११:०० – ११:२० (२० मिनेट)</td>\n<td>सत्र २: मोबाइल तयारी, बोलेर टाइप गर्ने र पहिलो प्रम्प्ट</td>\n<td>सबै एकसाथ, चरणबद्ध</td>\n<td>सामग्री २, ३</td>\n<td>सबैको मोबाइलमा AI चल्ने</td>\n</tr>\n<tr>\n<td>११:२० – ११:३५ (१५ मिनेट)</td>\n<td>चिया विश्राम</td>\n<td>सहयोगीले लगइन समस्या समाधान गर्ने</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>११:३५ – १२:४५ (७० मिनेट)</td>\n<td>सत्र ३: पाँच साझा कामको निर्देशित अभ्यास (सूचना, माइन्युट, सारांश, भाषण,\nसामाजिक सञ्जाल पोस्ट)</td>\n<td>सहजकर्ताले प्रोजेक्टरमा देखाउने, सहभागीले सँगसँगै गर्ने</td>\n<td>सामग्री ३, ४</td>\n<td>प्रत्येकको मोबाइलमा ५ वटा मस्यौदा तयार</td>\n</tr>\n<tr>\n<td>१२:४५ – १:३० (४५ मिनेट)</td>\n<td>खाना</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>१:३० – २:१५ (४५ मिनेट)</td>\n<td>सत्र ४: मेरो पद, मेरो काम (पदअनुसार समूह अभ्यास)</td>\n<td>४ समूहमा अभ्यास कार्ड; जोडीमा एकअर्काको काम जाँच</td>\n<td>सामग्री ५, ६</td>\n<td>प्रत्येकले आफ्नो पदका ३ काम गर्ने</td>\n</tr>\n<tr>\n<td>२:१५ – २:४० (२५ मिनेट)</td>\n<td>सत्र ५: जिम्मेवार प्रयोग: गोपनीयता, शुद्धता र जवाफदेहिता</td>\n<td>घटना छलफल, \"गल्ती पत्ता लगाऔँ\" अभ्यास</td>\n<td>सामग्री ८</td>\n<td>के गर्ने, के नगर्ने भन्नेमा सहमति</td>\n</tr>\n<tr>\n<td>२:४० – २:५० (१० मिनेट)</td>\n<td>छोटो विश्राम</td>\n<td>वडा समितिका रूपमा मिश्रित टोली बनाउने</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>२:५० – ३:३५ (४५ मिनेट)</td>\n<td>सत्र ६: मुख्य अभ्यास: वार्षिक योजना तथा बजेटका लागि आयोजना छनौट</td>\n<td>५–६ जनाको मिश्रित टोली; AI को सहयोगमा छुट्याउने, अङ्क दिने, छनौट गर्ने; २\nमिनेटको प्रस्तुति</td>\n<td>सामग्री ७</td>\n<td>प्रत्येक टोलीको प्राथमिकताप्राप्त आयोजना सूची र गाउँ सभामा बोल्ने भाषण</td>\n</tr>\n<tr>\n<td>३:३५ – ३:५० (१५ मिनेट)</td>\n<td>सत्र ७: ३० दिने कार्ययोजना र AI प्रयोग प्रतिबद्धता</td>\n<td>व्यक्तिगत योजना; सामूहिक हस्ताक्षर</td>\n<td>सामग्री ९, १०</td>\n<td>व्यक्तिगत कार्ययोजना; हस्ताक्षरित प्रतिबद्धता पत्र</td>\n</tr>\n<tr>\n<td>३:५० – ४:०० (१० मिनेट)</td>\n<td>उत्तर–प्रश्नावली, पृष्ठपोषण र समापन (उपाध्यक्षज्यू वा प्रमुख प्रशासकीय\nअधिकृतज्यूबाट)</td>\n<td>प्रश्नावली र फाराम</td>\n<td>सामग्री ११, १२</td>\n<td>सिकाइमा भएको सुधार र पृष्ठपोषण</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>सत्र ४ का समूहहरू:</strong> (क) अध्यक्ष र उपाध्यक्ष, (ख) वडाध्यक्षहरू,\n(ग) गाउँ कार्यपालिका सदस्यहरू, (घ) महिला तथा दलित महिला सदस्यसहित वडा\nसदस्यहरू।</p>\n<p><strong>सत्र ६ का मिश्रित टोली:</strong> प्रत्येक टोलीलाई एउटा वडा समिति\nमानिनेछ, जसमा १ जना वडाध्यक्ष, १ जना कार्यपालिका सदस्य, १ जना महिला वा दलित\nमहिला सदस्य र २–३ जना वडा सदस्य रहनेछन्। अध्यक्ष र उपाध्यक्षज्यूले \"गाउँ सभाका सदस्य\"\nका रूपमा टोलीहरूलाई प्रश्न सोध्नुहुनेछ।</p>\n<h2>मूल्याङ्कन र अनुगमन</h2>\n<h3>मूल्याङ्कन</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>तह</strong></th>\n<th><strong>साधन</strong></th>\n<th><strong>कहिले</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>प्रतिक्रिया</td>\n<td>पृष्ठपोषण फाराम (सामग्री १२)</td>\n<td>बेलुका ३:५०</td>\n</tr>\n<tr>\n<td>सिकाइ</td>\n<td>पूर्व र उत्तर–प्रश्नावली (सामग्री ११); औसत ३०% सुधारको लक्ष्य</td>\n<td>बिहान १०:०० र बेलुका ३:५०</td>\n</tr>\n<tr>\n<td>व्यवहार</td>\n<td>३० दिने कार्ययोजनाको भाइबरमार्फत अनुगमन: कति काम AI बाट गरिए</td>\n<td>३० दिनपछि</td>\n</tr>\n<tr>\n<td>नतिजा</td>\n<td>AI को सहयोगमा तयार भएका सूचना, माइन्युट, भाषण र वडा आयोजना सूचीका नमूना\nसंकलन</td>\n<td>३० देखि ६० दिनभित्र</td>\n</tr>\n</tbody>\n</table></div>\n<h3>अनुगमन र निरन्तरता</h3>\n<ul>\n<li>सूचना प्रविधि अधिकृतको संचालनमा \"………… AI सहायता\" भाइबर समूह, जहाँ राम्रा\nप्रम्प्ट साटासाट गर्ने र समस्या समाधान गरिनेछ।</li>\n<li>३० दिनपछि कार्यपालिका बैठकको समयमा एक घण्टाको पुनर्ताजगी कार्यक्रम, जहाँ\nटोलीहरूले आयोजना छनौट अभ्यासको गृहकार्य प्रस्तुत गर्नेछन्।</li>\n<li>योजना तर्जुमाको याम (फागुन देखि वैशाख) मा वास्तविक टोल भेलाका मागमा यही\nविधि प्रयोग गर्ने (व्यक्तिगत विवरण हटाएर)।</li>\n<li>आवश्यकता अनुसार शाखा प्रमुख र वडा सचिवहरूका लागि छुट्टै कार्यशाला।</li>\n</ul>\n<h2>सन्दर्भ स्रोत</h2>\n<ul>\n<li><a\nhref=\"https://ekantipur.com/news/2025/08/14/cabinet-meeting-national-ai-policy-2082-approved-11-38.html\">राष्ट्रिय\nकृत्रिम बुद्धिमत्ता नीति, २०८२ स्वीकृत (कान्तिपुर)</a></li>\n<li><a\nhref=\"https://dhunibeshimun.gov.np/sites/dhunibeshimun.gov.np/files/15%20%E0%A4%B8%E0%A5%8D%E0%A4%A5%E0%A4%BE%E0%A4%A8%E0%A5%80%E0%A4%AF%20%E0%A4%A4%E0%A4%B9%E0%A4%95%E0%A5%8B%20%E0%A4%B5%E0%A4%BE%E0%A4%B0%E0%A5%8D%E0%A4%B7%E0%A4%BF%E0%A4%95%20%E0%A4%AF%E0%A5%8B%E0%A4%9C%E0%A4%A8%E0%A4%BE%20%E0%A4%A4%E0%A4%A5%E0%A4%BE%20%E0%A4%B5%E0%A4%9C%E0%A5%87%E0%A4%9F%20%E0%A4%A4%E0%A4%B0%E0%A5%8D%E0%A4%9C%E0%A5%81%E0%A4%AE%E0%A4%BE%20%E0%A4%A6%E0%A4%BF%E0%A4%97%E0%A5%8D%E0%A4%A6%E0%A4%B0%E0%A5%8D%E0%A4%B6%E0%A4%A8%20%E0%A5%A8%E0%A5%A6%E0%A5%AD%E0%A5%AA.pdf\">स्थानीय\nतहको वार्षिक योजना तथा बजेट तर्जुमा दिग्दर्शन, २०७४ (परिमार्जित)</a></li>\n</ul>","MATS":[{"id":"m1","n":"१","short":"सामग्री १","title":"AI भनेको के हो?","html":"<p>AI च्याट उपकरणलाई धेरै कुरा पढेको, निकै छिटो काम गर्ने एउटा सहायकका रूपमा बुझ्न\nसकिन्छ। यसले नेपालीमा फटाफट लेखिदिन्छ, तर कहिलेकाहीँ ढुक्कसँग गलत कुरा पनि भनिदिन्छ।\n<strong>त्यसैले AI ले गरेको काम सधैं आफैं जाँच्नुपर्छ।</strong></p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>AI ले राम्रोसँग गर्ने काम</strong></th>\n<th><strong>AI कमजोर हुने ठाउँ</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>सूचना, चिठी, भाषण र पोस्टको मस्यौदा</td>\n<td>तपाईंको वडाका स्थानीय तथ्य</td>\n</tr>\n<tr>\n<td>लामो कागजातको सारांश</td>\n<td>भर्खरका घटना र नयाँ निर्णय</td>\n</tr>\n<tr>\n<td>अनुवाद र भाषा सरल बनाउने</td>\n<td>ऐन, दफा नम्बर र बजेटका ठ्याक्कै अङ्क</td>\n</tr>\n<tr>\n<td>सूची, तालिका र विचार मिलाउने</td>\n<td>सही–गलत छुट्याउने; कहिलेकाहीँ आफैं कुरा बनाइदिन्छ</td>\n</tr>\n<tr>\n<td>प्रश्न र विकल्प सुझाउने</td>\n<td>निर्णय गर्ने; यो काम तपाईंकै हो</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>नेपालको नीति:</strong> नेपाल सरकार मन्त्रिपरिषद्ले २०८२ साउन २६ गते\nराष्ट्रिय कृत्रिम बुद्धिमत्ता नीति, २०८२ स्वीकृत गरेको छ। यस नीतिले AI को नैतिक,\nसुरक्षित र समावेशी प्रयोगमा जोड दिएको छ।</p>\n<p><strong>भ्रम कि तथ्य? (तथ्य भए हरियो, भ्रम भए रातो कार्ड\nउठाउनुहोस्)</strong></p>\n<ol>\n<li>AI ले सधैं सत्य कुरा भन्छ।</li>\n<li>AI ले एकै मिनेटमा नेपालीमा चिठी लेखिदिन सक्छ।</li>\n<li>AI प्रयोग गरेपछि विषयवस्तुको जिम्मा मेरो हुँदैन।</li>\n<li>AI लाई हाम्रो गाउँपालिकाका पछिल्ला निर्णयहरू थाहा छन्।</li>\n<li>म नेपालीमा बोलें भने मोबाइलले आफैं टाइप गर्छ।</li>\n<li>AI ले लामो कागजातलाई मुख्य बुँदामा सारांश गर्न सक्छ।</li>\n<li>नागरिकको व्यक्तिगत विवरण AI मा हाल्नु ठिकै हो।</li>\n<li>वडाले कुन आयोजनामा बजेट दिने भन्ने निर्णय AI ले गर्न सक्छ।</li>\n</ol>","use":"सत्र १"},{"id":"m2","n":"२","short":"सामग्री २","title":"मोबाइल तयारी निर्देशिका","html":"<p>सहजकर्तासँगै एक–एक चरण गर्नुहोस्। काम सकिएपछि वा अड्किनुभयो भने हात\nउठाउनुहोस्।</p>\n<ol>\n<li><strong>AI एप खोल्नुहोस्:</strong> कार्यशालाका लागि रोजिएको एप (वा\nChrome मा त्यसको वेबसाइट) खोलेर <em>Sign in</em> थिच्नुहोस् र Google खाता वा\nइमेलबाट लगइन गर्नुहोस्।</li>\n<li><strong>नेपाली किबोर्ड थप्नुहोस्:</strong> Settings → System वा General\nmanagement → Languages and input → Gboard → Languages मा गएर\n<em>Nepali</em> थप्नुहोस्। (मोबाइल अनुसार मेनु फरक हुन सक्छ; सहयोगीले\nसघाउनुहुनेछ।)</li>\n<li><strong>बोलेर टाइप गर्ने सुविधा खोल्नुहोस्:</strong> जुनसुकै लेख्ने ठाउँमा\nकिबोर्डको माइक्रोफोन चिन्ह थिचेर नेपालीमा बोल्नुहोस्।</li>\n<li><strong>पहिलो प्रम्प्ट (बोलेर दिनुहोस्):</strong><figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp1\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp1\">मेरो वडाका बासिन्दाहरूलाई तिहारको ३ लाइनको शुभकामना सन्देश लेखिदिनुहोस्।</pre></figure></li>\n<li><strong>उत्तर कपी गर्नुहोस्:</strong> उत्तरमा केही बेर थिचेर वा कपी चिन्ह\nथिचेर भाइबरमा टाँस्नुहोस्।</li>\n<li><strong>भाइबर समूहमा जोडिनुहोस्:</strong> “AI सहायता\"।</li>\n</ol>\n<p><strong>केही समस्या आयो भने:</strong> इन्टरनेट छैन भने सभाहलको Wi-Fi वा\nसहयोगीको हटस्पट प्रयोग गर्नुहोस्; पासवर्ड बिर्सनुभयो भने अर्को इमेल प्रयोग गर्नुहोस् वा\nअहिलेलाई छेउको साथीसँग मिलेर अभ्यास गर्नुहोस्; उत्तर अङ्ग्रेजीमा आयो भने प्रम्प्टको\nअन्त्यमा \"नेपालीमा लेख्नुहोस्\" थप्नुहोस्।</p>","use":"सत्र २"},{"id":"m3","n":"३","short":"सामग्री ३","title":"प्रम्प्ट लेख्ने सूत्र र नमूना प्रम्प्ट संग्रह","html":"<p>AI लाई दिइने निर्देशनलाई प्रम्प्ट भनिन्छ। जति स्पष्ट निर्देशन दिइन्छ, उत्तर त्यति नै\nराम्रो आउँछ।</p>\n<p><strong>सूत्र: भूमिका + काम + सन्दर्भ + ढाँचा</strong></p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>भाग</strong></th>\n<th><strong>अर्थ</strong></th>\n<th><strong>उदाहरण</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>भूमिका</td>\n<td>AI लाई कसको रूपमा काम गर्न लगाउने?</td>\n<td>तपाईं ………….को सञ्चार अधिकृत हो।</td>\n</tr>\n<tr>\n<td>काम</td>\n<td>के गर्नुपर्ने हो?</td>\n<td>सरसफाइ अभियानको सूचना लेखिदिनुहोस्।</td>\n</tr>\n<tr>\n<td>सन्दर्भ</td>\n<td>चाहिने तथ्यहरू</td>\n<td>वडा नं. [ ], मिति [ ], स्थान [ ]</td>\n</tr>\n<tr>\n<td>ढाँचा</td>\n<td>लम्बाइ, शैली, रूप</td>\n<td>१०० शब्दभित्र, सरल भाषामा।</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>नमूना प्रम्प्टहरू:</strong> [ ] कोष्ठकमा आफ्नो विवरण राख्नुहोस्।\nनागरिकको नाम, फोन वा नागरिकता नम्बर कहिल्यै AI मा नहाल्नुहोस्।</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>काम</strong></th>\n<th><strong>प्रम्प्ट</strong></th>\n<th><strong>कसका लागि बढी उपयोगी</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>सूचना</td>\n<td><span>………….. पालिका वडा नं. [ ] कार्यालयको तर्फबाट [विषय] सम्बन्धी सूचना लेखिदिनुहोस्। मिति [ ], समय [ ], स्थान [ ]। सरकारी ढाँचामा, १२० शब्दभित्र।</span> <button class=\"mini-copy\" data-copy=\"………….. पालिका वडा नं. [ ] कार्यालयको तर्फबाट [विषय] सम्बन्धी सूचना लेखिदिनुहोस्। मिति [ ], समय [ ], स्थान [ ]। सरकारी ढाँचामा, १२० शब्दभित्र।\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>वडाध्यक्ष, वडा सदस्य</td>\n</tr>\n<tr>\n<td>भाषण</td>\n<td><span>म [पद] हुँ। [कार्यक्रम] मा बोल्न २ मिनेटको भाषण सरल नेपालीमा लेखिदिनुहोस्। धन्यवाद, योजनाको महत्त्व र जनतालाई आह्वान समेट्नुहोस्।</span> <button class=\"mini-copy\" data-copy=\"म [पद] हुँ। [कार्यक्रम] मा बोल्न २ मिनेटको भाषण सरल नेपालीमा लेखिदिनुहोस्। धन्यवाद, योजनाको महत्त्व र जनतालाई आह्वान समेट्नुहोस्।\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>अध्यक्ष, उपाध्यक्ष, वडाध्यक्ष</td>\n</tr>\n<tr>\n<td>सारांश</td>\n<td><span>तलको कागजातको मुख्य कुरा ५ बुँदामा लेखिदिनुहोस्, र निर्णय गर्नुपर्ने कुरा छुट्टै देखाउनुहोस्: [पाठ वा फोटो]</span> <button class=\"mini-copy\" data-copy=\"तलको कागजातको मुख्य कुरा ५ बुँदामा लेखिदिनुहोस्, र निर्णय गर्नुपर्ने कुरा छुट्टै देखाउनुहोस्: [पाठ वा फोटो]\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>बैठकअघि सबैलाई</td>\n</tr>\n<tr>\n<td>माइन्युट</td>\n<td><span>यी टिपोटका आधारमा बैठकको माइन्युट तयार पारिदिनुहोस्: उपस्थिति, प्रस्ताव, निर्णय र जिम्मेवार व्यक्ति। [टिपोट]</span> <button class=\"mini-copy\" data-copy=\"यी टिपोटका आधारमा बैठकको माइन्युट तयार पारिदिनुहोस्: उपस्थिति, प्रस्ताव, निर्णय र जिम्मेवार व्यक्ति। [टिपोट]\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>वडा समिति, कार्यपालिका</td>\n</tr>\n<tr>\n<td>सामाजिक सञ्जाल पोस्ट</td>\n<td><span>यो सूचनालाई फेसबुकका लागि ५० शब्दको आकर्षक पोस्ट बनाइदिनुहोस्। दलगत प्रचार नहोस्। [सूचना]</span> <button class=\"mini-copy\" data-copy=\"यो सूचनालाई फेसबुकका लागि ५० शब्दको आकर्षक पोस्ट बनाइदिनुहोस्। दलगत प्रचार नहोस्। [सूचना]\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>सबै</td>\n</tr>\n<tr>\n<td>कार्यालयको चिठी</td>\n<td><span>…………… लिकाको तर्फबाट [कार्यालय] लाई [विषय] मा सहयोग माग गर्ने औपचारिक चिठीको मस्यौदा तयार पारिदिनुहोस्।</span> <button class=\"mini-copy\" data-copy=\"…………… लिकाको तर्फबाट [कार्यालय] लाई [विषय] मा सहयोग माग गर्ने औपचारिक चिठीको मस्यौदा तयार पारिदिनुहोस्।\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>अध्यक्ष, वडाध्यक्ष</td>\n</tr>\n<tr>\n<td>मागको प्राथमिकीकरण</td>\n<td><span>वडा भेलाबाट आएका यी मागहरूलाई क्षेत्र अनुसार तालिकामा मिलाइदिनुहोस् र प्रति घरधुरी लागत निकालिदिनुहोस्। [मागको सूची]</span> <button class=\"mini-copy\" data-copy=\"वडा भेलाबाट आएका यी मागहरूलाई क्षेत्र अनुसार तालिकामा मिलाइदिनुहोस् र प्रति घरधुरी लागत निकालिदिनुहोस्। [मागको सूची]\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>वडाध्यक्ष, योजना तर्जुमा</td>\n</tr>\n<tr>\n<td>मेलमिलाप (उपाध्यक्ष)</td>\n<td><span>नाम नखुलाई यो विवादको तटस्थ सारांश लेखिदिनुहोस् र मेलमिलापका ३ विकल्प सुझाउनुहोस्। [विवरण]</span> <button class=\"mini-copy\" data-copy=\"नाम नखुलाई यो विवादको तटस्थ सारांश लेखिदिनुहोस् र मेलमिलापका ३ विकल्प सुझाउनुहोस्। [विवरण]\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>उपाध्यक्ष, न्यायिक समिति</td>\n</tr>\n<tr>\n<td>अधिकारीलाई सोध्ने प्रश्न</td>\n<td><span>[योजना] को प्रगति बारे प्रमुख प्रशासकीय अधिकृतलाई सोध्ने ५ वटा स्पष्ट प्रश्न तयार पारिदिनुहोस्।</span> <button class=\"mini-copy\" data-copy=\"[योजना] को प्रगति बारे प्रमुख प्रशासकीय अधिकृतलाई सोध्ने ५ वटा स्पष्ट प्रश्न तयार पारिदिनुहोस्।\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>अध्यक्ष, कार्यपालिका सदस्य, सभा सदस्य</td>\n</tr>\n<tr>\n<td>अनुगमन जाँचसूची</td>\n<td><span>[सडक/खानेपानी] आयोजनामा उपभोक्ता समितिले गरेको काम अनुगमन गर्न १० बुँदे जाँचसूची बनाइदिनुहोस्।</span> <button class=\"mini-copy\" data-copy=\"[सडक/खानेपानी] आयोजनामा उपभोक्ता समितिले गरेको काम अनुगमन गर्न १० बुँदे जाँचसूची बनाइदिनुहोस्।\" aria-label=\"प्रतिलिपि\">प्रतिलिपि</button></td>\n<td>वडा सदस्य, अनुगमन समिति</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>उत्तर सुधार्न काम लाग्ने थप निर्देशन:</strong> अझ छोटो बनाइदिनुहोस् ·\nअलि औपचारिक भाषामा लेख्नुहोस् · गाउँलेलाई बुझ्ने गरी लेख्नुहोस् · तालिकामा देखाइदिनुहोस्\n· यसमा मैले के–के कुरा जाँच्नुपर्छ?</p>","use":"सत्र २, ३ · सबै सत्र"},{"id":"m4","n":"४","short":"सामग्री ४","title":"निर्देशित अभ्यास पाना (सहजकर्तासँगै चरणबद्ध रूपमा गर्ने)","html":"<h3>अभ्यास १: वडाको सूचना तयार पार्ने</h3>\n<ol>\n<li>AI एप र नेपाली किबोर्ड खोल्नुहोस्।</li>\n<li>टाइप गर्नुहोस् वा बोल्नुहोस्:<figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp2\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp2\">तपाईं गाउँपालिकाको सञ्चार अधिकृत हो। …………... पालिका वडा नं. [ ] मा [मिति] मा हुने सरसफाइ अभियानको सूचना १०० शब्दभित्र सरल भाषामा लेखिदिनुहोस्।</pre></figure></li>\n<li>आएको उत्तर पढ्नुहोस्।</li>\n<li>थप निर्देशन दिनुहोस्: अझ छोटो र औपचारिक बनाइदिनुहोस्। ज्येष्ठ नागरिकका लागि\nएउटा वाक्य थपिदिनुहोस्।</li>\n<li><strong>जाँच्नुहोस्:</strong> मिति, समय र स्थान ठीक छ कि छैन।</li>\n</ol>\n<h3>अभ्यास २: बोलेका टिपोटबाट माइन्युट\nबनाउने</h3>\n<ol>\n<li>नेपाली किबोर्डको माइक्रोफोन थिच्नुहोस्।</li>\n<li>तलको नमूना ठूलो स्वरमा पढ्दै मोबाइलमा बोल्नुहोस्:</li>\n</ol>\n<blockquote>\n<p>आज वडा समितिको बैठक वडाध्यक्षज्यूको अध्यक्षतामा बस्यो। बैठकमा पाँच जना उपस्थित\nहुनुहुन्थ्यो। पहिलो प्रस्ताव खानेपानी ट्याङ्की मर्मतसम्बन्धी थियो; अर्को हप्ता उपभोक्ता\nसमिति गठन गर्ने निर्णय भयो। दोस्रो प्रस्ताव सरसफाइ अभियानसम्बन्धी थियो; मङ्सिर १५\nगते अभियान सञ्चालन गर्ने र वडा सदस्यले समन्वय गर्ने निर्णय भयो।</p>\n</blockquote>\n<ol start=\"3\">\n<li>प्रम्प्ट:<figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp3\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp3\">यी टिपोटका आधारमा वडा समिति बैठकको माइन्युट तयार पारिदिनुहोस्: उपस्थिति, प्रस्ताव, निर्णय र जिम्मेवार व्यक्ति।</pre></figure></li>\n<li>थप निर्देशन: निर्णयहरू तालिकामा देखाइदिनुहोस्।</li>\n<li><strong>जाँच्नुहोस्:</strong> बैठकमा नभएको कुनै निर्णय AI ले थपेको छ कि?\n(नमूनामा जम्मा दुईवटा निर्णय मात्र छन्।)</li>\n</ol>\n<h3>अभ्यास ३: कागजातको फोटोबाट सारांश\nनिकाल्ने</h3>\n<ol>\n<li>तल दिइएको नमूना कागजात (वा सहजकर्ताले दिएको पाना) लिनुहोस्।</li>\n<li>AI एपमा क्यामेरा वा फाइल जोड्ने चिन्ह थिचेर कागजातको फोटो खिच्नुहोस्।</li>\n<li>प्रम्प्ट:<figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp4\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp4\">यो कागजातका मुख्य कुरा ५ बुँदामा लेखिदिनुहोस्, र वडाध्यक्षले गर्नुपर्ने काम छुट्टै देखाइदिनुहोस्।</pre></figure></li>\n<li>थप निर्देशन: यस कागजातका बारेमा बैठकमा सोध्नुपर्ने ३ वटा प्रश्न\nसुझाइदिनुहोस्।</li>\n<li><strong>जाँच्नुहोस्:</strong> AI ले दिएको कुनै एउटा बुँदा कागजमा साँच्चै लेखिएको\nछ कि छैन, खोज्नुहोस्।</li>\n</ol>\n<p><strong>नमूना कागजात (काल्पनिक): कृषक बीउ अनुदान कार्यक्रम सञ्चालन\nकार्यविधि</strong></p>\n<blockquote>\n<p>१. यस कार्यक्रममा गाउँपालिकामा दर्ता भएका कृषक समूह र सहकारीले मात्र आवेदन दिन\nपाउनेछन्। २. बीउ खरिदमा ५० प्रतिशत अनुदान दिइनेछ; बाँकी रकम कृषक समूह आफैँले\nबेहोर्नुपर्नेछ। ३. आवेदन वडा कार्यालयमार्फत पेश गर्नुपर्नेछ र वडाध्यक्षले १५ दिनभित्र\nसिफारिस गर्नुपर्नेछ। ४. महिला तथा दलित कृषकलाई प्राथमिकता दिइनेछ। ५. अनुदान\nपाएका समूहले उत्पादनको विवरण कृषि शाखामा बुझाउनुपर्नेछ।</p>\n</blockquote>\n<h3>अभ्यास ४: सार्वजनिक कार्यक्रमका लागि\nभाषण</h3>\n<ol>\n<li>प्रम्प्ट:<figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp5\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp5\">म [पद] हुँ। [कार्यक्रम, जस्तै: स्वास्थ्य चौकीको उद्घाटन] मा बोल्न २ मिनेटको भाषण लेखिदिनुहोस्। धन्यवाद, योजनाको महत्त्व र जनतालाई आह्वान समेट्नुहोस्।</pre></figure></li>\n<li>थप निर्देशन: स्थानीय उदाहरण थपिदिनुहोस् र भाषा अझ सरल बनाइदिनुहोस्।</li>\n<li>एपमा स्पिकर चिन्ह छ भने थिचेर भाषण सुन्नुहोस्।</li>\n<li><strong>जाँच्नुहोस्:</strong> भाषणमा आएका सबै अङ्क, लागत र नाममा रेखा\nतान्नुहोस्; ती ठाउँमा वास्तविक तथ्य राख्नुहोस्।</li>\n<li>एक जना स्वयंसेवकले भाषणको सुरुका ३० सेकेन्ड कोठामा सुनाउनुहोस्।</li>\n</ol>\n<h3>अभ्यास ५: दुई भाषामा सामाजिक सञ्जाल\nपोस्ट</h3>\n<ol>\n<li>अभ्यास १ मा बनाएको सूचना कपी गरेर AI मा टाँस्नुहोस्।</li>\n<li>प्रम्प्ट:<figure class=\"prompt\"><figcaption><span>प्रम्प्ट</span><button class=\"copy\" data-copy-id=\"rp6\">प्रतिलिपि गर्नुहोस्</button></figcaption><pre id=\"rp6\">यो सूचनालाई फेसबुकका लागि ५० शब्दको आकर्षक पोस्ट बनाइदिनुहोस्। दलगत प्रचार नहोस्।</pre></figure></li>\n<li>थप निर्देशन: यसलाई [मगर / अङ्ग्रेजी / अन्य स्थानीय भाषा] मा पनि अनुवाद\nगरिदिनुहोस्।</li>\n<li><strong>जाँच्नुहोस्:</strong> नजिकै बसेका सो भाषा बोल्ने साथीलाई अनुवाद पढ्न\nलगाउनुहोस्।</li>\n<li>पोस्ट कपी गरेर भाइबरमा आफैँलाई मात्र पठाउनुहोस्।</li>\n</ol>","use":"सत्र ३"},{"id":"m5","n":"५","short":"सामग्री ५","title":"पदअनुसार नियमित कामहरू","html":"<p>हरेक पदमा बारम्बार गर्नुपर्ने १० वटा काम र तिनमा AI ले कसरी सघाउन सक्छ भन्ने\nविवरण। कामको प्रकार: <strong>का</strong> = कार्यालयको काम,\n<strong>सा</strong> = सार्वजनिक कार्यक्रम, <strong>सं</strong> = सामाजिक\nसञ्जाल।</p>\n<h3>समूह (क): अध्यक्ष र उपाध्यक्ष</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>काम</strong></th>\n<th><strong>प्रकार</strong></th>\n<th><strong>AI ले कसरी सघाउँछ</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td>गाउँ कार्यपालिका र गाउँ सभाको बैठक सञ्चालन</td>\n<td>का</td>\n<td>कार्यसूचीको सारांश, स्वागत मन्तव्य, निर्णयको मस्यौदा</td>\n</tr>\n<tr>\n<td>२</td>\n<td>वार्षिक नीति, कार्यक्रम तथा बजेट प्रस्तुति</td>\n<td>का</td>\n<td>बजेटको सरल नागरिक सारांश, मन्तव्य, सम्भावित प्रश्नोत्तर</td>\n</tr>\n<tr>\n<td>३</td>\n<td>प्रदेश, संघ र साझेदार निकायमा पत्राचार</td>\n<td>का</td>\n<td>औपचारिक पत्र र बजेट माग पत्रको मस्यौदा</td>\n</tr>\n<tr>\n<td>४</td>\n<td>उपाध्यक्ष: न्यायिक समितिको सुनुवाइ र मेलमिलाप</td>\n<td>का</td>\n<td>नाम नखुलाई विवादको तटस्थ सारांश, सूचना, मेलमिलापका विकल्प</td>\n</tr>\n<tr>\n<td>५</td>\n<td>उपाध्यक्ष: अनुगमन, राजस्व परामर्श र बजेट सीमा निर्धारण समिति</td>\n<td>का</td>\n<td>अनुगमन जाँचसूची, स्थलगत प्रतिवेदन, कर र शुल्कको सरल व्याख्या</td>\n</tr>\n<tr>\n<td>६</td>\n<td>उद्घाटन, शिलान्यास र आयोजना हस्तान्तरण</td>\n<td>सा</td>\n<td>छोटो मन्तव्य, कार्यक्रम सञ्चालन क्रम</td>\n</tr>\n<tr>\n<td>७</td>\n<td>चाडपर्व र राष्ट्रिय दिवस</td>\n<td>सा</td>\n<td>शुभकामना सन्देश, मन्तव्य, कार्यक्रमको सूचना</td>\n</tr>\n<tr>\n<td>८</td>\n<td>नागरिक, प्रतिनिधिमण्डलसँग भेटघाट; सार्वजनिक सुनुवाइ</td>\n<td>सा</td>\n<td>भेटअघिको टिपोट, प्रतिबद्धताको अनुगमन सूची</td>\n</tr>\n<tr>\n<td>९</td>\n<td>सञ्चारमाध्यमसँग अन्तर्वार्ता र प्रेस विज्ञप्ति</td>\n<td>सं</td>\n<td>प्रेस विज्ञप्ति, बोल्ने मुख्य बुँदा</td>\n</tr>\n<tr>\n<td>१०</td>\n<td>गाउँपालिकाको फेसबुक पेज सञ्चालन</td>\n<td>सं</td>\n<td>नेपाली र स्थानीय भाषामा पोस्ट, साप्ताहिक सामग्री योजना</td>\n</tr>\n</tbody>\n</table></div>\n<h3>समूह (ख): वडाध्यक्षहरू</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>काम</strong></th>\n<th><strong>प्रकार</strong></th>\n<th><strong>AI ले कसरी सघाउँछ</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td>वडा समितिको बैठक सञ्चालन</td>\n<td>का</td>\n<td>कार्यसूची, बोलेका टिपोटबाट माइन्युट</td>\n</tr>\n<tr>\n<td>२</td>\n<td>सिफारिस दिने काम</td>\n<td>का</td>\n<td>आधिकारिक ढाँचासँग मिल्ने नमूना, नागरिकलाई चाहिने कागजातको सूची</td>\n</tr>\n<tr>\n<td>३</td>\n<td>व्यक्तिगत घटना दर्ता र सामाजिक सुरक्षा भत्ता</td>\n<td>का</td>\n<td>नागरिकका लागि सरल जानकारी, नवीकरणको सम्झना सूचना</td>\n</tr>\n<tr>\n<td>४</td>\n<td>वार्षिक योजनाका लागि टोल तथा वडा भेला</td>\n<td>सा</td>\n<td>भेलाको सूचना, आएका माग क्षेत्र र लागत अनुसार मिलाउने</td>\n</tr>\n<tr>\n<td>५</td>\n<td>उपभोक्ता समितिका आयोजनाको अनुगमन</td>\n<td>का</td>\n<td>जाँचसूची, स्थलगत प्रतिवेदन</td>\n</tr>\n<tr>\n<td>६</td>\n<td>गाउँपालिकामा वडाको प्रगति प्रतिवेदन</td>\n<td>का</td>\n<td>टिपोटबाट व्यवस्थित प्रतिवेदन</td>\n</tr>\n<tr>\n<td>७</td>\n<td>स्थानीय विवाद र गुनासो</td>\n<td>का</td>\n<td>तटस्थ सारांश, न्यायिक समितिमा पठाउने पत्र</td>\n</tr>\n<tr>\n<td>८</td>\n<td>विपद् पूर्वतयारी र प्रतिकार्य</td>\n<td>सा</td>\n<td>सचेतना सन्देश, माइकिङको पाठ, क्षति विवरण फाराम</td>\n</tr>\n<tr>\n<td>९</td>\n<td>स्वास्थ्य शिविर, सरसफाइ अभियान, विद्यालय कार्यक्रम</td>\n<td>सा</td>\n<td>सूचना, मन्तव्य, स्वयंसेवकको कार्य विभाजन</td>\n</tr>\n<tr>\n<td>१०</td>\n<td>वडाको फेसबुक पेज र भाइबर समूह</td>\n<td>सं</td>\n<td>दैनिक सूचना, अनुवाद, बारम्बार सोधिने प्रश्नको जवाफ</td>\n</tr>\n</tbody>\n</table></div>\n<h3>समूह (ग): गाउँ कार्यपालिका सदस्यहरू</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>काम</strong></th>\n<th><strong>प्रकार</strong></th>\n<th><strong>AI ले कसरी सघाउँछ</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td>कार्यपालिका बैठकका प्रस्ताव अध्ययन</td>\n<td>का</td>\n<td>प्रस्तावको उद्देश्य, लागत, फाइदा, जोखिम र प्रश्नसहितको सारांश</td>\n</tr>\n<tr>\n<td>२</td>\n<td>विषयगत समितिको काम</td>\n<td>का</td>\n<td>कार्यसूची, माइन्युट, सिफारिस प्रतिवेदन</td>\n</tr>\n<tr>\n<td>३</td>\n<td>वार्षिक बजेटका लागि आयोजना छनौट</td>\n<td>का</td>\n<td>आधार तय गरेर विकल्पहरूको तुलनात्मक तालिका</td>\n</tr>\n<tr>\n<td>४</td>\n<td>ऐन, कार्यविधि र निर्देशिकाको मस्यौदा अध्ययन</td>\n<td>का</td>\n<td>सरल व्याख्या, संशोधन गर्नुपर्ने बुँदा</td>\n</tr>\n<tr>\n<td>५</td>\n<td>आफ्नो क्षेत्रको स्थलगत अनुगमन</td>\n<td>का</td>\n<td>जाँचसूची, बोलेका टिपोटबाट प्रतिवेदन</td>\n</tr>\n<tr>\n<td>६</td>\n<td>स्वास्थ्य चौकी, विद्यालय, कृषि शाखासँग समन्वय</td>\n<td>का</td>\n<td>पत्र, बैठकको अनुरोध, काम गर्नुपर्ने सूची</td>\n</tr>\n<tr>\n<td>७</td>\n<td>क्षेत्रगत कार्यक्रम: कृषक तालिम, स्वास्थ्य सचेतना</td>\n<td>सा</td>\n<td>अवधारणा पत्र, निमन्त्रणा, मन्तव्य</td>\n</tr>\n<tr>\n<td>८</td>\n<td>उपभोक्ता समूह, सहकारी, गैरसरकारी संस्थासँग बैठक</td>\n<td>सा</td>\n<td>बैठकअघिको टिपोट, सहमतिको अभिलेख</td>\n</tr>\n<tr>\n<td>९</td>\n<td>कार्यपालिका र सभामा प्रतिवेदन</td>\n<td>का</td>\n<td>छोटो प्रगति प्रतिवेदन</td>\n</tr>\n<tr>\n<td>१०</td>\n<td>क्षेत्रगत जानकारी सामाजिक सञ्जालमा</td>\n<td>सं</td>\n<td>योजना र समयसीमाबारे पोस्ट, पोस्टरका लागि पाठ</td>\n</tr>\n</tbody>\n</table></div>\n<h3>समूह (घ): महिला तथा दलित\nमहिला सदस्यसहित वडा सदस्यहरू</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>काम</strong></th>\n<th><strong>प्रकार</strong></th>\n<th><strong>AI ले कसरी सघाउँछ</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td>वडा समितिको बैठकमा सहभागिता</td>\n<td>का</td>\n<td>उठाउनुपर्ने बुँदा, कार्यसूचीको सरल सारांश</td>\n</tr>\n<tr>\n<td>२</td>\n<td>टोलका समस्या सङ्कलन</td>\n<td>का</td>\n<td>बोलेरै समस्या टिप्ने, व्यवस्थित सूची बनाउने</td>\n</tr>\n<tr>\n<td>३</td>\n<td>महिला, दलित, ज्येष्ठ नागरिक र अपाङ्गता भएका व्यक्तिको प्रतिनिधित्व</td>\n<td>का / सा</td>\n<td>तथ्यमा आधारित तर्क, छोटो मन्तव्य</td>\n</tr>\n<tr>\n<td>४</td>\n<td>भेलाका लागि नागरिक परिचालन</td>\n<td>सा</td>\n<td>निमन्त्रणा, माइकिङको पाठ</td>\n</tr>\n<tr>\n<td>५</td>\n<td>उपभोक्ता समितिको कामको अनुगमन</td>\n<td>का</td>\n<td>सरल जाँचसूची, वडाध्यक्षलाई छोटो प्रतिवेदन</td>\n</tr>\n<tr>\n<td>६</td>\n<td>नागरिकलाई सेवा लिन सहयोग</td>\n<td>का</td>\n<td>आवश्यक कागजात र प्रक्रियाको सरल जानकारी</td>\n</tr>\n<tr>\n<td>७</td>\n<td>सचेतना अभियान: स्वास्थ्य, बालविवाह, बचत</td>\n<td>सा</td>\n<td>सन्देश, माइकिङ पाठ, स्थानीय भाषामा अनुवाद</td>\n</tr>\n<tr>\n<td>८</td>\n<td>आमा समूह, महिला समूह र सहकारीलाई सहयोग</td>\n<td>सा</td>\n<td>माइन्युट, सानो प्रस्ताव</td>\n</tr>\n<tr>\n<td>९</td>\n<td>बस्तीमा विपद्का बेला सहयोग</td>\n<td>सा</td>\n<td>सचेतना सन्देश (घरधुरीको सूची AI मा नहाल्ने)</td>\n</tr>\n<tr>\n<td>१०</td>\n<td>फेसबुक र भाइबरमा वडाको सूचना</td>\n<td>सं</td>\n<td>छोटो र स्पष्ट पोस्ट</td>\n</tr>\n</tbody>\n</table></div>","use":"सत्र ४"},{"id":"m6","n":"६","short":"सामग्री ६","title":"पदअनुसार अभ्यास कार्ड (सत्र ४)","html":"<p>कम्तीमा ३ वटा कार्ड पूरा गर्नुहोस्। त्यसपछि छेउको साथीसँग मोबाइल साटेर एकअर्काको\nकाम जाँच्नुहोस्।</p>\n<p><strong>समूह (क): अध्यक्ष र उपाध्यक्ष</strong></p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />क१. कुनै वडामा नयाँ बर्थिङ सेन्टर उद्घाटन\nगर्दा बोल्ने ३ मिनेटको मन्तव्य तयार पार्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />क२. कार्यक्रमको कागजातका २ पानाको फोटो\nखिचेर कार्यपालिका बैठकका लागि ५ मुख्य बुँदा निकाल्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />क३. (उपाध्यक्ष) दुई छिमेकीबीचको काल्पनिक\nसिमाना विवादको तटस्थ सारांश र मेलमिलापका ३ विकल्प तयार पार्नुहोस्। वास्तविक नाम\nप्रयोग नगर्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />क४. ढिलो भइरहेको सडक आयोजनाबारे प्रमुख\nप्रशासकीय अधिकृतलाई सोध्ने ५ प्रश्न तयार पार्नुहोस्।</label></li>\n</ul>\n<p><strong>समूह (ख): वडाध्यक्षहरू</strong></p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />ख१. आगामी वर्षको योजना छलफलका लागि\nटोल भेलाको सूचना लेख्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />ख२. यी मागलाई क्षेत्र अनुसार तालिकामा\nमिलाउनुहोस्: खानेपानी ट्याङ्की, विद्यालयको शौचालय, कृषि सडक, सिँचाइ कुलो, महिला\nतालिम, मन्दिर पर्खाल, गोरेटो मर्मत।</label></li>\n<li><label><input type=\"checkbox\" />ख३. वर्षायाममा पहिरोबाट सजग रहन फेसबुक\nपोस्ट र ३० सेकेन्डको माइकिङ पाठ तयार पार्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />ख४. बसोबास सिफारिसको नमूना तयार\nपार्नुहोस् र आधिकारिक ढाँचासँग भिडाउनुपर्ने कुराको सूची बनाउनुहोस्।</label></li>\n</ul>\n<p><strong>समूह (ग): गाउँ कार्यपालिका सदस्यहरू</strong></p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />ग१. सहजकर्ताले दिएको प्रस्तावको सारांश\nबनाउनुहोस्: फाइदा, जोखिम र लागतसम्बन्धी प्रश्न।</label></li>\n<li><label><input type=\"checkbox\" />ग२. काल्पनिक स्थलगत भ्रमणको टिपोट बोलेर\nसमितिको प्रतिवेदन तयार पार्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />ग३. कृषि सडक ग्राभेल र खानेपानी योजनाबीच\n५ आधारमा तुलना गर्ने तालिका बनाउनुहोस्।</label></li>\n</ul>\n<p><strong>समूह (घ): वडा सदस्यहरू</strong></p>\n<ul class=\"task-list\">\n<li><label><input type=\"checkbox\" />घ१. आफ्नो टोलका ३ समस्या नेपालीमा बोलेर\nवडाध्यक्षलाई बुझाउने लिखित प्रतिवेदन बनाउनुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />घ२. महिला उद्यमशीलता तालिमका लागि बजेट\nमाग गर्ने २ मिनेटको मन्तव्य तयार पार्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />घ३. ज्येष्ठ नागरिक भत्ताबारे सरल नेपाली र\nएउटा स्थानीय भाषामा सचेतना सन्देश तयार पार्नुहोस्।</label></li>\n<li><label><input type=\"checkbox\" />घ४. उपभोक्ता समितिले बनाउँदै गरेको सडकको\nअनुगमनका लागि १० बुँदे जाँचसूची बनाउनुहोस्।</label></li>\n</ul>","use":"सत्र ४"},{"id":"m7","n":"७","short":"सामग्री ७","title":"आयोजना छनौट अभ्यास पुस्तिका","html":"<p>तपाईंको टोलीले <strong>…………….. पालिका, वडा नं. ४</strong> को वडा समितिको\nभूमिका निर्वाह गर्नेछ। यसमा उल्लेखित नाम, अङ्क र नियम <strong>काल्पनिक हुन्,\nअभ्यासका लागि मात्र तयार गरिएका हुन्।</strong></p>\n<h3>पृष्ठभूमि</h3>\n<p>अहिले २०८३ फागुन महिना हो। स्रोत अनुमान तथा बजेट सीमा निर्धारण समितिले आर्थिक\nवर्ष २०८४/८५ का लागि वडालाई बजेट सीमा पठाइसकेको छ। टोल भेलाहरू सम्पन्न भइसकेका\nछन्। अब वडा समितिले १० दिनभित्र प्राथमिकता क्रमसहितको आयोजना सूची गाउँपालिकामा\nपठाउनुपर्नेछ।</p>\n<p><strong>योजना तर्जुमाका ७ चरण</strong> (स्थानीय तहको वार्षिक योजना तथा\nबजेट तर्जुमा दिग्दर्शन अनुसार): (१) स्रोत अनुमान तथा बजेट सीमा निर्धारण, (२)\nबस्ती/टोल स्तरबाट योजना छनौट, (३) वडास्तरीय योजना प्राथमिकीकरण, (४) बजेट तथा\nकार्यक्रम तर्जुमा समितिमा छलफल, (५) गाउँ कार्यपालिकाबाट स्वीकृति, (६) गाउँ सभामा\nपेश र (७) गाउँ सभाबाट स्वीकृति। <strong>आजको अभ्यासमा तपाईंहरूले चरण २, ३ र ६ को\nकाम गर्नुहुनेछ।</strong></p>\n<h3>बजेट परिपत्र (काल्पनिक)</h3>\n<ul>\n<li>वडास्तरीय पूँजीगत बजेटको सीमा: <strong>रु. ९० लाख</strong>।</li>\n<li>लक्षित कार्यक्रमबाहेक रु. ३ लाखभन्दा साना आयोजना नराख्ने (टुक्रे योजना\nनहुने)।</li>\n<li>रु. ५० लाखभन्दा बढी लागतका वा एकभन्दा बढी वडालाई समेट्ने आयोजना गाउँपालिका\nस्तरमा पठाउने।</li>\n<li>वडाको बजेटको कम्तीमा <strong>१५ प्रतिशत</strong> लक्षित कार्यक्रम (महिला,\nदलित, अपाङ्गता भएका व्यक्ति, ज्येष्ठ नागरिक, बालबालिका) मा छुट्याउनुपर्ने।</li>\n<li>पूर्वाधार आयोजनामा उपभोक्ता समितिको कम्तीमा १० प्रतिशत नगद वा श्रमदान\nयोगदान हुनुपर्ने।</li>\n<li>वडाको आवधिक योजनाका प्राथमिकता: खानेपानी, कृषि तथा सिँचाइ, र विपद्\nसुरक्षा।</li>\n</ul>\n<h3>टोल भेलाबाट आएका मागहरू</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>माग</strong></th>\n<th><strong>टोल</strong></th>\n<th><strong>क्षेत्र</strong></th>\n<th><strong>लागत (रु. लाख)</strong></th>\n<th><strong>लाभान्वित घरधुरी</strong></th>\n<th><strong>भेलामा आएको कुरा</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td>भन्ज्याङसम्मको २.५ कि.मि. कृषि सडक ग्राभेल</td>\n<td>कालिका टोल</td>\n<td>सडक</td>\n<td>३२</td>\n<td>१४०</td>\n<td>लागत अनुमान तयार; उपभोक्ताले १०% श्रमदान गर्ने</td>\n</tr>\n<tr>\n<td>२</td>\n<td>खानेपानी ट्याङ्की र पाइपलाइन मर्मत</td>\n<td>सिद्धबाबा टोल</td>\n<td>खानेपानी</td>\n<td>१४</td>\n<td>४८ (३२ दलित)</td>\n<td>गएको सुख्खा याममा मुहान सुकेको; महिला ४० मिनेट हिँडेर पानी ल्याउँछन्</td>\n</tr>\n<tr>\n<td>३</td>\n<td>खोलामा मोटरबाटो झोलुङ्गे पुल</td>\n<td>दोभान</td>\n<td>पुल</td>\n<td>१२०</td>\n<td>४०० (३ वटा वडा)</td>\n<td>धेरै वर्षदेखिको माग; डिजाइन बनेको छैन</td>\n</tr>\n<tr>\n<td>४</td>\n<td>वडा कार्यालय भवन विस्तार</td>\n<td>वडा केन्द्र</td>\n<td>कार्यालय</td>\n<td>२५</td>\n<td>(कार्यालय)</td>\n<td>कर्मचारीलाई ठाउँ अपुग</td>\n</tr>\n<tr>\n<td>५</td>\n<td>मन्दिर परिसरको पर्खाल र पाटी</td>\n<td>देउराली</td>\n<td>धार्मिक/सांस्कृतिक</td>\n<td>८</td>\n<td>६०</td>\n<td>मन्दिर समितिले ३०% नगद लगाउने</td>\n</tr>\n<tr>\n<td>६</td>\n<td>३० जना महिलालाई सिलाई तालिम र विउ अनुदान</td>\n<td>सबै टोल</td>\n<td>लक्षित (महिला)</td>\n<td>६</td>\n<td>३०</td>\n<td>महिला समूहको माग; सहकारीले बजारीकरणमा सघाउने</td>\n</tr>\n<tr>\n<td>७</td>\n<td>८०० मिटर सिँचाइ कुलो (ठूलो कुलो) लाइनिङ</td>\n<td>फाँट टोल</td>\n<td>सिँचाइ</td>\n<td>१८</td>\n<td>८५</td>\n<td>कृषक समूह दर्ता; रिसावटले २५% पानी खेर जान्छ</td>\n</tr>\n<tr>\n<td>८</td>\n<td>फुटबल मैदान समतलीकरण</td>\n<td>विद्यालय क्षेत्र</td>\n<td>खेलकुद</td>\n<td>१२</td>\n<td>युवा क्लब (१२० सदस्य)</td>\n<td>जग्गा विद्यालयको</td>\n</tr>\n<tr>\n<td>९</td>\n<td>पहिरो नियन्त्रणका लागि ग्याविन पर्खाल</td>\n<td>बजार बस्ती</td>\n<td>विपद् सुरक्षा</td>\n<td>१५</td>\n<td>२२ (जोखिममा)</td>\n<td>२०८३ को वर्षामा दुई घर चर्किए</td>\n</tr>\n<tr>\n<td>१०</td>\n<td>बजारको ३०० मिटर सडक कालोपत्रे</td>\n<td>वडा केन्द्र</td>\n<td>सडक</td>\n<td>३०</td>\n<td>७०</td>\n<td>पसलेहरूको जोडदार दबाब</td>\n</tr>\n<tr>\n<td>११</td>\n<td>स्वास्थ्य चौकीमा र्याम्प, रेलिङ र ज्येष्ठ नागरिकका लागि प्रतीक्षालय</td>\n<td>वडा केन्द्र</td>\n<td>लक्षित (अपाङ्गता, ज्येष्ठ)</td>\n<td>४</td>\n<td>सिंगो वडा</td>\n<td>स्वास्थ्य चौकी प्रमुखको माग</td>\n</tr>\n<tr>\n<td>१२</td>\n<td>रु. १ लाखका दरले १ </th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>आवश्यकता, तात्कालिकता र सुरक्षा</td>\n<td>२०</td>\n<td>जीउधनको जोखिम; आधारभूत सेवा नभएको</td>\n</tr>\n<tr>\n<td>लाभान्वित संख्या र प्रति घरधुरी लागत</td>\n<td>१५</td>\n<td>धेरै घरधुरी, कम लागत</td>\n</tr>\n<tr>\n<td>लैङ्गिक समानता तथा सामाजिक समावेशीकरण</td>\n<td>१५</td>\n<td>महिला, दलित, अपाङ्गता, ज्येष्ठ नागरिक वा बालबालिकालाई प्रत्यक्ष लाभ</td>\n</tr>\n<tr>\n<td>आवधिक योजना र दिगो विकास लक्ष्यसँग तालमेल</td>\n<td>१०</td>\n<td>खानेपानी, सिँचाइ, विपद् सुरक्षा</td>\n</tr>\n<tr>\n<td>तयारीको अवस्था</td>\n<td>१०</td>\n<td>लागत अनुमान, जग्गा र उपभोक्ता समिति तयार</td>\n</tr>\n<tr>\n<td>सामुदायिक योगदान</td>\n<td>१०</td>\n<td>१०% भन्दा बढी योगदान</td>\n</tr>\n<tr>\n<td>जलवायु र विपद् उत्थानशीलता</td>\n<td>१०</td>\n<td>पहिरो, खडेरी वा बाढीको जोखिम घटाउने</td>\n</tr>\n<tr>\n<td>दिगोपन (सञ्चालन र मर्मत)</td>\n<td>१०</td>\n<td>स्पष्ट जिम्मेवारी र मर्मत योजना</td>\n</tr>\n</tbody>\n</table></div>\n<h3>कार्यपाना: हाम्रो अन्तिम सूची</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>प्राथमिकता क्रम</strong></th>\n<th><strong>आयोजना</strong></th>\n<th><strong>अङ्क</strong></th>\n<th><strong>लागत (रु. लाख)</strong></th>\n<th><strong>लक्षित? (हो/होइन)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>२</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>३</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>४</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>५</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>६</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>७</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>जम्मा</strong></td>\n<td></td>\n<td></td>\n<td><strong>९० भन्दा नबढी</strong></td>\n<td><strong>लक्षित प्रतिशत: ___ (१५% वा बढी)</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>अर्को तहमा पठाइएका, गाभिएका वा हटाइएका माग\n(कारणसहित):</strong> ______________________________</p>","use":"सत्र ६"},{"id":"m8","n":"८","short":"सामग्री ८","title":"सार्वजनिक पदमा रहेर AI को जिम्मेवार प्रयोग","html":"<p><strong>मूल मन्त्र: AI ले मस्यौदा गर्छ; निर्णय र हस्ताक्षर\nजनप्रतिनिधिकै।</strong></p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>गर्नुहोस्</strong></th>\n<th><strong>नगर्नुहोस्</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>हरेक मिति, अङ्क, नाम र ऐनको उल्लेख आधिकारिक कागजातसँग भिडाउनुहोस्</td>\n<td>AI ले लेखेको कुरा पूरा नपढी सार्वजनिक नगर्नुहोस्, हस्ताक्षर नगर्नुहोस्</td>\n</tr>\n<tr>\n<td>पाठ टाँस्नुअघि नाम, नागरिकता नम्बर, फोन नम्बर र ठेगाना हटाउनुहोस्</td>\n<td>नागरिकको व्यक्तिगत विवरण, गुनासो वा कार्यपालिकाको गोप्य निर्णय AI मा\nनहाल्नुहोस्</td>\n</tr>\n<tr>\n<td>चिठी र सिफारिसमा आधिकारिक ढाँचाकै प्रयोग गर्नुहोस्</td>\n<td>कसलाई सिफारिस, अनुदान वा आयोजना दिने भन्ने निर्णय AI लाई नसुम्पिनुहोस्</td>\n</tr>\n<tr>\n<td>AI लाई \"यसमा मैले के–के कुरा जाँच्नुपर्छ?\" भनेर सोध्नुहोस्</td>\n<td>भर्खरका घटना, स्थानीय तथ्य वा बजेटका ठ्याक्कै अङ्कमा AI को भर नपर्नुहोस्</td>\n</tr>\n<tr>\n<td>महत्त्वपूर्ण मस्यौदा कर्मचारी, साथी वा प्रमुख प्रशासकीय अधिकृतलाई एकपटक हेर्न\nलगाउनुहोस्</td>\n<td>कसैको नक्कली तस्बिर, नक्कली भनाइ वा भ्रमपूर्ण पोस्ट नबनाउनुहोस्</td>\n</tr>\n<tr>\n<td>सरल र स्थानीय भाषामा धेरै नागरिकसम्म पुग्न AI प्रयोग गर्नुहोस्</td>\n<td>कार्यालयको काममा गरिएको AI प्रयोग दलगत प्रचारमा नलगाउनुहोस्</td>\n</tr>\n<tr>\n<td>साझा मोबाइलमा AI खाताबाट लगआउट गर्नुहोस्</td>\n<td>पासवर्ड अरूसँग साट्नुहोस्</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>कानुनी आधार:</strong> नेपालको संविधानको धारा २८ (गोपनीयताको हक)\n· वैयक्तिक गोपनीयता ऐन, २०७५ · विद्युतीय कारोबार ऐन, २०६३ · स्थानीय सरकार\nसञ्चालन ऐन, २०७४ · राष्ट्रिय कृत्रिम बुद्धिमत्ता नीति, २०८२</p>\n<h3>घटना छलफल (जोडीमा)</h3>\n<ol>\n<li>एक जना वडाध्यक्षले सिफारिस लेखाउन नागरिकको पूरा नाम, नागरिकता नम्बर र जग्गा\nविवादको विवरण AI मा हाल्नुभयो। कहाँ चुक भयो? यसको सट्टा के गर्नुपर्थ्यो?</li>\n<li>AI ले लेखेको प्रेस विज्ञप्तिमा गाउँपालिकाको बजेटको अङ्क गलत आयो र फेसबुकमा पनि\nराखियो। अब जिम्मेवार को? तुरुन्त के गर्नुपर्छ?</li>\n</ol>\n<h3>गल्ती पत्ता लगाउनुहोस्:\nAI ले लेखेको यो सूचनामा ३ वटा गल्ती छन्</h3>\n<blockquote>\n<p><strong>सूचना</strong></p>\n<p>……………… पालिका, वडा नं. ४ कार्यालयको आयोजनामा राष्ट्रिय सरसफाइ अभियान\nअन्तर्गत २०८३ कार्तिक ३२ गते बिहान ८ बजेदेखि वडाका सबै टोलमा सरसफाइ कार्यक्रम\nसञ्चालन गरिने भएकोले सम्पूर्ण बासिन्दाहरूलाई सहभागी हुन अनुरोध गरिन्छ। स्थानीय\nसरसफाइ ऐन, २०८० अनुसार सहभागी नहुने घरधुरीलाई जरिवाना हुनेछ।</p>\n<p>वडाध्यक्ष</p>\n</blockquote>\n<p>गल्ती १: ______________ गल्ती २: ______________ गल्ती ३:\n______________</p>","use":"सत्र ५"},{"id":"m9","n":"९","short":"सामग्री ९","title":"AI प्रयोग प्रतिबद्धता पत्र","html":"<p>हामी जनप्रतिनिधिहरू आफ्नो सार्वजनिक जिम्मेवारी निर्वाह गर्दा AI प्रयोग गर्ने\nक्रममा देहायका कुराहरू पालना गर्ने प्रतिबद्धता व्यक्त गर्दछौं:</p>\n<ol>\n<li>AI ले तयार पारेको हरेक मस्यौदा प्रयोग, हस्ताक्षर वा प्रकाशन गर्नुअघि राम्रोसँग\nपढ्ने र जाँच्नेछौं।</li>\n<li>नागरिकको व्यक्तिगत वा गोप्य विवरण कहिल्यै AI मा हाल्ने छैनौं।</li>\n<li>सबै निर्णय हामी आफैं गर्नेछौं; AI लाई तयारीका लागि सहयोगीका रूपमा मात्र प्रयोग\nगर्नेछौं।</li>\n<li>आधिकारिक ढाँचा प्रयोग गर्नेछौं र ऐन, मिति तथा अङ्क आधिकारिक स्रोतबाट भिडाएर\nमात्र प्रयोग गर्नेछौं।</li>\n<li>महिला, दलित, पछाडि परेका वर्ग र स्थानीय भाषा बोल्ने नागरिकसहित सबैलाई समान\nरूपमा सेवा पुर्याउन AI प्रयोग गर्नेछौं।</li>\n<li>कसैका बारेमा गलत वा भ्रमपूर्ण सामग्री बनाउन AI प्रयोग गर्ने छैनौं।</li>\n<li>\"………… AI सहायता\" समूहमार्फत साथीहरूसँग राम्रा अभ्यास साटासाट गर्नेछौं।</li>\n</ol>\n<p>मिति: २०८३ कात्तिक २७</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>क्र.सं.</strong></th>\n<th><strong>नामथर</strong></th>\n<th><strong>पद र वडा</strong></th>\n<th><strong>हस्ताक्षर</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>२</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>३</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p><em>(छाप्दा सहभागी संख्या अनुसार तालिकाको लहर थप्नुहोस्।)</em></p>","use":"सत्र ७"},{"id":"m10","n":"१०","short":"सामग्री १०","title":"मेरो ३० दिने AI कार्ययोजना","html":"<p>नाम: ____________ पद र वडा: ____________</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><strong>AI प्रयोग गरेर गर्ने काम</strong></th>\n<th><strong>कति पटक</strong></th>\n<th><strong>नतिजा कसले जाँच्ने</strong></th>\n<th><strong>कहिलेसम्म (मिति)</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>१.</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>२.</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>३.</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>मैले AI मा कहिल्यै नहाल्ने एउटा कुरा: ______________________________</p>\n<p>३० दिनपछिको पुनर्ताजगी बैठकअघि आफूले गरेको एउटा काम भाइबर समूहमा साझा\nगर्नुहोस्।</p>","use":"सत्र ७"},{"id":"m11","n":"११","short":"सामग्री ११","title":"प्रश्नावली (कार्यशालाअघि र पछि)","html":"<p>सहभागी नम्बर: ______ ☐ कार्यशालाअघि ☐ कार्यशालापछि</p>\n<ol>\n<li>AI च्याट उपकरणले सधैं सही उत्तर दिन्छ। ☐ ठिक ☐ गलत</li>\n<li>तलकामध्ये AI मा हाल्न सुरक्षित कुन हो?\n<ol>\n<li>(क) नागरिकको नाम र नागरिकता नम्बर</li>\n<li>(ख) व्यक्तिगत विवरण नभएको सार्वजनिक सूचनाको मस्यौदा</li>\n<li>(ग) गाउँ कार्यपालिकाको गोप्य निर्णय</li>\n</ol></li>\n<li>कुन प्रम्प्टले राम्रो उत्तर दिन्छ?\n<ol>\n<li>(क) सूचना लेख।</li>\n<li>(ख) तपाईं गाउँपालिकाको सञ्चार अधिकृत हो। वडा नं. ४ मा हुने सरसफाइ अभियानको\nसूचना मिति र स्थानसहित १०० शब्दभित्र सरल भाषामा लेखिदिनुहोस्।</li>\n</ol></li>\n<li>AI ले लेखेको सूचनामा गलत मिति छापियो भने जिम्मेवार को हुन्छ?\n<ol>\n<li>(क) AI बनाउने कम्पनी</li>\n<li>(ख) सूचना जारी गर्ने जनप्रतिनिधि वा कार्यालय</li>\n<li>(ग) कोही पनि होइन</li>\n</ol></li>\n<li>आफ्नो पदको कुन काममा AI ले समय बचाउन सक्छ? एउटा उदाहरण लेख्नुहोस्:\n______________________</li>\n</ol>","use":"उद्घाटन र समापन"},{"id":"m12","n":"१२","short":"सामग्री १२","title":"पृष्ठपोषण फाराम","html":"<p>हरेक पङ्क्तिमा एउटा कोठामा ठिक चिन्ह लगाउनुहोस् (१ = कमजोर, ५ = धेरै\nर <script>
/* Same shell as the employee materials (../index.html): running order on the left, the selected session's materials on the right. */
if (!window.D_REP || !window.WS) throw new Error("representative page: missing " + window.__REP_MISSING);
const DATA = window.D_REP;
const DEV = '०१२३४५६७८९';
const dn = s => String(s).replace(/[0-9]/g, d => DEV[d]);
const tm = (a, b) => dn(a) + '–' + dn(b);
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = Object.fromEntries(DATA.SESS.map(s => [s.id, s]));
const M = Object.fromEntries(DATA.MATS.map(m => [m.id, m]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('ai-rep-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ai-rep-' + k, JSON.stringify(v)); } catch (e) {} },
};
let done = new Set(store.get('done', []));
const DAY = DATA.DAYS[0];
const ASSESS = '../assessment/index.html';

function itemOf(id) { for (const it of DAY.items) if (it.id === id) return it; return null; }
function nkTime() {
  try {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    return +p.find(x => x.type === 'hour').value * 60 + +p.find(x => x.type === 'minute').value;
  } catch (e) { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
}
function nowNext() {
  const t = nkTime(); let now = null, next = null;
  for (const it of DAY.items) {
    if (toMin(it.start) <= t && t < toMin(it.end)) now = it;
    else if (toMin(it.start) > t && !next) next = it;
  }
  return { now, next, t };
}
function titleOf(it) { return it.kind === 'session' ? 'सत्र ' + S[it.id].n + ': ' + S[it.id].title : it.kind === 'other' ? DATA.OTHER[it.id].title : it.title; }
const matCard = id => `<a class="card" href="#${id}"><span class="k">${M[id].short}</span><b>${M[id].title}</b><span class="s">${M[id].use}</span></a>`;
const TOOLS = {
  calc: { k: 'सामग्री ७', t: 'आयोजना छनौट क्याल्कुलेटर', s: 'बजेट सीमा, नियम र अङ्कका आधारमा सूची' },
  feedback: { k: 'सामग्री १२', t: 'पृष्ठपोषण फाराम', s: 'अनलाइन पठाउनुहोस्' },
};
const toolCard = k => `<a class="card" href="#${k}"><span class="k">${TOOLS[k].k}</span><b>${TOOLS[k].t}</b><span class="s">${TOOLS[k].s}</span></a>`;
const assessCard = kind => `<a class="card" href="${ASSESS}"><span class="k">${kind === 'pre' ? 'पूर्व–परीक्षा' : 'पश्च–परीक्षा'}</span><b>AI ज्ञान परीक्षा</b><span class="s">इभेन्ट कोड प्रशिक्षकबाट पाउनुहोस्</span></a>`;

/* ---------- sidebar ---------- */
function renderSide(cur) {
  const nn = nowNext();
  const on = ids => ids.includes(cur) ? 'aria-current="page"' : '';
  let h = `<div class="nav-links">
    <a data-home href="/workshop/index.html" hidden>⌂ गृहपृष्ठ</a>
    <a href="#home" ${on(['home'])}>ड्यासबोर्ड</a>
    <a href="#agenda" ${on(['agenda'])}>कार्यशाला कार्ययोजना</a>
    <a href="#resources" ${on(['resources', ...Object.keys(M)])}>सिकाइ सामग्री (१–१२)</a>
    <a href="#calc" ${on(['calc'])}>आयोजना छनौट क्याल्कुलेटर</a>
    <a href="#feedback" ${on(['feedback'])}>पृष्ठपोषण फाराम</a>
    <a href="#handbook" ${on(['handbook'])}>पूरा पुस्तिका (छाप्न / PDF)</a>
    <a href="${ASSESS}">AI ज्ञान परीक्षा</a></div>`;
  h += `<p class="day-h"><b>कार्यशालाको दिन</b><span>${DAY.date}</span></p><ul class="tl">`;
  for (const it of DAY.items) {
    const isNow = nn.now === it;
    if (it.kind === 'break') { h += `<li><span class="brk"><span class="t">${dn(it.start)}</span><span>${it.title}</span><span></span></span></li>`; continue; }
    const chip = isNow ? '<span class="chip now">अहिले</span>' : (done.has(it.id) ? '<span class="chip done">पूरा</span>' : '<span></span>');
    h += `<li><a href="#${it.id}" class="${isNow ? 'is-now' : ''}" ${cur === it.id ? 'aria-current="page"' : ''}><span class="t">${dn(it.start)}</span><span>${titleOf(it)}</span>${chip}</a></li>`;
  }
  $('#side').innerHTML = h + '</ul>';
  if (HOME) EVI.mountHome(HOME);
}

/* ---------- views ---------- */
function vHome() {
  const nn = nowNext();
  const sessDone = DATA.SESS.filter(s => done.has(s.id)).length, total = DATA.SESS.length;
  const slot = (lbl, it, live) => it ? `<a class="slot ${live ? 'live' : ''}" href="#${it.kind === 'break' ? '' : it.id}"><span class="lbl">${lbl}</span><span class="tt">${titleOf(it)}</span><span class="tm">${tm(it.start, it.end)}</span></a>`
    : `<div class="slot"><span class="lbl">${lbl}</span><span class="tt">${live ? (nn.t >= toMin('16:00') ? 'आजको कार्यक्रम सकियो' : 'अहिले कुनै सत्र चलिरहेको छैन') : 'आज थप सत्र छैन'}</span></div>`;
  const dayCol = `<section class="daycol"><h3>कार्यशालाको दिन · ${DAY.date}</h3><p class="th">${DAY.theme}</p>` +
    DAY.items.map(it => it.kind === 'break' ? `<div class="block b"><span class="t">${tm(it.start, it.end)}</span><span>${it.title}</span></div>`
      : `<a class="block" href="#${it.id}"><span class="t">${tm(it.start, it.end)}</span><span>${it.kind === 'session' ? `<span class="n">${S[it.id].n}</span>${S[it.id].title}` : DATA.OTHER[it.id].title}${done.has(it.id) ? ' ✓' : ''}</span></a>`).join('') + '</section>';
  return `<div class="hero"><p class="eyebrow">${ORG ? esc(ORG) : 'पालिका'} · जनप्रतिनिधिहरूका लागि</p>
    <h1>जनप्रतिनिधिका लागि कृत्रिम बुद्धिमत्ता (AI): कार्यदक्षता र प्रभावकारिता अभिवृद्धि कार्यशाला</h1>

let scores = store.get('calc', {});
function calcHtml() {
  return `<section class="tool" id="calcTool"><h3>सामग्री ७ को क्याल्कुलेटर: आयोजना छनौट</h3>
  <p class="note">यो औजारले नियम र अङ्कका आधारमा सूची बनाउँछ। प्रत्येक माग (१३ वटा) को अङ्क टोलीले मापदण्ड अनुसार आफैँ दिनुहोस् (०–१००)। तपाईंको अन्तिम निर्णय र स्थानीय जानकारी नै प्रमुख हुन्।</p>

  <div class="calc-sum">

}
function num(v) { const x = parseFloat(v); return isNaN(x) ? null : x; }
function compute() {
  const rows = DEM.map(d => { const sc = num((scores[d.n] || {}).score); let tgt = (scores[d.n] || {}).t; if (tgt === undefined) tgt = d.t; return { d, score: sc, t: tgt, status: '' }; });
  const pool = [];
  rows.forEach(r => {
    const d = r.d;
    if (d.route || d.cost === null || d.cost > UPPER) { r.status = 'गाउँपालिका/माथिल्लो तहमा पठाउने'; return; }
    if (!r.t && d.cost < MIN_SMALL) { r.status = 'रु. ३ लाखभन्दा सानो (टुक्रे)'; return; }
    if (r.score === null) { r.status = 'अङ्क दिनुहोस्'; return; }
    pool.push(r);
  });
  pool.sort((x, y) => y.score - x.score || x.d.n - y.d.n);
  let used = 0;
  pool.forEach(r => { if (used + r.d.cost <= BUDGET) { used += r.d.cost; r.status = 'छानियो'; } else r.status = 'बजेट बाहिर'; });
  const tgtSum = rows.filter(r => r.status === 'छानियो' && r.t).reduce((s, r) => s + r.d.cost, 0);
  return { rows, used, tgtSum };
}
function calcSummary() {
  const c = compute();
  c.rows.forEach(r => { const el = document.querySelector(`[data-st="${r.d.n}"]`); if (el) { el.textContent = r.status; el.className = r.status === 'छानियो' ? 'st-sel' : 'st-no'; } });
  $('#cTotal').textContent = dn(c.used); $('#cLeft').textContent = dn(BUDGET - c.used);
  $('#cTarget').textContent = dn(c.tgtSum); $('#cTargetPct').textContent = dn(Math.round(c.tgtSum / BUDGET * 100));
  const msg = []; let bad = false;
  if (c.tgtSum < BUDGET * TARGET_MIN_PCT / 100) { msg.push('लक्षित कार्यक्रम अपुग छ: कम्तीमा १५% (रु. १३.५ लाख) पुर्‍याउनुहोस्।'); bad = true; }
  if (c.rows.some(r => r.score === null && !r.d.route && r.d.cost !== null && r.d.cost <= UPPER)) msg.push('सबै मागमा अङ्क दिनुहोस्।');
  if (!msg.length) msg.push('सबै नियम पूरा भयो। जम्मा अङ्क आफैँ जोडेर पुष्टि गर्नुहोस्।');
  $('#calcMsg').className = 'msg ' + (bad ? 'bad' : 'ok'); $('#calcMsg').textContent = msg.join(' ');
}
function mountCalc() {
  const body = $('#calcBody'); if (!body) return;
  const c = compute();
  body.innerHTML = c.rows.map(r => { const d = r.d; return `<tr><td>${dn(d.n)}</td><td>${esc(d.name)}</td><td>${d.cost === null ? 'अनुमान नभएको' : dn(d.cost)}</td><td>${d.hh ? dn(d.hh) : '—'}</td>

  calcSummary();
}

      event_code: $('#fbCode').value.trim().toUpperCase(), ratings,
      best_session: $('#fbBest').value.trim(), improve: $('#fbImprove').value.trim(),
      first_ai_use: $('#fbFirst').value.trim(), recommend: $('#fbRec').checked,
    });
    if (res.error) { fbMsg('पठाउन सकिएन: ' + res.error.message, false); btn.disabled = false; return; }
    $('#fbForm').reset();
    fbMsg('धन्यवाद! तपाईंको पृष्ठपोषण सुरक्षित भयो।', true);
  } catch (err) { fbMsg('पठाउन सकिएन। इन्टरनेट जाँच गरी फेरि प्रयास गर्नुहोस्।', false); }
  btn.disabled = false;
});

/* ---------- routing (same access rule as the employee materials) ---------- */
let MATERIALS_OK = false;
function gateView() {
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">सामग्री निजी छ</p><h1>सामग्री हेर्न खाता चाहिन्छ</h1>
  <p class="meta">यो सामग्री अहिले प्रशिक्षकले सार्वजनिक गरेका छैनन्। स्वीकृत सहभागीहरूले साइन इन गरेर हेर्न सक्छन्।</p>
  <p><a class="btn primary" href="../login.html?next=${encodeURIComponent(location.pathname + location.hash)}">साइन इन / नयाँ दर्ता</a></p></div>`;
}
function route() {
  if (!MATERIALS_OK) { $('#view').innerHTML = gateView(); renderSide('home'); return; }
  const id = (location.hash || '#home').slice(1) || 'home';
  let html, cur = id;
  if (S[id]) html = vSession(S[id]);
  else if (DATA.OTHER[id]) html = vOther(id);
  else if (M[id]) html = vMat(M[id]);
  else if (id === 'resources') html = vResources();
  else if (id === 'agenda') html = vAgenda();
  else if (id === 'handbook') html = vHandbook();
  else if (id === 'calc') html = vCalc();
  else if (id === 'feedback') html = vFeedback();
  else { html = vHome(); cur = 'home'; }
  $('#view').innerHTML = html;
  mountCalc();
  renderSide(cur);
  closeSide();
  window.scrollTo({ top: 0 });
  store.set('last', cur);
}

/* ---------- interactions ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2200); }
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); toast('प्रतिलिपि भयो'); }
  catch (e) { if (el) selectText(el); toast('पाठ छानिएको छ; लामो थिचेर Copy गर्नुहोस्'); }
}
document.addEventListener('click', e => {
  const c = e.target.closest('.copy');
  if (c) { const pre = document.getElementById(c.dataset.copyId); copyText(pre.textContent, pre); return; }
  const m = e.target.closest('.mini-copy');
  if (m) { copyText(m.dataset.copy, m.previousElementSibling); return; }
  const t = e.target.closest('.toggle-done');
  if (t) { const id = t.dataset.sess; done.has(id) ? done.delete(id) : done.add(id); store.set('done', [...done]); route(); return; }
  if (e.target.closest('[data-print]')) { window.print(); return; }
  if (e.target.closest('#calcReset')) { scores = {}; store.set('calc', scores); mountCalc(); return; }
  if (!e.target.closest('.search')) $('#results').hidden = true;
});

/* ---------- organiser, place and dates from the event (../event-info.js) ---------- */
let ORG = '', PLACE = '', EV_RULES = null;
const fillEv = t => EV_RULES ? EVI.fill(t, EV_RULES) : t;
async function applyEvent() {
  const ev = await EVI.resolve('representative');
  if (!ev) return;
  const info = EVI.info(ev);
  ORG = info.org; PLACE = info.place;
  EV_RULES = EVI.representativeRules(info);
  EVI.fillDeep(DATA, EV_RULES, ['SESS', 'OTHER']);
  $('#brandSub').textContent = EVI.fill('जनप्रतिनिधिका लागि · २०८३ कात्तिक २७', EV_RULES);
  if (ORG) document.title = 'जनप्रतिनिधिका लागि AI · ' + ORG;
  buildIndex();
}

/* search */
const INDEX = [];
function buildIndex() {
  INDEX.length = 0;
  const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' '); };
  DATA.SESS.forEach(s => INDEX.push({ id: s.id, title: 'सत्र ' + s.n + ': ' + s.title, text: strip(s.plan.method + ' ' + s.plan.outcome) }));
  DATA.MATS.forEach(m => INDEX.push({ id: m.id, title: m.short + ': ' + m.title, text: strip(m.html) }));
  Object.entries(DATA.OTHER).forEach(([id, o]) => INDEX.push({ id, title: o.title, text: strip(o.plan.method + ' ' + o.plan.outcome) }));
  INDEX.push({ id: 'agenda', title: 'कार्यशाला कार्ययोजना', text: strip(DATA.AGENDA_HTML) });
  INDEX.push({ id: 'calc', title: 'आयोजना छनौट क्याल्कुलेटर', text: DEM.map(d => d.name).join(' ') });
  INDEX.push({ id: 'feedback', title: 'पृष्ठपोषण फाराम', text: QS.join(' ') });
}
buildIndex();
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#results');
  if (q.length < 2) { box.hidden = true; return; }
  const hits = [];
  for (const it of INDEX) {
    const i = it.text.toLowerCase().indexOf(q), inT = it.title.toLowerCase().includes(q);
    if (i < 0 && !inT) continue;
    hits.push({ ...it, snip: i < 0 ? '' : '…' + it.text.slice(Math.max(0, i - 40), i + 70) + '…', score: inT ? 0 : 1 });
  }
  hits.sort((a, b) => a.score - b.score);
  box.innerHTML = hits.length ? hits.slice(0, 12).map(h => `<a href="#${h.id}"><b>${h.title}</b><small></small></a>`).join('') : '<p style="padding:8px 10px;margin:0;color:var(--muted)">केही भेटिएन।</p>';
  box.querySelectorAll('small').forEach((s, k) => s.textContent = hits[k].snip);
  box.hidden = false;
});
$('#results').addEventListener('click', e => { if (e.target.closest('a')) { $('#results').hidden = true; $('#q').value = ''; } });

/* drawer */
function closeSide() { $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
$('#menuBtn').addEventListener('click', () => { const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', String(o)); });

window.addEventListener('hashchange', route);
/* Start-up. Never leave the page blank: show "loading" at once, give the database a few seconds,
   and if it does not answer, say so with a retry button. Event details (organiser, place, dates)
   are filled in after the first draw so they never hold the page back. */
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const LOADING = '<p class="eyebrow" style="margin-top:20px">लोड हुँदैछ…</p>';
function slowView() {
  return `<div class="wrap" style="padding-top:20px"><p class="eyebrow">जडानमा ढिलाइ</p><h1>सामग्री लोड हुन सकेन</h1>
  <p class="meta">सर्भरसँगको जडान ढिलो छ वा टुटेको छ। इन्टरनेट जाँचेर फेरि प्रयास गर्नुहोस्।</p>
  <p><button class="btn primary" data-retry>फेरि प्रयास गर्नुहोस्</button></p></div>`;
}
let EVENT_DONE = false;
let HOME = null;
async function start() {
  $('#view').innerHTML = LOADING;
  let ok;
  try {
    await withTimeout(WS.init(), 7000);
    ok = (await withTimeout(WS.materialsPublic(), 7000)) || WS.isApproved() || WS.isTrainer();
  } catch (e) { ok = e && e.message === 'timeout' ? null : false; }
  if (ok === null) { $('#view').innerHTML = slowView(); renderSide('home'); return; }
  MATERIALS_OK = ok;
  route();
  if (window.EVI && !HOME) EVI.home().then(h => { HOME = h; EVI.mountHome(h); }).catch(() => {});
  if (EVENT_DONE) return;
  try {
    await withTimeout(applyEvent(), 7000);
    EVENT_DONE = true;
    const y = scrollY; route(); scrollTo(0, y);
  } catch (e) {}
}
document.addEventListener('click', e => { if (e.target.closest('[data-retry]')) start(); });
start();
setInterval(() => {
  if (!MATERIALS_OK) return;
  const id = (location.hash || '#home').slice(1);
  renderSide(S[id] || DATA.OTHER[id] || M[id] ? id : (id || 'home'));
  if (!location.hash || id === 'home') { const y = scrollY; $('#view').innerHTML = vHome(); scrollTo(0, y); }
}, 60000);
</script>
</body>
</html>
